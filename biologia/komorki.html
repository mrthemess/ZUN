<style>
:root{--bg:#edf3ef;--paper:#fcfdfc;--ink:#14201a;--muted:#53645b;--line:#cfdcd4;--soft:#e2ede6;--acc:#1d7a58;--acc-t:#16684a;--acc-ink:#fff;--ok:#2e7d4f;--no:#b4432a;--focus:#c2571a;--stage:#f7fbf8;--hl:#e8a400;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--paper:#16201c;--ink:#e2ece6;--muted:#97a9a0;--line:#2a3a33;--soft:#1d2a25;--acc:#3fae84;--acc-t:#8fdcb8;--acc-ink:#08140f;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;--stage:#1b2722;--hl:#ffc233;color-scheme:dark}}

body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.015em;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}

header h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800}header p{margin:2px 0 0;color:var(--muted)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.9rem;border:0;background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 15px}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-size:.95rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 14px}
.btn:hover:not(:disabled){border-color:var(--acc)}.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px;min-width:0}
.card h2{margin:0 0 6px;font-size:1.45rem}.card h3{margin:14px 0 6px;font-size:1.12rem}
.card p{margin:0 0 10px}.card ul{margin:0 0 10px;padding-left:20px}.card li{margin:3px 0}
.note{font-size:.88rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;display:flex;gap:6px;align-items:center}
.chips button i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.chips button[aria-pressed=true]{border-color:var(--acc);background:var(--soft);color:var(--acc-t)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;border:0;background:var(--paper);color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);font-weight:700}
.bar .lbl{font-size:.88rem;color:var(--muted);font-weight:700}
label.ck{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:.95rem}
label.ck input{accent-color:var(--acc);width:18px;height:18px;margin:0}
/* model */
.mgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.stage{background:var(--stage);border:1.5px solid var(--line);border-radius:16px;padding:8px;margin-top:16px;min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stage svg{display:block;width:100%;height:auto}
.stage svg.model{max-height:min(580px,78vh)}
@media (max-width:640px){.scroll svg.wl{min-width:600px}}
.stage .cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:4px 6px 2px;font-size:.88rem;color:var(--muted)}
.org{cursor:pointer;transition:opacity .2s}.org:focus{outline:none}
.org:focus-visible{filter:url(#glowF)}
.org:hover{filter:brightness(1.07)}
.org.sel{filter:url(#glow)}
svg.has-sel .org:not(.sel){opacity:.42}
.org.good{filter:url(#glowOk)}.org.bad{filter:url(#glowNo)}
.lab{cursor:pointer}.lab text{fill:var(--ink);font-size:15px}.lab line{stroke:var(--muted)}.lab circle.dot{fill:var(--muted)}
.lab.sel text{font-weight:700;fill:var(--acc-t)}.lab.sel line{stroke:var(--acc-t);stroke-width:2}
.lab .nb{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}.lab .nt{font-weight:700;font-size:14px}
.ocard .kicker{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.75rem}
.ocard h2{font-size:1.6rem;margin:2px 0 10px}
dl.facts{display:grid;grid-template-columns:1fr;gap:0;margin:0;border-top:1px solid var(--line)}
dl.facts dt{color:var(--muted);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:9px}
dl.facts dd{margin:0;padding:2px 0 9px;border-bottom:1px solid var(--line)}
dl.facts dd.fn{font-weight:700}
.fun{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px}
.fun::before{content:"✨ "}
.tagl{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}.tagl li{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:.88rem;margin:0}
.intro{margin:12px 0 0;color:var(--muted)}

.tablewrap{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--soft);font-size:.88rem}
td.y{color:var(--ok);font-weight:700}td.n{color:var(--no);font-weight:700}
table.cmp{min-width:720px}table.diff{min-width:760px}table.diff td{text-align:left;font-size:.9rem}
sup{font-size:.7em}
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.ucard h3{margin-top:0;display:flex;gap:8px;align-items:center;font-size:1.2rem}

.steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.steps button{font:inherit;font-size:.85rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 10px}
.steps button[aria-current=step]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.cyc svg{display:block;width:100%;height:auto;max-height:340px}
.fadein{animation:fi .5s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fadein{animation:none}.org{transition:none}}
.cstep h3{margin:6px 0 4px}
/* size scale */
input[type=range]{width:100%;accent-color:var(--acc)}
.zoomv{font-weight:700;font-size:1.05rem}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700;background:var(--soft)}
/* quiz */
.q{font-size:1.2rem;font-weight:700;margin:4px 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;text-align:left}
.opts button:hover:not(:disabled){border-color:var(--acc)}
.opts button:disabled{cursor:default;color:var(--ink)}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opts button.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.fb{margin-top:14px;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.expl{margin:6px 0 12px}
.score{color:var(--muted);font-size:.95rem;margin:0 0 6px}
ul.feat{margin:0 0 14px;padding-left:22px}
/* worksheet */
.sheet{background:#fff;color:#111;border-radius:6px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 6px rgba(0,0,0,.15);font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.sheet h3{text-align:center;margin:0 0 10px;font-size:1.3rem;color:#111}
.sheet .tk{font-weight:700;margin:14px 0 2px}.sheet .ins{font-style:italic;margin:0 0 6px}
.sheet svg{display:block;width:auto;height:auto;max-width:100%;max-height:430px;margin:4px auto}
.sheet ol{columns:2;column-gap:28px;padding-left:24px;margin:4px 0}.sheet ol li{margin:6px 0;border-bottom:1px dotted #777;min-height:1.4em}
.sheet .bank{border:1px solid #444;padding:6px 10px;margin:4px 0 8px;font-size:.92rem}
.sheet .key{border-top:2px dashed #999;margin-top:18px;padding-top:8px}
.sheet .lab text{fill:#111}.sheet .lab line{stroke:#444}.sheet .lab .nb{fill:#fff;stroke:#111}.sheet .lab circle.dot{fill:#444}
.wsopt{display:grid;gap:12px}
.status{font-size:.9rem;color:var(--muted);margin-left:4px}
@media (max-width:820px){.mgrid,.ugrid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.hr{align-items:flex-start}.sheet ol{columns:1}}
@media (max-width:480px){.seg button{padding:6px 9px;font-size:.86rem}.card{padding:14px 14px}.sheet{padding:14px 12px}}

</style>

 membrane:{n:['Błona komórkowa','Cell membrane'],s:['Cienka, elastyczna warstwa zbudowana z dwóch warstw lipidów (fosfolipidów) z wbudowanymi białkami.','A thin, flexible layer made of a double layer of lipids (phospholipids) with proteins built into it.'],f:['Oddziela wnętrze komórki od otoczenia i decyduje, co wchodzi do komórki, a co z niej wychodzi (jest półprzepuszczalna). Odbiera też sygnały z otoczenia.','Separates the inside of the cell from its surroundings and controls what goes in and out (it is partially permeable). It also picks up signals from outside.'],a:['Jak bramka z ochroną – wpuszcza tylko to, co trzeba.','Like a gate with security guards – it only lets in what is needed.'],x:['Błona nie jest sztywna – lipidy i białka stale się w niej przemieszczają. Taki opis nazywa się modelem płynnej mozaiki.','The membrane isn’t rigid – its lipids and proteins keep moving around. This is called the fluid mosaic model.'],q:['regulowanie, jakie substancje wnikają do komórki i z niej wychodzą','controlling which substances enter and leave the cell'],no:['wall_cel','wall_chit','wall_mur','pellicle','envelope','capsule']},
 cytoplasm:{n:['Cytoplazma','Cytoplasm'],s:['Galaretowata substancja wypełniająca komórkę – głównie woda z rozpuszczonymi solami, cukrami i białkami (cytozol). Zawieszone są w niej organella.','A jelly-like substance filling the cell – mostly water with dissolved salts, sugars and proteins (the cytosol). The organelles are suspended in it.'],f:['Tu zachodzi wiele reakcji chemicznych, np. pierwszy etap rozkładu glukozy (glikoliza). Cytoplazma łączy wszystkie części komórki i umożliwia transport substancji.','Many chemical reactions happen here, e.g. the first stage of breaking down glucose (glycolysis). It links all parts of the cell and lets substances move around.'],a:['Jak hala fabryczna, w której stoją wszystkie maszyny.','Like a factory floor where all the machines stand.'],x:['W wielu komórkach cytoplazma stale krąży – u roślin ten ruch nazywa się cyklozą i widać go pod mikroskopem po przesuwających się chloroplastach.','In many cells the cytoplasm keeps flowing – in plants this is called cytoplasmic streaming, and under a microscope you can see the chloroplasts drifting along.']},
 nucleus:{n:['Jądro komórkowe','Nucleus'],s:['Duże, zwykle kuliste organellum otoczone podwójną błoną (otoczką jądrową) z porami. W środku znajdują się DNA (chromatyna) i jąderko.','A large, usually round organelle surrounded by a double membrane (the nuclear envelope) with pores. Inside are the DNA (chromatin) and the nucleolus.'],f:['Przechowuje informację genetyczną (DNA) i kieruje wszystkimi procesami życiowymi komórki. Bierze udział w podziale komórki.','Stores the genetic information (DNA) and controls all of the cell’s life processes. It takes part in cell division.'],a:['Jak centrum dowodzenia z biblioteką instrukcji.','Like a control centre with a library of instructions.'],x:['Gdyby rozwinąć DNA z jednego jądra komórki człowieka, miałoby ok. 2 metrów długości.','If you unwound the DNA from a single human cell nucleus, it would be about 2 metres long.'],q:['przechowywanie informacji genetycznej i kierowanie pracą komórki','storing genetic information and controlling the cell’s activities'],no:['nucleoid','chromatin','nuclei','macro','micro','plasmid','nucleolus']},
 envelope:{n:['Otoczka jądrowa','Nuclear envelope'],s:['Dwie błony otaczające jądro, przedziurawione porami jądrowymi. Zewnętrzna błona łączy się z siateczką śródplazmatyczną.','Two membranes around the nucleus, with nuclear pores running through them. The outer membrane is continuous with the endoplasmic reticulum.'],f:['Oddziela DNA od cytoplazmy. Przez pory jądrowe przechodzą m.in. cząsteczki RNA (z jądra) i białka (do jądra).','Separates the DNA from the cytoplasm. Molecules such as RNA (out of the nucleus) and proteins (into it) pass through the nuclear pores.'],a:['Jak mur z bramami wokół skarbca.','Like a wall with gates around a vault.'],x:['Jedno jądro może mieć kilka tysięcy porów, a każdy z nich to złożona „bramka” zbudowana z ok. 30 rodzajów białek.','A single nucleus can have several thousand pores, and each one is a complex gateway built from about 30 kinds of protein.']},
 nucleolus:{n:['Jąderko','Nucleolus'],s:['Gęsty, ciemniejszy obszar wewnątrz jądra, nieotoczony błoną.','A dense, darker area inside the nucleus, with no membrane around it.'],f:['Tu powstają podjednostki rybosomów (z rRNA i białek), które potem wędrują do cytoplazmy.','This is where ribosome subunits are made (from rRNA and proteins); they then move out into the cytoplasm.'],a:['Jak warsztat produkujący części do maszyn wytwarzających białka.','Like a workshop making parts for the protein-building machines.'],x:['Komórki, które wytwarzają dużo białek, mają duże jąderka – czasem nawet kilka.','Cells that make lots of protein have big nucleoli – sometimes even several.'],q:['wytwarzanie podjednostek rybosomów','making ribosome subunits'],no:['ribo','nucleus','rer','er','chromatin']},
 chromatin:{n:['Chromatyna','Chromatin'],s:['Nici DNA nawinięte na białka (histony). Podczas podziału komórki zwijają się w chromosomy.','Strands of DNA wound around proteins (histones). During cell division they coil up into chromosomes.'],f:['Zawiera geny – zapis informacji o budowie białek i cechach organizmu.','Contains the genes – the coded information for building proteins and for the organism’s traits.'],a:['Jak długa nić z zapisanym przepisem.','Like a long thread with a recipe written along it.'],x:['DNA jest nawinięte na histony jak nić na szpulki – dzięki temu mieści się w malutkim jądrze.','DNA is wrapped around histones like thread on reels – that’s how it fits into the tiny nucleus.']},
 mito:{n:['Mitochondria','Mitochondria'],s:['Owalne organella otoczone dwiema błonami; wewnętrzna tworzy pofałdowania (grzebienie). Mają własne, koliste DNA i rybosomy.','Oval organelles with two membranes; the inner one is folded into ridges (cristae). They have their own circular DNA and ribosomes.'],f:['Przeprowadzają oddychanie komórkowe (tlenowe): rozkładają związki organiczne, np. glukozę, z udziałem tlenu i uwalniają energię, magazynowaną w ATP.','Carry out (aerobic) cellular respiration: they break down organic compounds such as glucose using oxygen and release energy, which is stored in ATP.'],a:['Jak elektrownia komórki.','Like the cell’s power station.'],x:['Mitochondria dziedziczymy prawie wyłącznie po matce – pochodzą z komórki jajowej.','We inherit our mitochondria almost entirely from our mother – they come from the egg cell.'],q:['uwalnianie energii w procesie oddychania komórkowego','releasing energy through cellular respiration'],no:['chloro','cytoplasm']},
 ribo:{n:['Rybosomy','Ribosomes'],s:['Bardzo małe, ziarniste struktury bez błon, zbudowane z RNA i białek, z dwóch podjednostek. Występują swobodnie w cytoplazmie lub na siateczce śródplazmatycznej.','Tiny granules with no membrane, made of RNA and protein and built from two subunits. They float freely in the cytoplasm or sit on the endoplasmic reticulum.'],f:['Wytwarzają białka – łączą aminokwasy w łańcuch według instrukcji zapisanej w RNA.','Make proteins – they join amino acids into a chain following instructions carried by RNA.'],a:['Jak maszyny składające białka według przepisu.','Like assembly machines that build proteins from a recipe.'],x:['W cytoplazmie eukariontów są rybosomy 80S, a u bakterii mniejsze – 70S. Niektóre antybiotyki blokują tylko rybosomy bakterii.','Eukaryotic cytoplasm has 80S ribosomes, while bacteria have smaller 70S ones. Some antibiotics block only the bacterial ones.'],q:['synteza (wytwarzanie) białek','protein synthesis (making proteins)'],no:['rer','er','nucleolus','golgi','nucleus']},
 er:{n:['Siateczka śródplazmatyczna','Endoplasmic reticulum'],s:['Sieć kanalików i spłaszczonych woreczków z błon, połączona z otoczką jądrową. Część siateczki pokrywają rybosomy (szorstka), część jest ich pozbawiona (gładka).','A network of membrane tubes and flattened sacs, connected to the nuclear envelope. Part of it is covered with ribosomes (rough) and part has none (smooth).'],f:['Transportuje substancje wewnątrz komórki. Na siateczce szorstkiej powstają białka, a na gładkiej – tłuszcze (lipidy).','Transports substances around the cell. Proteins are made on the rough part and lipids (fats) on the smooth part.'],a:['Jak sieć korytarzy i taśmociągów w fabryce.','Like a network of corridors and conveyor belts in a factory.'],x:['Siateczka śródplazmatyczna może zajmować ponad połowę wszystkich błon w komórce.','The endoplasmic reticulum can make up more than half of all the membranes in a cell.'],q:['transport substancji wewnątrz komórki oraz udział w wytwarzaniu białek i tłuszczów','transporting substances within the cell and helping to make proteins and lipids'],no:['golgi','cytosk','vesicle','ribo','cytoplasm']},
 rer:{n:['Siateczka śródplazmatyczna szorstka','Rough endoplasmic reticulum'],s:['Spłaszczone woreczki z błon, z rybosomami przyczepionymi od zewnątrz – dlatego wyglądają na „szorstkie”.','Flattened membrane sacs with ribosomes stuck to the outside – which is why they look “rough”.'],f:['Przyczepione rybosomy wytwarzają białka, które siateczka modyfikuje i przesyła dalej, głównie do aparatu Golgiego.','The attached ribosomes make proteins, which the reticulum modifies and sends on, mainly to the Golgi apparatus.'],a:['Jak linia montażowa z robotami (rybosomami).','Like an assembly line lined with robots (the ribosomes).'],x:['Komórki trzustki, które produkują enzymy trawienne, są wręcz wypełnione siateczką szorstką.','Pancreas cells that make digestive enzymes are packed with rough ER.'],q:['modyfikowanie i transport białek wytworzonych przez przyczepione do niej rybosomy','modifying and transporting proteins made by the ribosomes attached to it'],no:['ribo','golgi','ser','vesicle']},
 ser:{n:['Siateczka śródplazmatyczna gładka','Smooth endoplasmic reticulum'],s:['Sieć rurkowatych kanalików z błon, bez rybosomów.','A network of tube-like membrane channels with no ribosomes.'],f:['Wytwarza lipidy (np. składniki błon i niektóre hormony), magazynuje jony wapnia i unieszkodliwia niektóre trucizny i leki.','Makes lipids (e.g. membrane components and some hormones), stores calcium ions and breaks down some poisons and drugs.'],a:['Jak wytwórnia tłuszczów połączona z oczyszczalnią.','Like a fat factory combined with a detox plant.'],x:['Komórki wątroby osób, które przyjmują dużo leków, mogą mieć wyraźnie więcej siateczki gładkiej.','Liver cells of people who take a lot of medicines can have noticeably more smooth ER.'],q:['wytwarzanie lipidów i unieszkodliwianie niektórych trucizn','making lipids and breaking down some poisons'],no:['perox','rer','lyso']},
 golgi:{n:['Aparat Golgiego','Golgi apparatus'],s:['Stos kilku spłaszczonych, wygiętych woreczków z błon (cystern), od których odrywają się pęcherzyki.','A stack of several flattened, curved membrane sacs (cisternae) that pinch off small vesicles.'],f:['Modyfikuje, sortuje i pakuje białka i inne substancje w pęcherzyki, a potem wysyła je w odpowiednie miejsce – także poza komórkę (wydzielanie). Wytwarza lizosomy.','Modifies, sorts and packages proteins and other substances into vesicles, then sends them where they are needed – including out of the cell (secretion). It also makes lysosomes.'],a:['Jak sortownia paczek na poczcie.','Like a post office sorting and packing parcels.'],x:['Nazwa pochodzi od włoskiego lekarza Camilla Golgiego, który opisał to organellum w 1898 roku.','It is named after the Italian doctor Camillo Golgi, who described it in 1898.'],q:['sortowanie, pakowanie i wydzielanie substancji w pęcherzykach','sorting, packaging and secreting substances in vesicles'],no:['er','rer','ser','vesicle']},
 lyso:{n:['Lizosomy','Lysosomes'],s:['Małe pęcherzyki otoczone jedną błoną, wypełnione enzymami trawiennymi.','Small vesicles with a single membrane, filled with digestive enzymes.'],f:['Trawią (rozkładają) zużyte części komórki, pobrane cząstki pokarmu oraz bakterie wchłonięte przez komórkę.','Digest (break down) worn-out parts of the cell, food particles taken in, and bacteria the cell has swallowed.'],a:['Jak ekipa sprzątająca z recyklingiem.','Like a cleaning and recycling crew.'],x:['Enzymy lizosomów działają w kwaśnym środowisku (pH ok. 5). Gdyby wyciekły do cytoplazmy, prawie by nie działały – to chroni komórkę.','Lysosome enzymes work in acidic conditions (about pH 5). If they leaked into the cytoplasm they would hardly work – which protects the cell.'],q:['trawienie zużytych organelli i cząstek pobranych przez komórkę','digesting worn-out organelles and particles taken into the cell'],no:['vacuole','foodvac','perox','ser']},
 centro:{n:['Centrosom (centriole)','Centrosome (centrioles)'],s:['Obszar w pobliżu jądra z dwiema centriolami – walcami z 9 trójek mikrotubul, ustawionymi prostopadle do siebie.','An area near the nucleus with two centrioles – cylinders made of 9 triplets of microtubules, set at right angles to each other.'],f:['Organizuje mikrotubule cytoszkieletu; podczas podziału komórki tworzy wrzeciono podziałowe, które rozdziela chromosomy.','Organises the microtubules of the cytoskeleton; during cell division it builds the spindle that pulls the chromosomes apart.'],a:['Jak brygadzista, który rozpina liny podczas przeprowadzki chromosomów.','Like a foreman setting up the ropes to move the chromosomes.'],x:['Komórki roślin nasiennych nie mają centrioli, a mimo to bez problemu tworzą wrzeciono podziałowe.','Seed-plant cells have no centrioles, yet they still build a spindle without any trouble.'],q:['tworzenie wrzeciona podziałowego podczas podziału komórki','forming the spindle during cell division'],no:['cytosk','nucleus','chromatin']},
 perox:{n:['Peroksysomy','Peroxisomes'],s:['Małe pęcherzyki otoczone jedną błoną, zawierające enzymy, m.in. katalazę.','Small vesicles with a single membrane, containing enzymes such as catalase.'],f:['Rozkładają szkodliwy nadtlenek wodoru (H₂O₂) na wodę i tlen, unieszkodliwiają niektóre trucizny i rozkładają kwasy tłuszczowe.','Break down harmful hydrogen peroxide (H₂O₂) into water and oxygen, neutralise some poisons and break down fatty acids.'],a:['Jak oczyszczalnia toksycznych odpadów.','Like a toxic-waste treatment plant.'],x:['To katalaza sprawia, że woda utleniona pieni się na ranie.','Catalase is what makes hydrogen peroxide fizz on a cut.'],q:['rozkład szkodliwego nadtlenku wodoru (H₂O₂)','breaking down harmful hydrogen peroxide (H₂O₂)'],no:['ser','lyso','mito']},
 cytosk:{n:['Cytoszkielet','Cytoskeleton'],s:['Sieć włókien białkowych: mikrotubul, mikrofilamentów (aktynowych) i filamentów pośrednich.','A network of protein fibres: microtubules, microfilaments (actin) and intermediate filaments.'],f:['Nadaje komórce kształt, podtrzymuje organella, umożliwia ruch komórki i transport pęcherzyków wewnątrz niej.','Gives the cell its shape, holds the organelles in place, and lets the cell move and transport vesicles around inside it.'],a:['Jak rusztowanie i tory kolejowe jednocześnie.','Like scaffolding and a railway network at the same time.'],x:['Białka motoryczne dosłownie „kroczą” po mikrotubulach, niosąc pęcherzyki – jak tragarze po linie.','Motor proteins literally “walk” along microtubules carrying vesicles – like porters on a rope.'],q:['podtrzymywanie kształtu komórki i przemieszczanie organelli w jej wnętrzu','supporting the cell’s shape and moving organelles around inside it'],no:['wall_cel','wall_chit','wall_mur','centro','pellicle','vacuole','cilia','flagE','flagB','er','membrane']},
 vesicle:{n:['Małe wodniczki (pęcherzyki)','Small vacuoles (vesicles)'],s:['Drobne pęcherzyki otoczone jedną błoną, wypełnione płynem lub przenoszonymi substancjami. W komórce zwierzęcej są małe i często tymczasowe.','Tiny sacs with a single membrane, filled with fluid or substances being carried. In animal cells they are small and often temporary.'],f:['Przenoszą i przechowują substancje – np. pobrane z zewnątrz (endocytoza) albo przeznaczone do wydzielenia (egzocytoza).','Carry and store substances – e.g. ones taken in from outside (endocytosis) or ones to be released (exocytosis).'],a:['Jak przesyłki kurierskie krążące po komórce.','Like courier parcels moving around the cell.'],x:['Neurony przekazują sygnały, wypuszczając z pęcherzyków neuroprzekaźniki.','Neurons pass on signals by releasing neurotransmitters from vesicles.']},
 wall_cel:{n:['Ściana komórkowa (z celulozy)','Cell wall (cellulose)'],s:['Sztywna warstwa na zewnątrz błony, zbudowana głównie z włókien celulozy (wielocukru).','A stiff layer outside the membrane, made mainly of cellulose fibres (a polysaccharide).'],f:['Chroni komórkę, nadaje jej stały kształt i zapobiega pęknięciu, gdy komórka nasiąka wodą. Przepuszcza wodę i rozpuszczone w niej substancje.','Protects the cell, gives it a fixed shape and stops it bursting when it takes in water. It lets water and dissolved substances through.'],a:['Jak mur obronny wokół zamku.','Like the defensive wall around a castle.'],x:['Celuloza to najpowszechniejszy związek organiczny na Ziemi – robi się z niej papier, a bawełna to niemal czysta celuloza.','Cellulose is the most common organic compound on Earth – paper is made from it, and cotton is almost pure cellulose.'],q:['ochrona komórki roślinnej i nadawanie jej stałego kształtu (warstwa z celulozy)','protecting a plant cell and giving it a fixed shape (a layer made of cellulose)'],no:['membrane','wall_chit','wall_mur','pellicle','vacuole','cytosk','capsule']},
 wall_chit:{n:['Ściana komórkowa (z chityny)','Cell wall (chitin)'],s:['Sztywna warstwa na zewnątrz błony, zbudowana głównie z chityny.','A stiff layer outside the membrane, made mainly of chitin.'],f:['Chroni komórkę grzyba, nadaje jej kształt i zapobiega pęknięciu.','Protects the fungal cell, gives it its shape and stops it bursting.'],a:['Jak zbroja.','Like a suit of armour.'],x:['Z chityny zbudowane są też pancerzyki owadów i skorupiaków.','Insect and crustacean shells are also made of chitin.'],q:['ochrona komórki grzyba i nadawanie jej kształtu (warstwa z chityny)','protecting a fungal cell and giving it its shape (a layer made of chitin)'],no:['membrane','wall_cel','wall_mur','pellicle','vacuole','cytosk','capsule']},
 wall_mur:{n:['Ściana komórkowa (z mureiny)','Cell wall (murein)'],s:['Warstwa na zewnątrz błony zbudowana z mureiny (peptydoglikanu) – sieci łańcuchów cukrowych połączonych krótkimi łańcuchami aminokwasów.','A layer outside the membrane made of murein (peptidoglycan) – a mesh of sugar chains cross-linked by short chains of amino acids.'],f:['Nadaje bakterii kształt (np. pałeczki lub ziarniaka) i chroni ją przed pęknięciem.','Gives the bacterium its shape (e.g. a rod or a sphere) and stops it bursting.'],a:['Jak siatkowy gorset.','Like a mesh corset.'],x:['Penicylina blokuje budowę mureiny, więc rosnąca bakteria pęka. Komórki człowieka nie mają mureiny, dlatego penicylina im nie szkodzi.','Penicillin blocks the building of murein, so the growing bacterium bursts. Human cells have no murein, so penicillin doesn’t harm them.'],q:['nadawanie kształtu komórce bakterii (warstwa z mureiny)','giving a bacterial cell its shape (a layer made of murein)'],no:['membrane','wall_cel','wall_chit','pellicle','capsule','cytosk']},
 chloro:{n:['Chloroplasty','Chloroplasts'],s:['Zielone organella otoczone dwiema błonami. Wewnątrz mają stosy błon (tylakoidy tworzące grana) z chlorofilem oraz własne, koliste DNA.','Green organelles with two membranes. Inside are stacks of membranes (thylakoids forming grana) containing chlorophyll, plus their own circular DNA.'],f:['Przeprowadzają fotosyntezę: dzięki energii światła wytwarzają glukozę z dwutlenku węgla i wody, uwalniając tlen.','Carry out photosynthesis: using light energy, they make glucose from carbon dioxide and water, releasing oxygen.'],a:['Jak panele słoneczne połączone z kuchnią.','Like solar panels connected to a kitchen.'],x:['W jednej komórce liścia może być od kilkudziesięciu do ponad 100 chloroplastów.','A single leaf cell can contain from a few dozen to over 100 chloroplasts.'],q:['fotosynteza – wytwarzanie glukozy z użyciem energii światła','photosynthesis – making glucose using light energy'],no:['amylo','stigma','mito']},
 vacuole:{n:['Wakuola (wodniczka)','Vacuole'],s:['Pęcherz otoczony pojedynczą błoną (tonoplastem), wypełniony sokiem komórkowym – wodą z rozpuszczonymi solami, cukrami i barwnikami.','A sac with a single membrane (the tonoplast), filled with cell sap – water with dissolved salts, sugars and pigments.'],f:['Magazynuje wodę i różne substancje, utrzymuje jędrność komórki (turgor) i gromadzi zbędne produkty przemiany materii. U roślin i grzybów przejmuje też funkcję lizosomów – trawi zbędne składniki komórki.','Stores water and various substances, keeps the cell firm (turgor) and collects waste products. In plants and fungi it also does the job of lysosomes – digesting unwanted cell material.'],a:['Jak zbiornik na wodę i magazyn w jednym.','Like a water tank and storeroom in one.'],x:['Barwniki rozpuszczone w soku komórkowym (antocyjany) nadają kolor płatkom bratków i korzeniowi buraka.','Pigments dissolved in the cell sap (anthocyanins) give pansy petals and beetroot their colour.'],q:['magazynowanie wody i utrzymywanie jędrności (turgoru) komórki roślinnej','storing water and keeping a plant cell firm (turgor)'],no:['cvac','vesicle','wall_cel','foodvac','lyso','amylo']},
 plasmod:{n:['Plazmodesmy','Plasmodesmata'],s:['Cienkie kanały przechodzące przez ściany sąsiednich komórek, wyściełane błoną.','Thin channels through the walls of neighbouring cells, lined with membrane.'],f:['Łączą cytoplazmę sąsiednich komórek roślinnych – przepływają przez nie woda, substancje odżywcze i sygnały.','Connect the cytoplasm of neighbouring plant cells – water, nutrients and signals flow through them.'],a:['Jak drzwi między sąsiednimi mieszkaniami.','Like doors between neighbouring flats.'],x:['Niektóre wirusy roślin, np. wirus mozaiki tytoniu, rozprzestrzeniają się po roślinie właśnie przez plazmodesmy.','Some plant viruses, such as tobacco mosaic virus, spread through the plant via plasmodesmata.'],q:['łączenie cytoplazmy sąsiednich komórek roślinnych','connecting the cytoplasm of neighbouring plant cells'],no:['membrane','wall_cel']},
 amylo:{n:['Amyloplasty (ziarna skrobi)','Amyloplasts (starch grains)'],s:['Bezbarwne plastydy otoczone dwiema błonami, wypełnione ziarnami skrobi.','Colourless plastids with two membranes, filled with starch grains.'],f:['Magazynują skrobię – główny materiał zapasowy roślin. Dużo ich jest w bulwach ziemniaka i w nasionach.','Store starch – plants’ main storage material. Potato tubers and seeds are full of them.'],a:['Jak spiżarnia.','Like a pantry.'],x:['Amyloplasty w czapeczce korzenia działają jak pion murarski – opadają w dół i pomagają korzeniowi rosnąć w stronę ziemi.','Amyloplasts in the root cap act like a plumb line – they sink downwards and help the root grow towards the ground.'],q:['magazynowanie skrobi','storing starch'],no:['vacuole','chloro','storage','paramylon']},
 storage:{n:['Materiał zapasowy (glikogen, krople tłuszczu)','Storage material (glycogen, fat droplets)'],s:['Ziarna glikogenu i kropelki tłuszczu zawieszone w cytoplazmie – nieotoczone błoną białkowo-lipidową jak organella.','Glycogen granules and fat droplets suspended in the cytoplasm – not wrapped in a membrane like the organelles.'],f:['Zapas energii i budulca na gorsze czasy. Grzyby, podobnie jak zwierzęta, magazynują glikogen, a nie skrobię.','A reserve of energy and building material for hard times. Like animals, fungi store glycogen, not starch.'],a:['Jak zapasy w spiżarni.','Like supplies in a pantry.'],x:['To, że grzyby magazynują glikogen i mają chitynę, a nie celulozę, to jedna ze wskazówek, że są bliżej spokrewnione ze zwierzętami niż z roślinami.','Storing glycogen and having chitin rather than cellulose are among the clues that fungi are more closely related to animals than to plants.'],q:['magazynowanie glikogenu i tłuszczu w komórce grzyba','storing glycogen and fat in a fungal cell'],no:['vacuole','amylo','paramylon','lyso']},
 nucleoid:{n:['Nukleoid (DNA)','Nucleoid (DNA)'],s:['Obszar cytoplazmy, w którym leży kolista cząsteczka DNA (chromosom bakteryjny). Nie jest otoczony błoną – bakteria nie ma jądra.','An area of the cytoplasm containing a circular DNA molecule (the bacterial chromosome). It has no membrane around it – bacteria have no nucleus.'],f:['Zawiera informację genetyczną bakterii i kieruje jej procesami życiowymi.','Holds the bacterium’s genetic information and controls its life processes.'],a:['Jak instrukcja obsługi rozłożona na stole, a nie zamknięta w szafie.','Like an instruction manual left open on the table rather than locked in a cupboard.'],x:['Kolisty chromosom E. coli ma ok. 1,5 mm długości – kilkaset razy więcej niż sama bakteria.','The circular chromosome of E. coli is about 1.5 mm long – several hundred times longer than the bacterium itself.'],q:['przechowywanie głównego DNA w komórce, która nie ma jądra','holding the main DNA in a cell that has no nucleus'],no:['plasmid','nucleus','chromatin','nuclei','macro','micro']},
 capsule:{n:['Otoczka śluzowa','Slime capsule'],s:['Galaretowata warstwa (głównie z wielocukrów) na zewnątrz ściany komórkowej. Mają ją tylko niektóre bakterie.','A jelly-like layer (mainly polysaccharides) outside the cell wall. Only some bacteria have one.'],f:['Chroni bakterię przed wysychaniem i przed komórkami odpornościowymi gospodarza, pomaga też przyczepiać się do powierzchni.','Protects the bacterium from drying out and from the host’s immune cells, and helps it stick to surfaces.'],a:['Jak płaszcz przeciwdeszczowy z warstwą kleju.','Like a raincoat with a sticky coating.'],x:['Bakterie z otoczką są często groźniejsze – np. dwoinki zapalenia płuc bez otoczki prawie nie wywołują choroby.','Bacteria with a capsule are often more dangerous – e.g. pneumococci without a capsule hardly cause disease at all.'],q:['ochrona bakterii przed wysychaniem i komórkami odpornościowymi','protecting a bacterium from drying out and from immune cells'],no:['wall_mur','pili','membrane']},
 flagB:{n:['Rzęska (wić bakteryjna)','Flagellum (bacterial)'],s:['Długa, cienka nić z białka (flageliny), osadzona w błonie i ścianie w obrotowym „silniczku”.','A long, thin thread of protein (flagellin), anchored in the membrane and wall by a rotating motor.'],f:['Umożliwia ruch – obraca się jak śruba napędowa statku.','Lets the bacterium move – it spins like a ship’s propeller.'],a:['Jak śruba napędowa motorówki.','Like the propeller of a motorboat.'],x:['Silnik rzęski bakteryjnej może wykonywać ponad 10 000 obrotów na minutę.','The motor of a bacterial flagellum can spin at more than 10,000 revolutions per minute.'],q:['ruch bakterii – obraca się jak śruba napędowa','moving the bacterium – it spins like a propeller'],no:['pili','flagE','cilia','cytosk']},
 pili:{n:['Fimbrie (pile)','Fimbriae (pili)'],s:['Krótkie, cienkie i liczne białkowe wypustki na powierzchni bakterii.','Short, thin and numerous protein projections on the surface of the bacterium.'],f:['Pozwalają przyczepiać się do powierzchni i komórek gospodarza. Specjalne pile płciowe służą do przekazywania DNA (np. plazmidów) innej bakterii – to koniugacja.','Help the bacterium stick to surfaces and host cells. Special sex pili are used to pass DNA (e.g. plasmids) to another bacterium – this is conjugation.'],a:['Jak haczyki rzepu na kurtce.','Like the hooks of Velcro on a jacket.'],x:['Dzięki fimbriom pałeczki E. coli mogą trzymać się ścian dróg moczowych mimo przepływu moczu.','Fimbriae let E. coli cling to the walls of the urinary tract even with urine flowing past.'],q:['przyczepianie się bakterii do powierzchni i komórek gospodarza','attaching the bacterium to surfaces and host cells'],no:['capsule','flagB','plasmid']},
 plasmid:{n:['Plazmidy','Plasmids'],s:['Małe, koliste cząsteczki DNA poza nukleoidem.','Small circular DNA molecules separate from the nucleoid.'],f:['Zawierają dodatkowe geny, np. oporności na antybiotyki. Bakterie mogą przekazywać je sobie nawzajem.','Carry extra genes, e.g. for antibiotic resistance. Bacteria can pass them to one another.'],a:['Jak pendrive z dodatkowymi programami.','Like a USB stick with extra apps.'],x:['Plazmidy wykorzystuje się w inżynierii genetycznej – tak powstały np. bakterie wytwarzające ludzką insulinę.','Plasmids are used in genetic engineering – for example to make bacteria that produce human insulin.'],q:['przechowywanie dodatkowych genów, np. oporności na antybiotyki','carrying extra genes, e.g. for antibiotic resistance'],no:['nucleoid','nucleus','chromatin','pili','micro','macro','nuclei']},
 stigma:{n:['Plamka oczna (stigma)','Eyespot (stigma)'],s:['Czerwona plamka z barwników (karotenoidów) przy nasadzie wici.','A red patch of pigments (carotenoids) near the base of the flagellum.'],f:['Razem z fotoreceptorem u nasady wici pozwala wyczuć kierunek światła, dzięki czemu euglena płynie w stronę światła (fototaksja).','Together with a light sensor at the base of the flagellum, it lets euglena sense where light is coming from, so it can swim towards it (phototaxis).'],a:['Jak prosty czujnik światła.','Like a simple light sensor.'],x:['Plamka oczna nie jest okiem – nie widzi obrazów, tylko rzuca cień na fotoreceptor i w ten sposób „mówi”, skąd pada światło.','The eyespot isn’t an eye – it can’t see images; it just casts a shadow on the light sensor to show where the light is coming from.'],q:['wykrywanie kierunku, z którego pada światło','sensing which direction light is coming from'],no:['chloro']},
 flagE:{n:['Wić (witka)','Flagellum'],s:['Długa, ruchliwa nić z wiązki mikrotubul okrytej błoną, wyrastająca z przedniego końca komórki.','A long, whip-like thread made of a bundle of microtubules covered by membrane, growing from the front end of the cell.'],f:['Służy do ruchu – wykonuje ruchy falujące i „ciągnie” euglenę przez wodę.','Used for swimming – it beats in waves and pulls euglena through the water.'],a:['Jak wiosło albo ogon napędowy.','Like an oar or a whipping tail.'],x:['Wić eukariontów ma inną budowę niż rzęska bakterii: w środku jest układ mikrotubul 9 par + 2 – taki sam jak w witce plemnika.','A eukaryotic flagellum is built differently from a bacterial one: inside is a 9 + 2 pattern of microtubules – the same as in a sperm cell’s tail.'],q:['pływanie eugleny – jedna długa, falująca nić','euglena swimming – a single long, waving thread'],no:['cilia','flagB','cytosk','pili']},
 cvac:{n:['Wodniczka tętniąca','Contractile vacuole'],s:['Pęcherzyk, który rytmicznie napełnia się wodą i opróżnia (kurczy się – „tętni”). U pantofelka ma promieniście ułożone kanaliki doprowadzające.','A vacuole that fills with water and empties again in a steady rhythm (it contracts, or “pulses”). In paramecium it has radiating channels feeding into it.'],f:['Usuwa nadmiar wody, która stale napływa do komórki z wody słodkiej (osmoza). Bez niej komórka by pękła.','Pumps out the excess water that keeps flowing into the cell from fresh water (osmosis). Without it the cell would burst.'],a:['Jak pompa wypompowująca wodę z przeciekającej łodzi.','Like a bilge pump bailing water out of a leaking boat.'],x:['W słodkiej wodzie wodniczka tętniąca pantofelka może opróżniać się nawet co kilka sekund.','In fresh water, a paramecium’s contractile vacuole can empty as often as every few seconds.'],q:['usuwanie nadmiaru wody z komórki protista słodkowodnego','removing excess water from a freshwater protist cell'],no:['vacuole','vesicle','foodvac','cytopyge','membrane']},
 pellicle:{n:['Pellikula','Pellicle'],s:['Elastyczna warstwa białkowych pasków pod błoną komórkową. Zastępuje ścianę komórkową.','A flexible layer of protein strips under the cell membrane. It takes the place of a cell wall.'],f:['Nadaje komórce kształt, ale pozwala jej się wyginać i zmieniać kształt podczas ruchu.','Gives the cell its shape but still lets it bend and change shape as it moves.'],a:['Jak elastyczny kombinezon nurka.','Like a flexible wetsuit.'],x:['Dzięki pellikuli euglena potrafi pełzać, rytmicznie zmieniając kształt – to tzw. ruch euglenoidalny.','Thanks to its pellicle, euglena can crawl by rhythmically changing shape – this is called euglenoid movement.'],q:['nadawanie kształtu komórce protista w miejsce ściany komórkowej','giving a protist cell its shape in place of a cell wall'],no:['cytosk','membrane','wall_cel','wall_chit','wall_mur','capsule']},
 paramylon:{n:['Ziarna paramylonu','Paramylon grains'],s:['Białawe ziarna wielocukru (paramylonu) w cytoplazmie.','Whitish grains of a polysaccharide (paramylon) in the cytoplasm.'],f:['Materiał zapasowy eugleny – zapas energii na czas, gdy brakuje światła.','Euglena’s storage material – an energy reserve for when there isn’t enough light.'],a:['Jak zapasowa bateria.','Like a spare battery.'],x:['Paramylon przypomina skrobię, ale cząsteczki glukozy są w nim połączone inaczej (wiązaniami β-1,3), więc nie barwi się płynem Lugola na granatowo.','Paramylon is similar to starch but its glucose units are linked differently (β-1,3 bonds), so it doesn’t turn blue-black with iodine solution.'],q:['magazynowanie materiału zapasowego u eugleny','storing reserve material in euglena'],no:['amylo','storage','vacuole','chloro']},
 cilia:{n:['Rzęski','Cilia'],s:['Tysiące krótkich, włoskowatych wypustek pokrywających całą komórkę. Mają taką budowę jak wić (9 par + 2 mikrotubule).','Thousands of short, hair-like projections covering the whole cell. They are built like a flagellum (9 pairs + 2 microtubules).'],f:['Poruszają się falami i napędzają komórkę; rzęski przy lejku gębowym nagarniają pokarm.','Beat in waves to push the cell along; the cilia around the mouth area sweep in food.'],a:['Jak wiosła całej osady wioślarskiej.','Like the oars of a rowing crew.'],x:['Pantofelek ma kilka tysięcy rzęsek i przepływa ok. 1 mm na sekundę – kilka długości własnego ciała.','A paramecium has several thousand cilia and swims about 1 mm a second – several times its own length.'],q:['ruch pantofelka i nagarnianie pokarmu – tysiące krótkich wypustek','moving a paramecium and sweeping in food – thousands of short projections'],no:['flagE','flagB','oral','groove','cytosk','pili','trich']},
 nuclei:{n:['Jądro duże i jądro małe','Large and small nucleus'],s:['Pantofelek ma dwa rodzaje jąder: duże jądro (makronukleus) i małe jądro (mikronukleus).','Paramecium has two kinds of nucleus: a large one (the macronucleus) and a small one (the micronucleus).'],f:['Jądro duże kieruje codziennymi czynnościami życiowymi komórki, a jądro małe przechowuje informację genetyczną przekazywaną podczas rozmnażania płciowego.','The large nucleus controls the cell’s everyday activities, while the small nucleus holds the genetic information passed on during sexual reproduction.'],a:['Jak kierownik zmiany i archiwum.','Like a shift manager and an archive.'],x:['Podczas koniugacji jądro duże się rozpada, a nowe powstaje z jądra małego.','During conjugation the large nucleus breaks down and a new one forms from the small nucleus.']},
 macro:{n:['Makronukleus (jądro duże)','Macronucleus (large nucleus)'],s:['Duże, fasolkowate jądro zawierające wiele kopii części genów.','A large, bean-shaped nucleus containing many copies of some of the genes.'],f:['Kieruje bieżącymi procesami życiowymi: przemianą materii, wzrostem i ruchem.','Controls everyday life processes: metabolism, growth and movement.'],a:['Jak kierownik codziennej pracy fabryki.','Like the manager running the factory day to day.'],x:['Podczas koniugacji makronukleus się rozpada, a nowy powstaje z mikronukleusu.','During conjugation the macronucleus breaks down and a new one forms from the micronucleus.'],q:['kierowanie bieżącymi czynnościami życiowymi pantofelka','controlling the paramecium’s everyday activities'],no:['micro','nucleus','nuclei','nucleoid','chromatin']},
 micro:{n:['Mikronukleus (jądro małe)','Micronucleus (small nucleus)'],s:['Małe, kuliste jądro leżące przy makronukleusie.','A small, round nucleus lying next to the macronucleus.'],f:['Przechowuje informację genetyczną, która jest wymieniana i przekazywana podczas rozmnażania płciowego (koniugacji).','Holds the genetic information that is exchanged and passed on during sexual reproduction (conjugation).'],a:['Jak archiwum z oryginałami dokumentów.','Like an archive of original documents.'],x:['Niektóre gatunki pantofelków mają kilka mikronukleusów – Paramecium caudatum zwykle ma jeden.','Some paramecium species have several micronuclei – Paramecium caudatum usually has just one.'],q:['udział w rozmnażaniu płciowym (koniugacji) pantofelka','taking part in sexual reproduction (conjugation) in paramecium'],no:['macro','nucleus','nuclei','nucleoid','plasmid','pili','chromatin']},
 foodvac:{n:['Wodniczki pokarmowe','Food vacuoles'],s:['Pęcherzyki z pokarmem (np. bakteriami), powstające przy cytostomie.','Vacuoles containing food (e.g. bacteria) that form at the cytostome.'],f:['Trawią pokarm – łączą się z lizosomami, a strawione składniki przechodzą do cytoplazmy. W tym czasie wędrują po komórce.','Digest food – they fuse with lysosomes, and the digested nutrients pass into the cytoplasm. They travel around the cell as this happens.'],a:['Jak żołądki w miniaturze.','Like miniature stomachs.'],x:['Gdy pantofelek zje drożdże zabarwione czerwienią Kongo, widać, jak wodniczki zmieniają kolor, gdy ich wnętrze staje się kwaśne.','If a paramecium eats yeast stained with Congo red, you can watch its food vacuoles change colour as they turn acidic inside.'],q:['trawienie pokarmu wewnątrz komórki pantofelka','digesting food inside a paramecium'],no:['lyso','vacuole','cvac','oral','vesicle']},
 oral:{n:['Lejek gębowy (cytostom)','Oral funnel (cytostome)'],nA:['Cytostom (otwór gębowy)','Cytostome (cell mouth)'],s:['Zagłębienie w komórce zakończone otworem gębowym, przez który pokarm dostaje się do wnętrza komórki.','A dip in the cell surface ending in a cell mouth, through which food gets into the cell.'],f:['Pobieranie pokarmu: rzęski nagarniają bakterie i drobne cząstki do otworu gębowego, gdzie powstają wodniczki pokarmowe.','Taking in food: cilia sweep bacteria and small particles into the cell mouth, where food vacuoles form.'],a:['Jak usta z lejkiem.','Like a mouth with a funnel.'],x:['Pantofelek potrafi odrzucać część niejadalnych cząstek, zanim trafią do wodniczki pokarmowej.','A paramecium can reject some inedible particles before they reach a food vacuole.'],q:['pobieranie pokarmu przez pantofelka','taking in food in paramecium'],no:['groove','foodvac','cilia','cytopyge']},
 groove:{n:['Bruzda gębowa','Oral groove'],s:['Wgłębienie biegnące skośnie wzdłuż jednego boku komórki, wyściełane rzęskami.','A hollow running diagonally along one side of the cell, lined with cilia.'],f:['Kieruje wodę z pokarmem w stronę cytostomu.','Channels water carrying food towards the cytostome.'],a:['Jak rynna prowadząca do wejścia.','Like a gutter leading to the entrance.'],x:['To bruzda gębowa nadaje pantofelkowi charakterystyczny kształt podeszwy buta.','The oral groove is what gives a paramecium its typical slipper-sole shape.']},
 cytopyge:{n:['Cytopyge (otwór wydalniczy)','Cytoproct (anal pore)'],s:['Stałe miejsce w pellikuli, przez które komórka usuwa niestrawione resztki.','A fixed spot in the pellicle through which the cell gets rid of undigested waste.'],f:['Usuwa niestrawione resztki pokarmu z wodniczek pokarmowych.','Gets rid of undigested food remains from the food vacuoles.'],a:['Jak zsyp na śmieci.','Like a rubbish chute.'],x:['Cytopyge widać tylko w chwili usuwania resztek – przez resztę czasu jest zamknięte.','The cytoproct is only visible while waste is being expelled – the rest of the time it is closed.'],q:['usuwanie niestrawionych resztek pokarmu','getting rid of undigested food remains'],no:['cvac','foodvac','lyso','oral','vacuole']},
 trich:{n:['Trichocysty','Trichocysts'],s:['Wrzecionowate pęcherzyki ułożone tuż pod pellikulą, zawierające zwiniętą nić białkową.','Spindle-shaped sacs just under the pellicle, each containing a coiled protein thread.'],f:['Są wystrzeliwane w razie zagrożenia – służą prawdopodobnie do obrony przed drapieżnikami.','Fired out when the cell is threatened – they probably help defend it against predators.'],a:['Jak harpuny w pogotowiu.','Like harpoons held at the ready.'],x:['Wystrzelona nić trichocysty jest kilka razy dłuższa niż przed wystrzeleniem.','A fired trichocyst thread is several times longer than it was before firing.'],q:['obrona przed drapieżnikami – wystrzeliwane nici','defence against predators – threads that shoot out'],no:['cilia','capsule','pellicle','pili']},
 // ---- wirusy ----
 head:{n:['Główka (kapsyd)','Head (capsid)'],s:['Białkowy płaszcz w kształcie wydłużonego dwudziestościanu, zbudowany z wielu jednakowych podjednostek – kapsomerów.','A protein coat shaped like an elongated icosahedron, built from many identical subunits called capsomeres.'],f:['Chroni materiał genetyczny wirusa (DNA), który jest w nim ciasno upakowany.','Protects the virus’s genetic material (DNA), which is packed tightly inside.'],a:['Jak sejf z cennym ładunkiem.','Like a safe holding precious cargo.'],x:['DNA jest wtłaczane do główki przez białkowy „silnik” pod tak dużym ciśnieniem, że ułatwia ono potem wstrzyknięcie DNA do bakterii.','The DNA is packed into the head by a protein motor at such high pressure that this later helps push it into the bacterium.']},
 vdna:{n:['DNA wirusa','Viral DNA'],s:['Długa cząsteczka dwuniciowego DNA ciasno zwinięta w główce.','A long, double-stranded DNA molecule coiled tightly in the head.'],f:['Zawiera geny wirusa – instrukcję, którą komórka bakterii wykona, budując nowe wirusy.','Carries the virus’s genes – instructions the bacterial cell will follow to build new viruses.'],a:['Jak pendrive z wirusem komputerowym.','Like a USB stick carrying a computer virus.'],x:['Bakteriofag T4 ma ok. 170 tysięcy par nukleotydów DNA – to jeden z większych genomów wirusów.','Phage T4 has about 170,000 base pairs of DNA – one of the larger viral genomes.']},
 collar:{n:['Kołnierz','Collar'],s:['Krótki pierścień białek łączący główkę z ogonkiem.','A short ring of proteins linking the head to the tail.'],f:['Łączy główkę z ogonkiem; tędy DNA przechodzi z główki do ogonka.','Joins the head to the tail; the DNA passes this way from the head into the tail.'],a:['Jak szyjka butelki.','Like the neck of a bottle.'],x:['Do kołnierza przyczepione są krótkie „wąsy”, które pomagają zamocować włókienka ogonowe podczas składania wirusa.','Short “whiskers” attached to the collar help fit the tail fibres when the virus is assembled.']},
 tail:{n:['Ogonek (pochewka)','Tail (sheath)'],s:['Pusta w środku rurka otoczona kurczliwą pochewką białkową.','A hollow tube surrounded by a contractile protein sheath.'],f:['Po przyczepieniu się do bakterii pochewka kurczy się, a rurka przebija ścianę komórkową – jak strzykawka. Przez nią DNA wnika do bakterii.','Once the phage is attached, the sheath contracts and the tube pierces the cell wall – like a syringe. The DNA passes through it into the bacterium.'],a:['Jak igła strzykawki.','Like a syringe needle.'],x:['Po skurczu pochewka jest mniej więcej o połowę krótsza.','After contracting, the sheath is roughly half as long.']},
 fibres:{n:['Włókienka ogonowe','Tail fibres'],s:['Sześć długich włókien białkowych, zgiętych w połowie jak kolano.','Six long protein fibres, each bent halfway like a knee.'],f:['Rozpoznają i wiążą swoiste receptory na powierzchni bakterii – dlatego fag atakuje tylko określony gatunek.','Recognise and bind specific receptors on the bacterium’s surface – which is why a phage attacks only a particular species.'],a:['Jak nogi lądownika księżycowego.','Like the legs of a lunar lander.'],x:['Bakteriofagi są najliczniejszymi „istotami” na Ziemi – szacuje się, że jest ich ok. 10³¹.','Bacteriophages are the most numerous biological entities on Earth – an estimated 10³¹ of them.']},
 baseplate:{n:['Płytka podstawowa','Baseplate'],s:['Sześciokątna płytka z białek na końcu ogonka, z krótkimi kolcami.','A hexagonal protein plate at the end of the tail, with short spikes.'],f:['Mocuje wirusa do powierzchni bakterii i uruchamia skurcz pochewki.','Anchors the virus to the bacterium’s surface and triggers the sheath to contract.'],a:['Jak stopa z kotwicą.','Like a foot with an anchor.'],x:['Płytka podstawowa zawiera enzym, który robi „dziurkę” w ścianie bakterii.','The baseplate carries an enzyme that makes a small hole in the bacterial wall.']},
 venv:{n:['Otoczka lipidowa','Lipid envelope'],s:['Błona z lipidów pochodząca z błony komórki gospodarza, z wbudowanymi białkami wirusa. Mają ją tylko niektóre wirusy.','A lipid membrane taken from the host cell’s membrane, with viral proteins built into it. Only some viruses have one.'],f:['Chroni wnętrze wirusa i pomaga mu wniknąć do komórki – otoczka zlewa się z błoną komórki gospodarza.','Protects the inside of the virus and helps it get into a cell – the envelope fuses with the host cell’s membrane.'],a:['Jak przebranie uszyte z ubrania gospodarza.','Like a disguise made from the host’s own clothes.'],x:['Mydło rozpuszcza lipidy otoczki – dlatego mycie rąk tak skutecznie niszczy wirusy grypy i SARS-CoV-2.','Soap dissolves the lipid envelope – which is why handwashing destroys flu viruses and SARS-CoV-2 so well.']},
 spikes:{n:['Kolce białkowe','Protein spikes'],s:['Białka wystające z otoczki. U wirusa grypy są dwa rodzaje: hemaglutynina (H) i neuraminidaza (N).','Proteins sticking out of the envelope. The flu virus has two kinds: haemagglutinin (H) and neuraminidase (N).'],f:['Rozpoznają receptory na komórkach gospodarza i pozwalają wirusowi się do nich przyczepić, a nowym wirusom – uwolnić się z komórki.','Recognise receptors on host cells and let the virus attach to them, and let new viruses break free from the cell.'],a:['Jak klucze pasujące do konkretnych zamków.','Like keys that fit particular locks.'],x:['Od nich pochodzą nazwy szczepów grypy, np. H1N1 czy H3N2.','Flu strains are named after them, e.g. H1N1 or H3N2.']},
 ha:{n:['Hemaglutynina (H)','Haemagglutinin (H)'],s:['Pałeczkowate białko otoczki, występujące w trójkach (trimerach).','A rod-shaped envelope protein that comes in groups of three (trimers).'],f:['Przyczepia wirusa do receptorów (kwasu sialowego) na komórkach nabłonka dróg oddechowych i umożliwia wniknięcie do komórki.','Attaches the virus to receptors (sialic acid) on cells lining the airways and lets it get into the cell.'],a:['Jak klucz do drzwi komórki.','Like the key to the cell’s front door.'],x:['Hemaglutynina ciągle się zmienia, dlatego skład szczepionki przeciw grypie aktualizuje się co roku.','Haemagglutinin keeps changing, which is why the flu vaccine is updated every year.']},
 na:{n:['Neuraminidaza (N)','Neuraminidase (N)'],s:['Grzybkowate białko otoczki (enzym), występujące w czwórkach.','A mushroom-shaped envelope protein (an enzyme) that comes in groups of four.'],f:['Odcina kwas sialowy z powierzchni komórki, dzięki czemu nowe wirusy mogą się uwolnić i zarażać kolejne komórki.','Cuts sialic acid off the cell surface so that new viruses can break free and infect more cells.'],a:['Jak nożyczki przecinające cumy.','Like scissors cutting the mooring ropes.'],x:['Niektóre leki przeciw grypie (np. oseltamiwir) działają, blokując neuraminidazę.','Some flu drugs (e.g. oseltamivir) work by blocking neuraminidase.']},
 m1:{n:['Białko macierzy (M1)','Matrix protein (M1)'],s:['Warstwa białek tuż pod otoczką lipidową.','A layer of protein just beneath the lipid envelope.'],f:['Nadaje wirusowi kształt i łączy otoczkę z materiałem genetycznym; pomaga składać nowe wirusy.','Gives the virus its shape and links the envelope to the genetic material; helps assemble new viruses.'],a:['Jak stelaż pod tkaniną namiotu.','Like the frame under a tent’s fabric.'],x:['Białko M1 jest najliczniejszym białkiem w cząstce wirusa grypy.','M1 is the most plentiful protein in a flu virus particle.']},
 rnp:{n:['Materiał genetyczny (RNA)','Genetic material (RNA)'],nA:['RNA w 8 odcinkach (nukleokapsydy)','RNA in 8 segments (nucleocapsids)'],s:['Jednoniciowe RNA podzielone na 8 osobnych odcinków, każdy owinięty białkiem (nukleoproteiną) – razem tworzą nukleokapsydy.','Single-stranded RNA split into 8 separate pieces, each wrapped in protein (nucleoprotein) – together these form the nucleocapsids.'],f:['Zawiera geny wirusa grypy. Dzięki podziałowi na odcinki różne wirusy grypy mogą wymieniać się nimi – tak powstają nowe szczepy.','Carries the flu virus’s genes. Because it is split into segments, different flu viruses can swap pieces – which is how new strains arise.'],a:['Jak instrukcja wydrukowana na 8 osobnych kartkach.','Like an instruction manual printed on 8 separate pages.'],x:['Wymiana odcinków RNA między wirusami ptasimi, świńskimi i ludzkimi doprowadziła do pandemii grypy, m.in. w 2009 roku.','Swapping RNA segments between bird, pig and human flu viruses led to flu pandemics, including the one in 2009.']},
 tmvcap:{n:['Kapsyd spiralny','Helical capsid'],s:['Ok. 2130 jednakowych podjednostek białkowych (kapsomerów) ułożonych spiralnie wokół RNA – razem tworzą sztywną pałeczkę.','About 2,130 identical protein subunits (capsomeres) arranged in a spiral around the RNA, forming a stiff rod.'],f:['Chroni RNA wirusa. Ten wirus nie ma otoczki lipidowej.','Protects the virus’s RNA. This virus has no lipid envelope.'],a:['Jak spiralne schody owinięte wokół poręczy.','Like a spiral staircase wound around a handrail.'],x:['Wirus mozaiki tytoniu był pierwszym odkrytym wirusem (Dmitrij Iwanowski 1892, Martinus Beijerinck 1898).','Tobacco mosaic virus was the first virus ever discovered (Dmitri Ivanovsky 1892, Martinus Beijerinck 1898).']},
 capsomere:{n:['Kapsomer','Capsomere'],s:['Pojedyncza podjednostka białkowa kapsydu.','A single protein subunit of the capsid.'],f:['Z tysięcy identycznych kapsomerów wirus „składa” cały kapsyd – dzięki temu wystarcza mu jeden gen na białko kapsydu.','The virus builds the whole capsid from thousands of identical capsomeres – so a single gene for the capsid protein is enough.'],a:['Jak pojedynczy klocek w budowli z klocków.','Like a single brick in a building made of identical bricks.'],x:['Kapsyd wirusa mozaiki tytoniu potrafi sam złożyć się w probówce z oczyszczonego białka i RNA.','The TMV capsid can assemble itself in a test tube from purified protein and RNA.']},
 tmvrna:{n:['RNA wirusa','Viral RNA'],s:['Jedna nić RNA ułożona spiralnie wewnątrz kapsydu.','A single strand of RNA coiled in a spiral inside the capsid.'],f:['Zawiera geny wirusa; w komórce rośliny od razu służy jako instrukcja do wytwarzania białek wirusa.','Carries the virus’s genes; inside a plant cell it acts straight away as instructions for making viral proteins.'],a:['Jak taśma z nagranym programem.','Like a tape with a program recorded on it.'],x:['Wirus mozaiki tytoniu jest bardzo trwały – w suszonych liściach tytoniu może przetrwać wiele lat.','Tobacco mosaic virus is very hardy – it can survive for many years in dried tobacco leaves.']},
 spikeS:{n:['Białko S (kolec)','Spike protein (S)'],s:['Duże białka wystające z otoczki, które tworzą „koronę” wokół wirusa – stąd nazwa koronawirus.','Large proteins sticking out from the envelope, forming a “crown” around the virus – hence the name coronavirus.'],f:['Wiąże się z receptorem ACE2 na komórkach człowieka i umożliwia wniknięcie wirusa.','Binds to the ACE2 receptor on human cells and lets the virus get in.'],a:['Jak klucz dopasowany do zamka komórki.','Like a key cut to fit the cell’s lock.'],x:['Szczepionki mRNA przeciw COVID-19 uczą organizm rozpoznawać właśnie białko S.','mRNA COVID-19 vaccines teach the body to recognise exactly this spike protein.']},
 covrna:{n:['RNA z białkiem N','RNA with N protein'],s:['Jedna długa nić RNA (ok. 30 tysięcy nukleotydów) owinięta białkiem nukleokapsydu (N).','One long strand of RNA (about 30,000 nucleotides) wrapped in nucleocapsid protein (N).'],f:['Zawiera geny wirusa; w komórce człowieka służy jako instrukcja do wytwarzania białek wirusa.','Carries the virus’s genes; inside a human cell it acts as instructions for making viral proteins.'],a:['Jak zwój z instrukcją.','Like a scroll of instructions.'],x:['To jeden z najdłuższych genomów RNA wśród wirusów.','It is one of the longest RNA genomes of any virus.']},
 mprot:{n:['Białko M (błonowe)','Membrane protein (M)'],s:['Białko wbudowane w otoczkę – najliczniejsze w cząstce wirusa.','A protein built into the envelope – the most plentiful one in the virus particle.'],f:['Nadaje otoczce kształt i pomaga składać nowe wirusy.','Shapes the envelope and helps assemble new viruses.'],a:['Jak szkielet namiotu.','Like the poles of a tent.'],x:['Oprócz białek S i M w otoczce jest też niewielkie białko E.','Besides the S and M proteins, the envelope also contains a small E protein.']},
};

function arcs(cx,cy,rx,ry,a0,a1,offs,ribo){
  const rad=d=>d*Math.PI/180;let s='',h='';
  for(const o of offs){const Rx=rx+o,Ry=ry+o;const sx=cx+Rx*Math.cos(rad(a0)),sy=cy+Ry*Math.sin(rad(a0)),ex=cx+Rx*Math.cos(rad(a1)),ey=cy+Ry*Math.sin(rad(a1));
    const d=`M${f1(sx)} ${f1(sy)} A${Rx} ${Ry} 0 0 1 ${f1(ex)} ${f1(ey)}`;
    s+=`<path d="${d}" fill="none" stroke="#3f7fbf" stroke-width="8" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#9cc8ee" stroke-width="4.5" stroke-linecap="round"/>`;h+=hit(d,12);
    if(ribo)for(let a=a0+6;a<a1;a+=11){s+=`<circle cx="${f1(cx+(Rx+6)*Math.cos(rad(a)))}" cy="${f1(cy+(Ry+6)*Math.sin(rad(a)))}" r="2.3" fill="#4b2f7a"/>`;}}
  return h+s;
}

// układanie podpisów po bokach
function layoutLabels(items){
  const out=[];
  for(const side of ['L','R']){
    const g=items.filter(i=>i.side===side).sort((a,b)=>a.a[1]-b.a[1]);
    const hgt=i=>i.lines.length>1?38:26;
    let y=22;g.forEach(i=>{i.y=Math.max(i.a[1],y+(i.prev||0));y=i.y;i.prev=0;});
    // przesuwanie z kolizjami
    for(let k=1;k<g.length;k++){const need=(hgt(g[k-1])+hgt(g[k]))/2;if(g[k].y-g[k-1].y<need)g[k].y=g[k-1].y+need;}
    const maxY=H-18;
    if(g.length&&g[g.length-1].y>maxY){g[g.length-1].y=maxY;for(let k=g.length-2;k>=0;k--){const need=(hgt(g[k])+hgt(g[k+1]))/2;if(g[k+1].y-g[k].y<need)g[k].y=g[k+1].y-need;}}
    if(g.length&&g[0].y<16){g[0].y=16;for(let k=1;k<g.length;k++){const need=(hgt(g[k-1])+hgt(g[k]))/2;if(g[k].y-g[k-1].y<need)g[k].y=g[k-1].y+need;}}
    out.push(...g);
  }
  return out;
}
function wrap(s,max=22){if(s.length<=max)return[s];const k=s.indexOf(' (');if(k>0&&k<=max+3&&s.length-k-1<=max+4)return[s.slice(0,k),s.slice(k+1)];const w=s.split(' ');let a='',b='';for(const x of w){if(!b&&(a+' '+x).trim().length<=max)a=(a+' '+x).trim();else b=(b+' '+x).trim();}return b?[a,b]:[a];}
/* opt: {lvl, labels:'names'|'none'|'num', sel, nums:{id:n}, exp:true (kolory na sztywno), cls, title, quiz:{good,bad}} */
function drawModel(type,opt){
  const lvl=opt.lvl||S.lvl,parts=partsOf(type,lvl),seen=new Set();
  const qz=opt.quiz||{};
  let g='';
  for(const p of parts){const first=!seen.has(p.e);seen.add(p.e);
    const cls='org'+(opt.sel===p.e?' sel':'')+(qz.good===p.e?' good':'')+(qz.bad===p.e?' bad':'');
    const nm=esc(nameIn(p.e,lvl));
    g+=opt.exp?`<g>${p.g}</g>`:`<g class="${cls}" data-o="${p.e}"${first&&!opt.noTab?` tabindex="0" role="button" aria-label="${nm}"${opt.sel===p.e?' aria-pressed="true"':''}`:''}>${p.g}</g>`;}
  let lab='';
  if(opt.labels!=='none'){
    const items=[];const done=new Set();
    for(const p of parts){if(done.has(p.e))continue;done.add(p.e);
      if(opt.labels==='num'&&!(opt.nums&&opt.nums[p.e]))continue;
      const text=opt.labels==='num'?String(opt.nums[p.e]):nameIn(p.e,lvl);
      items.push({id:p.e,a:p.a,side:p.a[0]<CX?'L':'R',lines:opt.labels==='num'?[text]:wrap(text)});}
    const LX=BOX[type][0]-14,RX=BOX[type][1]+14;
    const ink=opt.exp?'#1c2621':null,mut=opt.exp?'#56645c':null;
    for(const i of layoutLabels(items)){
      const L1=i.side==='L',tx=L1?LX:RX,lx=L1?LX+6:RX-6;
      const num=opt.labels==='num';
      const sel=opt.sel===i.id?' sel':'';
      const lineEnd=num?(L1?tx+14:tx-14):lx;
      lab+=`<g class="lab${sel}" data-o="${i.id}"${opt.exp?'':' aria-hidden="true"'}><line x1="${num?(L1?tx+12:tx-12):lx}" y1="${f1(i.y)}" x2="${f1(i.a[0])}" y2="${f1(i.a[1])}" stroke-width="1.4"${mut?` stroke="${mut}"`:''}/><circle class="dot" cx="${f1(i.a[0])}" cy="${f1(i.a[1])}" r="2.6"${mut?` fill="${mut}"`:''}/>`;
      if(num)lab+=`<circle class="nb" cx="${L1?tx:tx}" cy="${f1(i.y)}" r="12"${opt.exp?' fill="#fff" stroke="#111" stroke-width="1.5"':''}/><text class="nt" x="${tx}" y="${f1(i.y+5)}" text-anchor="middle"${opt.exp?' fill="#111" font-weight="700" font-size="14"':''}>${esc(i.lines[0])}</text>`;
      else{const y0=i.y-(i.lines.length-1)*8.5+5;lab+=`<text x="${L1?tx-2:tx+2}" y="${f1(y0)}" text-anchor="${L1?'end':'start'}"${ink?` fill="${ink}" font-size="15"`:''}>${i.lines.map((t,k)=>`<tspan x="${L1?tx-2:tx+2}" dy="${k?17:0}">${esc(t)}</tspan>`).join('')}</text>`;}
      lab+='</g>';
    }
  }
  const name=T((CT[type]||VT[type]).n);
  let side=opt.labels==='num'?40:opt.labels==='none'?24:190;if(opt.title)side=Math.max(side,150);const vx=BOX[type][0]-14-side,vw=BOX[type][1]-BOX[type][0]+28+2*side;
  const title=opt.title?`<text x="${BOX[type][0]-14-side+12}" y="28" font-size="20" font-weight="700" fill="#1c2621">${esc(opt.title)}</text>`:'';
  const ff=opt.exp?` font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"`:'';
  const wl=opt.labels!=='none'?' wl':'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vx} 0 ${vw} ${H}" width="${vw}" height="${H}" class="model${wl}${opt.sel&&!opt.exp?' has-sel':''} ${opt.cls||''}" role="group" aria-label="${esc(tr('Schemat: ','Diagram: ')+name)}"${ff}>${DEFS}${opt.bg?`<rect x="${vx}" width="${vw}" height="${H}" fill="${opt.bg}"/>`:''}${title}${g}${lab}</svg>`;
}
// SVG → PNG (canvas)
function svgToCanvas(svg,w,h,bg='#fff'){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c);};img.onerror=e=>{URL.revokeObjectURL(u);rej(e);};img.src=u;});}
const toPng=(svg,w,h)=>svgToCanvas(svg,w,h).then(c=>new Promise((res,rej)=>c.toBlob(b=>b?b.arrayBuffer().then(res):rej(),'image/png')));
let DL={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:'saved'};}};
if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{if(d)DL=d;}).catch(()=>{});
function exportSVG(type,labels){
  const nm=T((CT[type]||VT[type]).n)+(KIND(type)==='cell'?` – ${S.lvl==='A'?tr('poziom rozszerzony','advanced level'):tr('poziom podstawowy','basic level')}`:'');
  return drawModel(type,{lvl:S.lvl,labels,exp:true,bg:'#ffffff',title:nm});
}
const dims=svg=>{const m=svg.match(/viewBox="[-\d.]+ 0 ([\d.]+) ([\d.]+)"/);return[+m[1],+m[2]];};
async function pngDataURL(type){const sv=exportSVG(type,S.labels?'names':'none'),[w,h]=dims(sv);const c=await svgToCanvas(sv,w*2,h*2);return c.toDataURL('image/png');}
async function downloadPng(type){
  const sv=exportSVG(type,S.labels?'names':'none'),[w,h]=dims(sv);const c=await svgToCanvas(sv,w*2,h*2);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const fname=`${T((CT[type]||VT[type]).n)} – ${S.labels?tr('schemat z podpisami','labelled diagram'):tr('schemat bez podpisów','blank diagram')}.png`;
  await DL.save({filename:fname,data:blob});return fname;
}

   <li>${tr('<b>Otoczka lipidowa</b> – tylko u niektórych wirusów (np. grypy, SARS-CoV-2, HIV); pochodzi z błony komórki gospodarza.','<b>Lipid envelope</b> – only in some viruses (e.g. flu, SARS-CoV-2, HIV); it comes from the host cell’s membrane.')}</li>
   <li>${tr('<b>Białka powierzchniowe (kolce)</b> – rozpoznają i wiążą receptory komórki, którą wirus może zarazić.','<b>Surface proteins (spikes)</b> – recognise and bind the receptors of the cells the virus can infect.')}</li></ul>

   ${chips}${toolbar('virus')}<p class="intro">${esc(T(VT[S.virus].d))}</p>
   <div class="mgrid">${stage(S.virus,'virus',S.vorg)}<div>${S.vorg?orgCard(S.vorg,S.virus):partList(S.virus)}</div></div>
   <section class="card cyc"><h2>${tr('Jak bakteriofag namnaża się w bakterii?','How does a phage multiply inside a bacterium?')}</h2>

    <p>${tr('Gdy prawdziwy wirus zaatakuje, organizm rozpoznaje go od razu i reaguje szybko – choroba nie rozwija się albo przebiega łagodnie. To odporność swoista nabyta sztucznie (czynnie).','When the real virus attacks, the body recognises it straight away and responds quickly – so the illness doesn’t develop or is mild. This is artificially acquired (active) specific immunity.')}</p></section>
   <section class="card ucard"><h3><span aria-hidden="true">🌿</span>${tr('Nie tylko ludzie chorują','Not just humans get ill')}</h3>

   <div class="scroll"><svg viewBox="0 0 760 60" style="min-width:560px;color:var(--ink)" role="img" aria-label="${esc(tr('Oś wielkości od 0,1 nm do 1 m','Size axis from 0.1 nm to 1 m'))}"><style>.svt{fill:var(--ink)}</style>${axis}</svg></div>
   <p class="note"><span class="badge" style="background:${LIM[2].c};color:#fff">${tr('mikroskop elektronowy','electron microscope')}</span> ${tr('od ok. 0,1 nm','from about 0.1 nm')} · <span class="badge" style="background:${LIM[1].c};color:#fff">${tr('mikroskop świetlny','light microscope')}</span> ${tr('od ok. 0,2 µm','from about 0.2 µm')} · <span class="badge" style="background:${LIM[0].c};color:#fff">${tr('oko','naked eye')}</span> ${tr('od ok. 0,1 mm','from about 0.1 mm')}</p>`;

function osmText(){
  const k=S.osmC+'.'+S.osmS;
  const M={
   'animal.hypo':['Roztwór hipotoniczny (np. woda destylowana): na zewnątrz jest mniej substancji rozpuszczonych niż w komórce. Woda napływa do komórki, komórka pęcznieje i – bez ściany komórkowej – może pęknąć (u krwinek czerwonych to hemoliza).','Hypotonic solution (e.g. distilled water): there are fewer dissolved substances outside than inside the cell. Water flows in, the cell swells and – with no cell wall – it can burst (in red blood cells this is called haemolysis).'],
   'animal.iso':['Roztwór izotoniczny (np. sól fizjologiczna 0,9% NaCl): stężenia w komórce i na zewnątrz są takie same. Woda przepływa w obie strony w równym tempie – komórka nie zmienia kształtu.','Isotonic solution (e.g. 0.9% saline): the concentrations inside and outside the cell are equal. Water moves both ways at the same rate – the cell keeps its shape.'],
   'animal.hyper':['Roztwór hipertoniczny (np. stężona solanka): na zewnątrz jest więcej substancji rozpuszczonych. Woda wypływa z komórki, która się kurczy i marszczy.','Hypertonic solution (e.g. strong salt water): there are more dissolved substances outside. Water flows out of the cell, which shrinks and shrivels.'],
   'plant.hypo':['Roztwór hipotoniczny: woda napływa do wakuoli, protoplast mocno napiera na ścianę komórkową – komórka jest jędrna (turgor). Sztywna ściana nie pozwala jej pęknąć. Dzięki turgorowi rośliny zielne stoją prosto.','Hypotonic solution: water flows into the vacuole and the protoplast presses firmly against the cell wall – the cell is turgid (firm). The stiff wall stops it bursting. Turgor is what keeps soft-stemmed plants upright.'],
   'plant.iso':['Roztwór izotoniczny: woda przepływa w obie strony w równym tempie. Komórka nie jest w pełni jędrna – rośliny w takich warunkach lekko więdną.','Isotonic solution: water moves both ways at the same rate. The cell isn’t fully firm – plants in these conditions wilt slightly.'],
   'plant.hyper':['Roztwór hipertoniczny: woda wypływa z wakuoli, protoplast kurczy się i odstaje od ściany komórkowej – to plazmoliza. Po przeniesieniu do wody komórka może wrócić do normy (deplazmoliza).','Hypertonic solution: water flows out of the vacuole, and the protoplast shrinks and pulls away from the cell wall – this is plasmolysis. Put back in water, the cell can recover (deplasmolysis).'],
  };
  return [T(M[k])];
}

function newQ(){

    const ds=pool.filter(i=>!bad.has(i)&&!(ORG[i].no||[]).includes(ans));S.q={k,ans,opts:shuffle([ans,...pick(ds,3)]),picked:null};return;}

function wsBuild(){

  return gs.map((g,gi)=>{const r=rngOf(ws.seed*7+gi*1013+1);const tasks=[];let no=0;
    for(const type of ORDER.filter(t=>ws.cells.includes(t))){
      const ids=effIds(type,S.lvl),n=ws.n&&ws.n<ids.length?ws.n:ids.length;
      let chosen;if(gi&&prev[type]&&n<ids.length){const rest=ids.filter(i=>!prev[type].includes(i));chosen=[...shuffle(rest,r),...shuffle(prev[type],r)].slice(0,n);chosen=shuffle(chosen,r);}else chosen=pick(ids,n,r);
      prev[type]=chosen;const nums={};chosen.forEach((id,i)=>nums[id]=i+1);
      tasks.push({no:++no,kind:'label',type,ids:chosen,nums});
      if(ws.func){const f=pick(chosen.filter(i=>i!=='cytoplasm'),3,r).sort((a,b)=>nums[a]-nums[b]);tasks.push({no:++no,kind:'func',type,ids:f,nums});}
    }

}

   <div class="bar" style="margin-top:0">${lvlSeg()}<span class="lbl" id="wsnL">${tr('Liczba elementów na schemacie','Parts per diagram')}</span><div class="seg" role="group" aria-labelledby="wsnL">${[[0,tr('wszystkie','all')],[6,'6'],[8,'8'],[10,'10']].map(([v,l])=>`<button data-wsn="${v}" aria-pressed="${ws.n===v}">${l}</button>`).join('')}</div></div>
   <div class="bar" style="margin-top:0"><label class="ck"><input type="checkbox" data-wsopt="bank" ${ws.bank?'checked':''}> ${tr('Dodaj ramkę z nazwami','Add a box of names')}</label>
   <label class="ck"><input type="checkbox" data-wsopt="func" ${ws.func?'checked':''}> ${tr('Dodaj zadanie o funkcjach','Add a task on functions')}</label>
   <label class="ck"><input type="checkbox" data-wsopt="groups" ${ws.groups?'checked':''}> ${tr('Dwie grupy (A i B)','Two groups (A and B)')}</label>
   <label class="ck"><input type="checkbox" data-wsopt="key" ${ws.key?'checked':''}> ${tr('Dołącz klucz odpowiedzi','Include an answer key')}</label></div>
   <div class="bar" style="margin-top:0"><button class="btn" data-act="wsNew">${tr('🎲 Losuj numerację','🎲 Shuffle the numbering')}</button><button class="btn primary" data-act="docx" ${ws.cells.length?'':'disabled'}>${tr('Pobierz kartę (Word)','Download worksheet (Word)')}</button><span class="status" role="status">${S.wsSt?esc(T(STATUS[S.wsSt])):''}</span></div></div></section>`;
  if(!ws.cells.length)return opt+`<p class="note" style="margin-top:14px">${tr('Wybierz co najmniej jedną komórkę.','Choose at least one cell.')}</p>`;
  const sheets=data.map(({g,tasks})=>`<article class="sheet" aria-label="${esc(wsTitle(g))}"><h3>${esc(wsTitle(g))}</h3><p>${tr('Imię i nazwisko','Name')}: ..................................................................</p><p class="ins">${tr('Przyjrzyj się schematom i wykonaj zadania.','Look carefully at the diagrams and complete the tasks.')}</p>
    ${tasks.map(t=>`<p class="tk">${tr('Zadanie','Task')} ${t.no}.</p><p class="ins">${esc(taskText(t))}</p>${t.kind==='label'?`${wsSVG(t)}${ws.bank?`<div class="bank">${bankNames(t).map(esc).join(' • ')}</div>`:''}<ol>${t.ids.map(()=>'<li></li>').join('')}</ol>`:''}`).join('')}
    ${ws.key?`<div class="key"><p class="tk">${tr('Klucz odpowiedzi (dla nauczyciela)','Answer key (for the teacher)')}${g?` – ${tr('grupa','group')} ${g}`:''}</p>${tasks.map(t=>`<p><b>${tr('Zadanie','Task')} ${t.no}:</b> ${esc(keyText(t))}</p>`).join('')}</div>`:''}</article>`).join('');
  return opt+sheets;
}
async function buildDocx(){
  const D=window.docx,F='Kohinoor Bangla',ws=S.ws,data=wsBuild();
  const R=(t,o={})=>new D.TextRun(Object.assign({text:t,font:F,color:'000000',size:22},o));const Pp=(r,o={})=>new D.Paragraph(Object.assign({children:r},o));
  const ch=[];const dots='............................................';
  for(const [gi,{g,tasks}] of data.entries()){
    ch.push(Pp([R(wsTitle(g),{bold:true,size:32})],{alignment:D.AlignmentType.CENTER,spacing:{after:160},pageBreakBefore:gi>0}));
    ch.push(Pp([R(tr('Imię i nazwisko: ','Name: ')+'..................................................................')],{spacing:{after:120}}));
    ch.push(Pp([R(tr('Przyjrzyj się schematom i wykonaj zadania.','Look carefully at the diagrams and complete the tasks.'),{italics:true})],{spacing:{after:120}}));
    for(const t of tasks){
      ch.push(Pp([R(`${tr('Zadanie','Task')} ${t.no}.`,{bold:true,size:24})],{spacing:{before:160,after:40},keepNext:true}));
      ch.push(Pp([R(taskText(t),{italics:true})],{spacing:{after:80},keepNext:t.kind==='label'}));
      if(t.kind!=='label')continue;
      const sv=wsSVG(t),[w,h]=dims(sv),iw=Math.min(620,Math.round(418*w/h));ch.push(Pp([new D.ImageRun({data:await toPng(sv,w*2,h*2),transformation:{width:iw,height:Math.round(iw*h/w)}})],{alignment:D.AlignmentType.CENTER,spacing:{after:80}}));
      if(ws.bank)ch.push(Pp([R(bankNames(t).join('  •  '))],{border:{top:{style:D.BorderStyle.SINGLE,size:6,color:'000000',space:4},bottom:{style:D.BorderStyle.SINGLE,size:6,color:'000000',space:4},left:{style:D.BorderStyle.SINGLE,size:6,color:'000000',space:4},right:{style:D.BorderStyle.SINGLE,size:6,color:'000000',space:4}},spacing:{after:120}}));
      for(let i=0;i<t.ids.length;i+=2){const a=`${i+1}. ${dots}`,b=i+1<t.ids.length?`${i+2}. ${dots}`:'';
        ch.push(Pp([R(a),...(b?[new D.TextRun({text:'\t',font:F}),R(b)]:[])],{tabStops:[{type:D.TabStopType.LEFT,position:5300}],spacing:{before:120,after:60}}));}
    }
  }
  if(ws.key){ch.push(Pp([R(tr('Klucz odpowiedzi (dla nauczyciela)','Answer key (for the teacher)'),{bold:true,size:26})],{pageBreakBefore:true,spacing:{after:120}}));
    for(const {g,tasks} of data){if(g)ch.push(Pp([R(`${tr('Grupa','Group')} ${g}`,{bold:true,size:24})],{spacing:{before:160,after:60}}));
      for(const t of tasks)ch.push(Pp([R(`${tr('Zadanie','Task')} ${t.no}: `,{bold:true}),R(keyText(t))],{spacing:{after:80}}));}}
  const doc=new D.Document({creator:'Zakład utylizacji niewiedzy',title:wsTitle(''),styles:{default:{document:{run:{font:F,size:22}}}},sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,bottom:720,left:720,right:720}}},children:ch}]});
  return D.Packer.toBlob(doc);
}
const STATUS={lib:['Nie udało się wczytać biblioteki do plików Word.','Could not load the Word file library.'],prep:['Przygotowuję plik…','Preparing the file…'],saved:['Plik zapisany.','File saved.'],err:['Nie udało się przygotować pliku.','Could not prepare the file.']};
async function docxClick(){
  if(!window.docx){S.wsSt='lib';render();return;}
  S.wsSt='prep';render();
  try{const blob=await buildDocx();await DL.save({filename:tr('Karta pracy – budowa komórki.docx','Worksheet – cell structure.docx'),data:blob});S.wsSt='saved';}
  catch(e){console.error(e);S.wsSt='err';}
  render();
}
async function pngClick(kind){
  S.pngSt='prep';render();
  try{await downloadPng(kind==='virus'?S.virus:S.cell);S.pngSt='saved';}catch(e){console.error(e);S.pngSt='err';}
  render();
}

// ---------- całość ----------
let playT=null;
function stopPlay(){S.playing=false;if(playT){clearInterval(playT);playT=null;}}
function focusKey(el){if(!el||el===document.body)return null;if(el.id)return '#'+CSS.escape(el.id);
  const a=[...el.attributes].filter(x=>x.name.startsWith('data-')).map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join('');if(!a)return null;
  const ctx=el.closest('[data-ctx]');return (ctx?`[data-ctx="${ctx.dataset.ctx}"] `:'')+el.tagName.toLowerCase()+a;}
function render(keep=true){
  const fk=keep?focusKey(document.activeElement):null;
  const sl=$$('#app .scroll, #app .tablewrap').map(e=>e.scrollLeft);
  document.documentElement.lang=L;document.title=T(GEN?UI.gt1:UI.t1);
  $('#t1').textContent=T(GEN?UI.gt1:UI.t1);$('#t2').textContent=T(GEN?UI.gt2:UI.t2);
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
  $('#tabs').innerHTML=Object.entries(UI.tabs).filter(([k])=>GEN===(k==='sheet')).map(([k,v])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(T(v))}</button>`).join('');
  $('#app').innerHTML={models:viewModels,compare:viewCompare,viruses:viewViruses,kb:viewKB,quiz:viewQuiz,sheet:viewSheet}[S.tab]();
  $$('#app .scroll, #app .tablewrap').forEach((e,i)=>{if(sl[i])e.scrollLeft=sl[i];});
  if(fk){const el=$(fk);if(el&&el!==document.activeElement)try{el.focus({preventScroll:true});}catch(_){}}
}
function act(b){
  const d=b.dataset;let after=null;
  if(d.lang){L=d.lang;try{localStorage.setItem('komorkiLang',L);}catch(_){}}
  else if(d.tab){if(d.tab!==S.tab)stopPlay();S.tab=d.tab;}
  else if(d.cell){S.cell=d.cell;S.org=null;S.pngSt='';}
  else if(d.virus){S.virus=d.virus;S.vorg=null;S.pngSt='';}
  else if(d.lvl){if(S.lvl!==d.lvl){S.lvl=d.lvl;S.q=null;}}
  else if(d.o){const ctx=b.closest('[data-ctx]')?.dataset.ctx||(S.tab==='viruses'?'virus':'cell');
    if(ctx==='quiz'){answer(d.o);after='#nextQ';}
    else if(S.tab==='viruses')S.vorg=d.o;
    else S.org=d.o;
    if(!b.closest('svg'))after='.ocard h2';}
  else if(d.ans){answer(d.ans);after='#nextQ';}
  else if(b.id==='nextQ'){newQ();after=S.q.k==='point'?'[data-ctx="quiz"] [data-o][tabindex]':'.opts button';}
  else if(d.act==='clearSel'){if(S.tab==='viruses')S.vorg=null;else S.org=null;after='.stage [data-o][tabindex]';}
  else if(d.act==='png'){pngClick(d.kind);return;}
  else if(d.act==='docx'){docxClick();return;}
  else if(d.act==='wsNew'){S.ws.seed=1+Math.floor(Math.random()*99999);S.wsSt='';}
  else if(d.act==='prev'){stopPlay();S.step=Math.max(0,S.step-1);}
  else if(d.act==='next'){stopPlay();S.step=Math.min(CYC[S.cyc].length-1,S.step+1);}
  else if(d.act==='play'){if(S.playing)stopPlay();else{S.playing=true;if(S.step>=CYC[S.cyc].length-1)S.step=0;
    playT=setInterval(()=>{if(S.tab!=='viruses'){stopPlay();return;}if(S.step<CYC[S.cyc].length-1)S.step++;if(S.step>=CYC[S.cyc].length-1)stopPlay();render();},matchMedia('(prefers-reduced-motion: reduce)').matches?4000:2600);}}
  else if(d.cyc){stopPlay();S.cyc=d.cyc;S.step=0;}
  else if(d.step){stopPlay();S.step=+d.step;}
  else if(d.zoom){const o=SIZES[+d.zoom];S.zoom=Math.max(-9.6,Math.min(-0.4,Math.round((Math.log10(o.s)+.55)*10)/10));}
  else if(d.osmc)S.osmC=d.osmc;
  else if(d.osms)S.osmS=d.osms;
  else if(d.wscell){const c=S.ws.cells;S.ws.cells=c.includes(d.wscell)?c.filter(x=>x!==d.wscell):[...c,d.wscell];S.wsSt='';}
  else if(d.wsn!==undefined){S.ws.n=+d.wsn;S.wsSt='';}
  else return;
  render();
  if(after){const el=$(after);if(el)el.focus({preventScroll:after==='.ocard h2'?false:true});}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lang],[data-tab],[data-cell],[data-virus],[data-lvl],[data-o],[data-ans],#nextQ,[data-act],[data-cyc],[data-step],[data-zoom],[data-osmc],[data-osms],[data-wscell],[data-wsn]');
  if(!b||b.disabled)return;
  if(b.matches('.sheet *'))return;
  if(b.dataset.o&&b.closest('[data-ctx="quiz"]')&&S.q&&S.q.picked!==null)return;
  act(b);
});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('svg [data-o][tabindex]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(g.closest('[data-ctx="quiz"]')&&S.q&&S.q.picked!==null)return;act(g);}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='labChk'){S.labels=t.checked;S.pngSt='';render();}
  else if(t.dataset.wsopt){S.ws[t.dataset.wsopt]=t.checked;S.wsSt='';render();}});
document.addEventListener('input',e=>{if(e.target.id==='zoom'){S.zoom=+e.target.value;e.target.setAttribute('aria-valuetext',fmtLen(Math.pow(10,S.zoom)));$('#scaleViz').innerHTML=scaleViz();}});
render();

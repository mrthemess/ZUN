<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L='pl';try{const s=localStorage.getItem('podzialLang');if(s==='pl'||s==='en')L=s;}catch(e){}
const tr=(pl,en)=>L==='pl'?pl:en, T=a=>a[L==='pl'?0:1];
const NF=(n,d=0)=>n.toLocaleString(L==='pl'?'pl-PL':'en-GB',{maximumFractionDigits:d}).replace('-','−');
const shuffle=(a,r=Math.random)=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const pick=(a,n,r)=>shuffle(a,r).slice(0,n);
const rngOf=seed=>{let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;};
// polska odmiana liczebnikowa: 1 chromosom, 2 chromosomy, 5 chromosomów
const plN=(n,a,b,c)=>{n=Math.abs(Number(n));const d=n%10,h=n%100;return n===1?a:(d>=2&&d<=4&&(h<12||h>14))?b:c;};
const chrW=n=>tr(plN(n,'chromosom','chromosomy','chromosomów'),n===1?'chromosome':'chromosomes');
const SUP=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]).join('');

const UI={
 t1:['Mitoza i mejoza','Mitosis and meiosis'],
 t2:['Cykl komórkowy, animacje podziałów, liczba chromosomów i ilość DNA, quiz i karta pracy.','The cell cycle, animated divisions, chromosome number and DNA content, a quiz and a worksheet.'],
 tabs:{cycle:['Cykl komórkowy','Cell cycle'],mitosis:['Mitoza','Mitosis'],meiosis:['Mejoza','Meiosis'],compare:['Porównanie','Comparison'],extras:['Gamety i błędy podziału','Gametes and division errors'],quiz:['Quiz','Quiz'],sheet:['Karta pracy','Worksheet']},
};

// ================= rysowanie =================
const SW=840,SH=460,CX=420,CY=230;
const COL={m:'#d9480f',p:'#1971c2'};
const PAIRS=[{L:62,c:.4},{L:46,c:.5},{L:32,c:.3}];
const f1=n=>Math.round(n*10)/10;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp01=t=>Math.max(0,Math.min(1,t));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const seg01=(t,a,b)=>clamp01((t-a)/(b-a));
const rad=d=>d*Math.PI/180;
const pl=(p,q,t)=>({x:lerp(p.x,q.x,t),y:lerp(p.y,q.y,t),a:lerp(p.a,q.a,t)});
const pd=a=>'M'+a.map(p=>f1(p[0])+' '+f1(p[1])).join(' L');
function polyAt(pts,c,f){if(f<=c){const k=c?f/c:0;return[lerp(pts[0][0],pts[1][0],k),lerp(pts[0][1],pts[1][1],k)];}const k=(f-c)/(1-c);return[lerp(pts[1][0],pts[2][0],k),lerp(pts[1][1],pts[2][1],k)];}
function subPoly(pts,c,a,b){const o=[polyAt(pts,c,a)];if(a<c&&b>c)o.push(pts[1]);o.push(polyAt(pts,c,b));return o;}
// [obrys, wypełnienie] jednej chromatydy
function chParts(pts,c,pat,w){
  const st=`fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  let f=`<path d="${pd(pts)}" stroke="${pat.col}" stroke-width="${f1(w)}" ${st}/>`;
  if(pat.seg)f+=`<path d="${pd(subPoly(pts,c,pat.seg[0],pat.seg[1]))}" stroke="${pat.seg[2]}" stroke-width="${f1(w)}" ${st}/>`;
  return[`<path d="${pd(pts)}" stroke="#262626" stroke-width="${f1(w+2.4)}" ${st}/>`,f];
}
// chromosom dwuchromatydowy (X)
function xChromo(ch,x,y,a,o={}){
  const r=rad(a),u=[Math.cos(r),Math.sin(r)],v=[-Math.sin(r),Math.cos(r)];
  const Lc=ch.L*(o.k||1),c=ch.c,wm=o.wm??3,we=o.we??6,w=o.w??7;
  const ps=[0,1].map(i=>{const s=i?-1:1;
    const e0=[x-u[0]*c*Lc+v[0]*s*we,y-u[1]*c*Lc+v[1]*s*we],cen=[x+v[0]*s*wm,y+v[1]*s*wm],e1=[x+u[0]*(1-c)*Lc+v[0]*s*we,y+u[1]*(1-c)*Lc+v[1]*s*we];
    return chParts([e0,cen,e1],c,ch.cts[i],w);});
  return `<g opacity="${f1(o.op??1)}">${ps[0][0]}${ps[1][0]}${ps[0][1]}${ps[1][1]}${o.kin===false?'':`<circle cx="${f1(x)}" cy="${f1(y)}" r="3" fill="#1a1a1a"/>`}</g>`;
}
// pojedyncza chromatyda (V) ciągnięta za centromer; trail – kierunek ramion, pn – strona końca 0
function vChromo(ch,i,x,y,trail,pn,sp,o={}){
  const Lc=ch.L*(o.k||1),c=ch.c,cs=Math.cos(sp),sn=Math.sin(sp);
  const d0=[trail[0]*cs+pn[0]*sn,trail[1]*cs+pn[1]*sn],d1=[trail[0]*cs-pn[0]*sn,trail[1]*cs-pn[1]*sn];
  const p=chParts([[x+d0[0]*c*Lc,y+d0[1]*c*Lc],[x,y],[x+d1[0]*(1-c)*Lc,y+d1[1]*(1-c)*Lc]],c,ch.cts[i],o.w??7);
  return `<g opacity="${f1(o.op??1)}">${p[0]}${p[1]}${o.kin===false?'':`<circle cx="${f1(x)}" cy="${f1(y)}" r="2.6" fill="#1a1a1a"/>`}</g>`;
}
function blob(cx,cy,rx,ry,p=0,ax='x'){let d='';for(let i=0;i<=72;i++){const th=i/72*2*Math.PI;let x=rx*Math.cos(th),y=ry*Math.sin(th);
  if(p){if(ax==='x')y*=1-.96*p*Math.exp(-Math.pow(Math.cos(th)/.32,2));else x*=1-.96*p*Math.exp(-Math.pow(Math.sin(th)/.32,2));}
  d+=(i?'L':'M')+f1(cx+x)+' '+f1(cy+y);}return d+'Z';}
const aCell=d=>`<path d="${d}" fill="#fff3e3" stroke="#cf6f93" stroke-width="4"/><path d="${d}" fill="none" stroke="#fbe0ea" stroke-width="1.2"/>`;
const ell=(cx,cy,rx,ry)=>`M${f1(cx-rx)} ${f1(cy)} A${f1(rx)} ${f1(ry)} 0 1 0 ${f1(cx+rx)} ${f1(cy)} A${f1(rx)} ${f1(ry)} 0 1 0 ${f1(cx-rx)} ${f1(cy)}Z`;
const pCell=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="#8cc86a" stroke="#4d8a32" stroke-width="2"/><rect x="${x+11}" y="${y+11}" width="${w-22}" height="${h-22}" rx="9" fill="#f2faea" stroke="#cf6f93" stroke-width="2.5"/>`;
const CHROMATIN=['M-55 -22 q10 -14 20 0 t20 0 t20 0','M-45 22 q10 12 20 0 t20 0 t20 0 t20 0','M-14 -56 q8 -10 16 0 t16 0 t16 0','M-32 56 q8 10 16 0 t16 0','M12 2 q8 -10 16 0 t16 0','M-62 2 q6 -8 12 0 t12 0'].map(d=>`<path d="${d}"/>`).join('');
function nucleus(cx,cy,r,o={}){
  const env=o.env??1,fr=o.frag??0,nl=o.nl??1,chr=o.chr??1,fill=o.fill??1;let s='';
  if(fill>0)s+=`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="#ece3f8" opacity="${f1(fill)}"/>`;
  if(chr>0)s+=`<g transform="translate(${f1(cx)} ${f1(cy)}) scale(${f1(r/100*100)/100})" opacity="${f1(chr)}" fill="none" stroke="#8665c2" stroke-width="2.4" stroke-linecap="round">${CHROMATIN}</g>`;
  if(nl>0)s+=`<circle cx="${f1(cx+r*.32)}" cy="${f1(cy-r*.22)}" r="${f1(r*.16)}" fill="#5e3d99" opacity="${f1(nl)}"/>`;
  const eo=env*(1-fr*.8);
  if(eo>.02){const da=fr?` stroke-dasharray="${f1(lerp(30,5,fr))} ${f1(lerp(2,16,fr))}"`:'';s+=`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="none" stroke="#6a46a6" stroke-width="3.5"${da} opacity="${f1(eo)}"/>`;}

  const tg=[];pos.forEach(p=>{const r=rad(p.a),v=[-Math.sin(r),Math.cos(r)];tg.push({x:p.x+v[0]*11,y:p.y+v[1]*11,k:0,op:e},{x:p.x-v[0]*11,y:p.y-v[1]*11,k:1,op:e});});
  g+=eqLine(CX,CY-172,CX,CY+172,e*.7)+aster(P1,1)+aster(P2,1)+spindle(P1,P2,tg)+centri(P1)+centri(P2);
  b.pa.forEach((pr,i)=>g+=biv(pr,pos[i].x,pos[i].y,pos[i].a,lerp(10,11,e),{chi:1}));
  const p0=b.plate[0];
  return{g,lab:[LB('biwalenty w płaszczyźnie równikowej','bivalents on the equatorial plane',[CX,CY-170],'R',60),LB('homolog zwrócony ku jednemu biegunowi, jego para – ku drugiemu','one homologue faces each pole',[p0.x-11,p0.y],'L',130),LB('chiazma','chiasma',chiPt(b.pa[0],p0),'R',150),LB('włókna wrzeciona','spindle fibres',[CX-110,CY+30],'L',330)]};};
MEIS.ana1=(e,o)=>{const b=meiBase(o);const rx=lerp(210,235,e),ry=lerp(185,170,e);let g=aCell(blob(CX,CY,rx,ry));
  const P1=[CX-lerp(190,208,e),CY],P2=[2*CX-P1[0],CY],tg=[];
  const pos=b.plate.map(p=>{const y=CY+(p.y-CY)*lerp(1,.85,e),d=lerp(11,150,e);return[{x:CX-d,y},{x:CX+d,y}];});
  pos.forEach(pp=>tg.push({x:pp[0].x,y:pp[0].y,k:0},{x:pp[1].x,y:pp[1].y,k:1}));
  g+=aster(P1,1)+aster(P2,1)+spindle(P1,P2,tg)+centri(P1)+centri(P2);
  b.pa.forEach((pr,i)=>{g+=xChromo(pr.A,pos[i][0].x,pos[i][0].y,90)+xChromo(pr.B,pos[i][1].x,pos[i][1].y,90);});
  const q=pos[0][1];
  return{g,lab:[LB('chromosomy homologiczne rozchodzą się do biegunów','homologous chromosomes move to the poles',[q.x+8,q.y-10],'R',120),LB('chromatydy siostrzane wciąż połączone centromerem','sister chromatids still joined at the centromere',[pos[0][0].x,pos[0][0].y],'L',150)]};};
MEIS.tel1=(e,o)=>{const b=meiBase(o);let g='';
  if(e<.85)g+=aCell(blob(CX,CY,235,170,lerp(0,.985,e/.85)));else{const d=lerp(118,150,seg01(e,.85,1)),rx=lerp(117,125,seg01(e,.85,1)),ry=lerp(150,160,seg01(e,.85,1));g+=aCell(ell(CX-d,CY,rx,ry))+aCell(ell(CX+d,CY,rx,ry));}
  const P1=[CX-208,CY],P2=[CX+208,CY];g+=spindle(P1,P2,[],{op:(1-e)*.7})+centri([lerp(P1[0],CX-90,e),CY])+centri([lerp(P2[0],CX+90,e),CY]);
  b.pa.forEach((pr,i)=>{const y=CY+(b.plate[i].y-CY)*.85;g+=xChromo(pr.A,CX-150,y,90)+xChromo(pr.B,CX+150,y,90);});
  return{g,lab:[LB('bruzda podziałowa','cleavage furrow',[CX,CY-170*(1-.96*Math.min(1,e/.85))+(e>=.85?25:0)],'R',50),LB('komórka haploidalna (n): chromosomy nadal z 2 chromatydami','haploid cell (n): chromosomes still have 2 chromatids',[CX-150-60,CY+80],'L',330)]};};
const M2X=[CX-150,CX+150];
function m2(b){// chromosomy w lewej (A) i prawej (B) komórce
  return[b.pa.map(x=>x.A),b.pa.map(x=>x.B)];}
function m2plate(cs,cx){return hStack(cs,16,cx,CY);}
MEIS.pro2=(e,o)=>{const b=meiBase(o),cells=m2(b);let g=aCell(ell(M2X[0],CY,125,160))+aCell(ell(M2X[1],CY,125,160));
  cells.forEach((cs,ci)=>{const cx=M2X[ci],P1=[cx,CY-130],P2=[cx,CY+130],pt=m2plate(cs,cx);
    const c0=[cx+(ci?-60:60),CY];g+=spindle(P1,P2,[],{op:e*.9})+centri([lerp(c0[0],cx,e),lerp(CY,CY-130,e)])+centri([lerp(c0[0],cx,e),lerp(CY,CY+130,e)]);
    cs.forEach((c,i)=>{const st={x:cx,y:CY+(b.plate[i].y-CY)*.85,a:90},p=pl(st,pt[i],.35*e);g+=xChromo(c,p.x,p.y,p.a);});});
  return{g,lab:[LB('nowe wrzeciono podziałowe','new spindle',[M2X[0],CY-90],'L',90),LB('komórka haploidalna (n, 2c)','haploid cell (n, 2c)',[M2X[1]+80,CY+90],'R',360)]};};
MEIS.meta2=(e,o)=>{const b=meiBase(o),cells=m2(b);let g=aCell(ell(M2X[0],CY,125,160))+aCell(ell(M2X[1],CY,125,160));const lab=[];
  cells.forEach((cs,ci)=>{const cx=M2X[ci],P1=[cx,CY-130],P2=[cx,CY+130],pt=m2plate(cs,cx);
    const pos=cs.map((c,i)=>pl(pl({x:cx,y:CY+(b.plate[i].y-CY)*.85,a:90},pt[i],.35),pt[i],e));
    const tg=[];pos.forEach(p=>{const r=rad(p.a),v=[-Math.sin(r),Math.cos(r)];tg.push({x:p.x-v[0]*4,y:p.y-v[1]*4,k:0,op:e},{x:p.x+v[0]*4,y:p.y+v[1]*4,k:1,op:e});});
    g+=eqLine(cx-110,CY,cx+110,CY,e*.7)+aster(P1,1)+aster(P2,1)+spindle(P1,P2,tg)+centri(P1)+centri(P2);
    cs.forEach((c,i)=>g+=xChromo(c,pos[i].x,pos[i].y,pos[i].a));});
  lab.push(LB('pojedyncze chromosomy w płaszczyźnie równikowej','single chromosomes on the equatorial plane',[M2X[1]+100,CY],'R',230),LB('włókna wrzeciona z obu biegunów','spindle fibres from both poles',[M2X[0],CY-70],'L',100));
  return{g,lab};};
function m2ana(cs,cx,e){const pt=m2plate(cs,cx);return pt.map(p=>({x:cx+(p.x-cx)*lerp(1,.85,e),d:lerp(5,110,e)}));}
MEIS.ana2=(e,o)=>{const b=meiBase(o),cells=m2(b);let g='';const rx=lerp(125,118,e),ry=lerp(160,182,e),sp=lerp(Math.PI/2*.92,.45,e);let q;
  cells.forEach((cs,ci)=>{const cx=M2X[ci];g+=aCell(ell(cx,CY,rx,ry));const P1=[cx,CY-lerp(130,152,e)],P2=[cx,CY+lerp(130,152,e)],ps=m2ana(cs,cx,e),tg=[];
    ps.forEach(p=>tg.push({x:p.x,y:CY-p.d,k:0},{x:p.x,y:CY+p.d,k:1}));
    g+=aster(P1,1)+aster(P2,1)+spindle(P1,P2,tg)+centri(P1)+centri(P2);
    cs.forEach((c,i)=>{g+=vChromo(c,1,ps[i].x,CY-ps[i].d,[0,1],[-1,0],sp)+vChromo(c,0,ps[i].x,CY+ps[i].d,[0,-1],[-1,0],sp);});if(ci===1)q=ps[0];});
  return{g,lab:[LB('chromatydy siostrzane rozchodzą się do biegunów','sister chromatids move to the poles',[q.x,CY-q.d],'R',100)]};};
const M4=[[M2X[0],CY-108],[M2X[0],CY+108],[M2X[1],CY-108],[M2X[1],CY+108]];
MEIS.tel2=(e,o)=>{const b=meiBase(o),cells=m2(b);let g='';
  cells.forEach((cs,ci)=>{const cx=M2X[ci];
    if(e<.85)g+=aCell(blob(cx,CY,118,182,lerp(0,.985,e/.85),'y'));else{const d=lerp(95,108,seg01(e,.85,1));g+=aCell(ell(cx,CY-d,112,lerp(88,92,seg01(e,.85,1))))+aCell(ell(cx,CY+d,112,lerp(88,92,seg01(e,.85,1))));}
    g+=nucleus(cx,CY-110,52,{chr:0,nl:e,env:e,fill:.7*e})+nucleus(cx,CY+110,52,{chr:0,nl:e,env:e,fill:.7*e});
    g+=spindle([cx,CY-152],[cx,CY+152],[],{op:(1-e)*.7});
    const ps=m2ana(cs,cx,1);cs.forEach((c,i)=>{const kk=lerp(1,.75,e),ox=(ps[i].x-cx)*lerp(1,.8,e);g+=vChromo(c,1,cx+ox,CY-lerp(110,125,e),[0,1],[-1,0],.45,{op:lerp(1,.85,e),w:lerp(7,5.5,e),k:kk,kin:false})+vChromo(c,0,cx+ox,CY+lerp(110,125,e),[0,-1],[-1,0],.45,{op:lerp(1,.85,e),w:lerp(7,5.5,e),k:kk,kin:false});});});
  return{g,lab:[e<.85?LB('bruzda podziałowa','cleavage furrow',[M2X[1]+118*(1-.96*e/.85),CY],'R',230):LB('powstają 4 komórki haploidalne','4 haploid cells form',[M2X[1]+100,CY+108],'R',330),LB('odtwarzające się jądro','nucleus re-forming',[M2X[0]-52,CY-110],'L',120)]};};
MEIS.res=(e,o)=>{const b=meiBase(o),cells=m2(b);let g='';const lab=[];
  cells.forEach((cs,ci)=>{const cx=M2X[ci],ps=m2ana(cs,cx,1);
    [[1,-1],[0,1]].forEach(([ct,sg])=>{const cy=CY+sg*108;g+=aCell(ell(cx,cy,118,92))+nucleus(cx,cy,58,{chr:0,nl:0,env:1,fill:.8});
      cs.forEach((c,i)=>{const tx=cx+(i-(cs.length-1)/2)*24,ty=cy-(.5-c.c)*c.L*.8;
        g+=vChromo(c,ct,tx,ty,[1,0],[0,-1],Math.PI/2,{k:.8,w:5.5,kin:false,op:lerp(.6,1,e)});});});});
  lab.push(LB('komórka haploidalna (n, c)','haploid cell (n, c)',[M2X[0]-80,CY-140],'L',90),LB('każda z 4 komórek ma inny zestaw chromosomów','each of the 4 cells has a different set of chromosomes',[M2X[1]+90,CY+130],'R',360));
  return{g,lab};};

function sceneInner(kind,key,t,o){const r=(kind==='mit'?MITS:MEIS)[key](ease(clamp01(t)),o);return r.g+(o.labels?drawLabels(r.lab||[],o.exp):'');}
function sceneSVG(kind,key,t,o){
  const ff=o.exp?` font-family="Atkinson Hyperlegible, Arial, Helvetica, sans-serif"`:'';
  const title=o.title?`<text x="16" y="28" font-size="20" font-weight="700" fill="#1c2621">${esc(o.title)}</text>`:'';
  const vb=o.vb||`0 0 ${SW} ${SH}`,vbw=+vb.split(' ')[2],vbh=+vb.split(' ')[3];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${o.w||vbw}" height="${o.h||vbh}"${o.x!=null?` x="${o.x}" y="${o.y}"`:''} class="sc${o.labels&&!o.exp?' wl':''}" role="img" aria-label="${esc(o.aria||'')}"${ff}>${o.bg?`<rect width="${SW}" height="${SH}" fill="${o.bg}"/>`:''}${title}${sceneInner(kind,key,t,o)}</svg>`;
}

const MITD={
 int:o=>[tr('Komórka rośnie i przygotowuje się do podziału. W fazie S kopiuje swoje DNA (replikacja) – od tej chwili każdy chromosom składa się z dwóch identycznych chromatyd siostrzanych.','The cell grows and gets ready to divide. In the S phase it copies its DNA (replication) – from then on, each chromosome is made of two identical sister chromatids.'),
  tr('W interfazie chromosomy są rozluźnione (chromatyna), więc pod mikroskopem nie widać ich jako osobnych struktur.','During interphase the chromosomes are loosely packed (chromatin), so they can’t be seen as separate structures under a microscope.'),
  ...(o.lvl==='A'?[o.cell==='plant'?tr('Komórki roślin nasiennych nie mają centrioli.','Seed-plant cells have no centrioles.'):tr('W fazie S podwaja się też centrosom – w komórce są teraz dwie pary centrioli.','The centrosome is also duplicated in the S phase – the cell now has two pairs of centrioles.')]:[])],
 pro:o=>[tr('Chromatyna kondensuje: chromosomy skracają się i grubieją, aż stają się widoczne. Każdy ma kształt litery X – to dwie chromatydy siostrzane połączone w miejscu zwanym centromerem.','The chromatin condenses: the chromosomes get shorter and thicker until they become visible. Each one is X-shaped – two sister chromatids joined at a point called the centromere.'),
  tr('Zanika jąderko i zaczyna powstawać wrzeciono podziałowe zbudowane z mikrotubul.','The nucleolus disappears and the spindle, made of microtubules, starts to form.'),

  o.lvl==='A'?tr('Pod koniec profazy otoczka jądrowa jest jeszcze cała.','At the end of prophase the nuclear envelope is still intact.'):tr('Pod koniec profazy rozpada się otoczka jądrowa.','At the end of prophase the nuclear envelope breaks down.')],
 prom:o=>[tr('Otoczka jądrowa rozpada się na drobne pęcherzyki, więc chromosomy leżą teraz swobodnie w cytoplazmie.','The nuclear envelope breaks up into small vesicles, so the chromosomes now lie free in the cytoplasm.'),
  tr('W rejonie centromeru każdej chromatydy powstaje kinetochor – struktura białkowa, do której przyczepiają się mikrotubule wrzeciona. Chromosomy zaczynają wędrować w stronę środka komórki.','At the centromere, each chromatid forms a kinetochore – a protein structure that spindle microtubules attach to. The chromosomes start moving towards the middle of the cell.')],
 meta:o=>[tr('Chromosomy ustawiają się w jednej płaszczyźnie na środku komórki – w płaszczyźnie równikowej (tzw. płytce metafazowej). Do centromeru każdego chromosomu przyczepione są włókna wrzeciona z obu biegunów.','The chromosomes line up in a single plane across the middle of the cell – the equatorial plane (the metaphase plate). Spindle fibres from both poles are attached to the centromere of every chromosome.'),
  tr('Chromosomy są teraz najbardziej skondensowane – to najlepszy moment, by je policzyć i porównać ich kształt.','The chromosomes are now at their most condensed – the best moment to count them and compare their shapes.'),
  ...(o.lvl==='A'?[tr('Punkt kontrolny wrzeciona sprawdza, czy każdy kinetochor jest przyłączony do włókien z właściwego bieguna. Dopiero wtedy zaczyna się anafaza.','The spindle checkpoint checks that every kinetochore is attached to fibres from the correct pole. Only then can anaphase begin.')]:[])],
 ana:o=>[tr('Centromery się rozdzielają, a skracające się włókna wrzeciona odciągają chromatydy siostrzane do przeciwległych biegunów. Każda chromatyda jest od tej chwili osobnym chromosomem potomnym.','The centromeres split and the shortening spindle fibres pull the sister chromatids to opposite poles. From now on each chromatid is a separate daughter chromosome.'),
  tr('Do obu biegunów trafia dokładnie taki sam zestaw chromosomów.','Exactly the same set of chromosomes reaches each pole.'),
  ...(o.lvl==='A'?[tr('Enzym separaza rozcina kohezynę – białko, które spajało chromatydy siostrzane. Włókna biegunowe wrzeciona rozpychają bieguny, więc komórka się wydłuża.','The enzyme separase cuts cohesin – the protein that held the sister chromatids together. The polar spindle fibres push the poles apart, so the cell lengthens.')]:[])],
 telo:o=>[tr('Chromosomy docierają do biegunów i znów się rozluźniają (dekondensują). Wokół każdej grupy chromosomów odtwarza się otoczka jądrowa i pojawia się jąderko – powstają dwa jądra potomne.','The chromosomes reach the poles and loosen again (decondense). A nuclear envelope re-forms around each group and a nucleolus appears – two daughter nuclei are formed.'),

 cyto:o=>[o.cell==='plant'?tr('Sztywna ściana nie pozwala komórce się przewęzić. Pęcherzyki z aparatu Golgiego zlewają się na środku w przegrodę pierwotną, która rośnie od środka ku brzegom komórki i daje początek nowej ścianie komórkowej.','The stiff wall stops the cell from pinching in. Vesicles from the Golgi apparatus fuse in the middle to form the cell plate, which grows from the centre out to the edges and becomes a new cell wall.'):tr('Pierścień białek kurczliwych (aktyny i miozyny) pod błoną komórkową zaciska się jak sznurek – powstaje bruzda podziałowa, która dzieli komórkę na dwie.','A ring of contractile proteins (actin and myosin) under the cell membrane tightens like a drawstring – this forms the cleavage furrow, which splits the cell in two.'),
  tr('Efekt mitozy: dwie komórki potomne identyczne genetycznie ze sobą i z komórką macierzystą – mają tyle samo chromosomów (2n).','The result of mitosis: two daughter cells that are genetically identical to each other and to the parent cell – with the same number of chromosomes (2n).')],
};
const MEID={

  tr('Kolory pokazują pochodzenie chromosomów: jeden chromosom z każdej pary pochodzi od matki, drugi – od ojca. Takie pary to chromosomy homologiczne.','The colours show where each chromosome came from: one of each pair is from the mother, the other from the father. These pairs are homologous chromosomes.')],
 pro1:o=>[tr('Chromosomy kondensują, a chromosomy homologiczne łączą się w pary – to koniugacja. Para homologów (razem 4 chromatydy) to biwalent, nazywany też tetradą.','The chromosomes condense and the homologous chromosomes pair up – this is called synapsis. A pair of homologues (4 chromatids in total) is a bivalent, also called a tetrad.'),
  tr('Między chromatydami niesiostrzanymi zachodzi crossing-over: wymiana odpowiadających sobie odcinków. Dzięki temu powstają nowe zestawienia genów od matki i od ojca.','Crossing over takes place between non-sister chromatids: they swap matching sections. This creates new combinations of the mother’s and father’s genes.'),

 meta1:o=>{const n=o.n2/2;return[tr('Biwalenty ustawiają się w płaszczyźnie równikowej – homologi leżą naprzeciw siebie, po dwóch stronach płytki. Włókna z jednego bieguna przyczepiają się do jednego homologu, a z drugiego – do drugiego.','The bivalents line up on the equatorial plane – the homologues face each other on either side of the plate. Fibres from one pole attach to one homologue, and fibres from the other pole to the other.'),
  tr(`To, który homolog (od matki czy od ojca) zwróci się ku któremu biegunowi, jest losowe i niezależne dla każdej pary – to niezależna segregacja chromosomów. Przy n = ${n} parach liczba możliwych kombinacji chromosomów w gametach wynosi 2${SUP(n)} = ${2**n}.`,`Which homologue (the mother’s or the father’s) faces which pole is random and independent for each pair – this is independent assortment. With n = ${n} pairs, the number of possible chromosome combinations in the gametes is 2${SUP(n)} = ${2**n}.`),

}

const CYS={

  A:['Pod koniec G₁ komórka „decyduje”, czy się podzielić (punkt restrykcyjny), czy wyjść z cyklu do fazy G₀. Intensywnie zachodzi synteza RNA i białek.','At the end of G₁ the cell “decides” whether to divide (the restriction point) or to leave the cycle for G₀. RNA and proteins are made at a high rate.']},

  A:['Wytwarzana jest m.in. tubulina – białko mikrotubul wrzeciona. Na granicy G₂/M sprawdzana jest poprawność replikacji.','Tubulin – the protein of spindle microtubules – is made, among others. At the G₂/M boundary the cell checks that replication went correctly.']},
 M:{n:['Mitoza (kariokineza)','Mitosis (karyokinesis)'],nc:'2n, 4c → 2 × (2n, 2c)',dur:['ok. 1 h (razem z cytokinezą)','about 1 h (with cytokinesis)'],

  A:['Na poziomie rozszerzonym wyróżnia się też prometafazę (między profazą a metafazą). Mitozę uruchamia kompleks cykliny B z kinazą CDK1 (MPF).','At the advanced level prometaphase (between prophase and metaphase) is also distinguished. Mitosis is triggered by the complex of cyclin B with the kinase CDK1 (MPF).']},

   `<section class="card"><h3 style="margin-top:0">${tr('Co dzieje się z DNA?','What happens to the DNA?')}</h3><p>${tr('W fazie S każdy chromosom zostaje skopiowany. Dwie kopie – chromatydy siostrzane – pozostają połączone aż do anafazy. Dzięki temu każda komórka potomna dostaje komplet informacji genetycznej.','In the S phase every chromosome is copied. The two copies – sister chromatids – stay joined until anaphase. This way each daughter cell gets a complete set of genetic information.')}</p></section>`}</div>`;

 [['Liczba podziałów','Number of divisions'],['1','1'],['2 (mejoza I i mejoza II)','2 (meiosis I and meiosis II)'],'B'],

function viewCompare(){

   <div class="ugrid"><section class="card ucard"><h3>${tr('Po co mitoza?','Why mitosis?')}</h3><ul>
    <li>${tr('<b>Wzrost</b> – z jednej komórki (zygoty) powstaje organizm złożony z bilionów komórek.','<b>Growth</b> – a single cell (the zygote) becomes an organism made of trillions of cells.')}</li>

    <li>${tr('Komórki potomne mają <b>taką samą informację genetyczną</b> jak komórka macierzysta.','The daughter cells have <b>the same genetic information</b> as the parent cell.')}</li></ul></section>
   <section class="card ucard"><h3>${tr('Po co mejoza?','Why meiosis?')}</h3><ul>

    <li>${tr('U zwierząt mejoza prowadzi do powstania <b>gamet</b>, u roślin – <b>zarodników</b> (gamety roślin powstają później przez mitozę).','In animals meiosis produces <b>gametes</b>; in plants it produces <b>spores</b> (plant gametes form later by mitosis).')}</li></ul></section></div>`;
}

function ndSVG(){

    else{const s=pick(NCB,1)[0],c=String(s[1]*n),opts=shuffle([...new Set([n,2*n,4*n].map(String))]);S.q={k,A:0,org,s,ans:c,opts,picked:null};}return;}

  const table=(head,rows,widths)=>new D.Table({width:{size:TW,type:D.WidthType.DXA},columnWidths:widths,borders:{top:bd,bottom:bd,left:bd,right:bd,insideHorizontal:bd,insideVertical:bd},
    rows:[new D.TableRow({tableHeader:true,children:head.map((h,i)=>cell(h,widths[i],true))}),...rows.map(r=>new D.TableRow({height:{value:520,rule:D.HeightRule.ATLEAST},children:r.map((c,i)=>cell(c,widths[i],false))}))]});
  const ch=[];const dots='............................................';

    for(const t of tasks){
      ch.push(Pp([R(`${tr('Zadanie','Task')} ${t.no}.`,{bold:true,size:24})],{spacing:{before:160,after:40},keepNext:true}));

      if(t.kind==='mitpics'||t.kind==='meipics'){const sv=taskSVG(t),[w,h]=dims(sv),iw=Math.min(600,Math.round(430*w/h));
        ch.push(Pp([new D.ImageRun({data:await toPng(sv,w*2,h*2),transformation:{width:iw,height:Math.round(iw*h/w)}})],{alignment:D.AlignmentType.CENTER,spacing:{after:80}}));
        const lab=i=>t.kind==='mitpics'?LET[i]:String(i+1);
        for(let i=0;i<t.keys.length;i+=2){const a=`${lab(i)}. ${dots}`,b=i+1<t.keys.length?`${lab(i+1)}. ${dots}`:'';
          ch.push(Pp([R(a),...(b?[new D.TextRun({text:'\t',font:F}),R(b)]:[])],{tabStops:[{type:D.TabStopType.LEFT,position:5300}],spacing:{before:120,after:60}}));}
        if(t.kind==='mitpics')ch.push(Pp([R(tr('Kolejność: ','Order: ')+dots)],{spacing:{before:120,after:60}}));}
      else if(t.kind==='nc'){ch.push(A?table(ncHead(),t.rows.map(r=>[T(r[0]),'','']),[5266,2600,2600]):table(ncHead(),t.rows.map(r=>[T(r[0]),'']),[6466,4000]));ch.push(Pp([R('')],{spacing:{after:60}}));}
      else if(t.kind==='cmp'){ch.push(table(cmpHead(),t.rows.map(r=>[T(r[0]),'','']),[3600,3433,3433]));ch.push(Pp([R('')],{spacing:{after:60}}));}
    }
  }
  if(ws.key){ch.push(Pp([R(tr('Klucz odpowiedzi (dla nauczyciela)','Answer key (for the teacher)'),{bold:true,size:26})],{pageBreakBefore:true,spacing:{after:120}}));
    for(const {g,tasks} of data){if(g)ch.push(Pp([R(`${tr('Grupa','Group')} ${g}`,{bold:true,size:24})],{spacing:{before:160,after:60}}));
      for(const t of tasks)ch.push(Pp([R(`${tr('Zadanie','Task')} ${t.no}: `,{bold:true}),R(keyText(t))],{spacing:{after:80}}));}}
  const doc=new D.Document({creator:'Zakład utylizacji niewiedzy',title:wsTitle(''),styles:{default:{document:{run:{font:F,size:22}}}},sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,bottom:720,left:720,right:720}}},children:ch}]});
  return D.Packer.toBlob(doc);
}
const STATUS={lib:['Nie udało się wczytać biblioteki do plików Word.','Could not load the Word file library.'],prep:['Przygotowuję plik…','Preparing the file…'],saved:['Plik zapisany.','File saved.'],err:['Nie udało się przygotować pliku.','Could not prepare the file.']};
async function docxClick(){
  if(!window.docx){S.wsSt='lib';render();return;}
  S.wsSt='prep';render();
  try{const blob=await buildDocx();await DL.save({filename:tr('Karta pracy – mitoza i mejoza.docx','Worksheet – mitosis and meiosis.docx'),data:blob});S.wsSt='saved';}
  catch(e){console.error(e);S.wsSt='err';}
  render();
}
async function pngClick(){
  const kind=curKind(),key=curKey(),title=(kind==='mit'?tr('Mitoza','Mitosis'):tr('Mejoza','Meiosis'))+' – '+stepName(kind,key)+(kind==='mit'?` (${S.mit.cell==='plant'?tr('komórka roślinna','plant cell'):tr('komórka zwierzęca','animal cell')})`:'');
  S.pngSt='prep';render();
  try{const sv=sceneSVG(kind,key,1,sceneOpts(kind,{exp:true,bg:'#ffffff',title}));const c=await svgToCanvas(sv,SW*2,SH*2);const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    await DL.save({filename:`${title}.png`,data:blob});S.pngSt='saved';}catch(e){console.error(e);S.pngSt='err';}
  render();
}

// ================= animacja =================
let raf=null,hold=null,fin=null;
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopAnim(){if(raf)cancelAnimationFrame(raf);raf=null;if(hold)clearTimeout(hold);hold=null;if(fin)clearTimeout(fin);fin=null;}
function stopPlay(){S.playing=false;stopAnim();S.t=1;}
function drawScene(){const el=$('#scene');if(el)el.innerHTML=curScene();}
function startAnim(){stopAnim();if(RM()){S.t=1;drawScene();afterAnim();return;}
  S.t=0;drawScene();const t0=performance.now(),dur=1500;
  const tick=now=>{S.t=Math.min(1,(now-t0)/dur);drawScene();if(S.t<1)raf=requestAnimationFrame(tick);else{raf=null;if(fin)clearTimeout(fin);fin=null;afterAnim();}};raf=requestAnimationFrame(tick);
  // gdy karta jest w tle, requestAnimationFrame nie działa – wtedy kończymy animację od razu
  fin=setTimeout(()=>{fin=null;if(raf){cancelAnimationFrame(raf);raf=null;S.t=1;drawScene();afterAnim();}},dur+400);}
function afterAnim(){if(!S.playing)return;hold=setTimeout(()=>{hold=null;const ks=keysOf(curKind()),i=ks.indexOf(curKey());
  if(i>=ks.length-1){S.playing=false;render();return;}setKey(ks[i+1]);render();startAnim();},RM()?4000:1800);}

// ================= całość =================
function focusKey(el){if(!el||el===document.body)return null;if(el.id)return '#'+CSS.escape(el.id);
  const a=[...el.attributes].filter(x=>x.name.startsWith('data-')).map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join('');if(!a)return null;
  const ctx=el.closest('[data-ctx]');return (ctx?`[data-ctx="${ctx.dataset.ctx}"] `:'')+el.tagName.toLowerCase()+a;}
function render(keep=true){
  const fk=keep?focusKey(document.activeElement):null;
  const sl=$$('#app .scroll, #app .tablewrap').map(e=>e.scrollLeft);
  document.documentElement.lang=L;document.title=T(UI.t1);
  $('#t1').textContent=T(UI.t1);$('#t2').textContent=T(UI.t2);
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
  $('#tabs').innerHTML=Object.entries(UI.tabs).map(([k,v])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(T(v))}</button>`).join('');
  $('#app').innerHTML={cycle:viewCycle,mitosis:()=>viewDiv('mit'),meiosis:()=>viewDiv('mei'),compare:viewCompare,extras:viewExtras,quiz:viewQuiz,sheet:viewSheet}[S.tab]();
  $$('#app .scroll, #app .tablewrap').forEach((e,i)=>{if(sl[i])e.scrollLeft=sl[i];});
  if(fk){const el=$(fk);if(el&&el!==document.activeElement)try{el.focus({preventScroll:true});}catch(_){}}
}
function act(b){
  const d=b.dataset;let after=null,anim=false;
  if(d.lang){L=d.lang;try{localStorage.setItem('podzialLang',L);}catch(_){}}
  else if(d.tab){if(d.tab!==S.tab){stopPlay();S.pngSt='';}S.tab=d.tab;}
  else if(d.lvl){if(S.lvl!==d.lvl){S.lvl=d.lvl;S.q=null;if(!mitKeys(S.lvl).includes(S.mit.key))S.mit.key='pro';S.wsSt='';}}
  else if(d.cy)S.cyc=d.cy;
  else if(d.step){stopPlay();setKey(d.step);anim=true;}
  else if(d.mcell){S.mit.cell=d.mcell;S.pngSt='';}
  else if(d.n2){S.n2=+d.n2;S.pngSt='';}
  else if(d.gam){S.gam=+d.gam;}
  else if(d.nd)S.nd=d.nd;
  else if(d.ans){answer(d.ans);after='#nextQ';}
  else if(d.mv){const [i,dir]=d.mv.split(':').map(Number),o=S.q.order,j=i+dir;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];render();const el=$(`[data-mv="${j}:${dir}"]`)||$(`[data-mv="${j}:${-dir}"]`);if(el)el.focus();return;}
  else if(b.id==='nextQ'){newQ();after='.card .q';}
  else if(d.act==='check'){answer('order');after='#nextQ';}
  else if(d.act==='prev'||d.act==='next'){stopPlay();const ks=keysOf(curKind()),i=ks.indexOf(curKey()),j=Math.max(0,Math.min(ks.length-1,i+(d.act==='next'?1:-1)));setKey(ks[j]);anim=true;}
  else if(d.act==='replay'){stopPlay();anim=true;}
  else if(d.act==='play'){if(S.playing){stopPlay();}else{const ks=keysOf(curKind());if(ks.indexOf(curKey())>=ks.length-1)setKey(ks[0]);S.playing=true;anim=true;}}
  else if(d.act==='shuf'){S.mei.orient=[0,1,2].map(()=>Math.random()<.5?1:0);S.mei.xo=[0,1,2].map(()=>Math.round((.62+Math.random()*.16)*100)/100);S.pngSt='';}
  else if(d.act==='png'){pngClick();return;}
  else if(d.act==='docx'){docxClick();return;}
  else if(d.act==='wsNew'){S.ws.seed=1+Math.floor(Math.random()*99999);S.wsSt='';}
  else return;
  render();
  if(anim)startAnim();
  if(after){const el=$(after);if(el){if(after==='.card .q')el.setAttribute('tabindex','-1');el.focus({preventScroll:after!=='.card .q'});}}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lang],[data-tab],[data-lvl],[data-cy],[data-step],[data-mcell],[data-n2],[data-gam],[data-nd],[data-ans],[data-mv],#nextQ,[data-act]');
  if(!b||b.disabled)return;act(b);
});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('svg [data-cy][tabindex]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act(g);}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='labChk'){S.labels=t.checked;S.pngSt='';render();}
  else if(t.dataset.wsopt){S.ws[t.dataset.wsopt]=t.checked;S.wsSt='';render();}});
document.addEventListener('input',e=>{if(e.target.id==='gam'){S.gam=+e.target.value;$('#gamV').textContent=S.gam;$('#gamOut').innerHTML=gamCalc();$$('[data-gam]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.gam===S.gam));}});
// przeciąganie w zadaniu „ułóż w kolejności” (mysz i dotyk)
let drag=null;
document.addEventListener('pointerdown',e=>{const gr=e.target.closest('.ord .grip');if(!gr||!S.q||S.q.picked!==null)return;const li=gr.closest('li');drag={li,ol:li.parentNode};li.classList.add('drag');try{gr.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!drag)return;const y=e.clientY,sib=[...drag.ol.children].filter(x=>x!==drag.li);let before=null;for(const s of sib){const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break;}}
  if(before!==drag.li.nextSibling||(!before&&drag.ol.lastElementChild!==drag.li))drag.ol.insertBefore(drag.li,before);});
const endDrag=()=>{if(!drag)return;drag.li.classList.remove('drag');S.q.order=[...drag.ol.children].map(x=>x.dataset.k);drag=null;render();};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
render();

.sheet{background:#fff;color:#111;border-radius:6px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 6px rgba(0,0,0,.15);font-family:'Atkinson Hyperlegible',system-ui,sans-serif}

<header><div><h1 id="t1"></h1><p id="t2"></p></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L='pl';try{const s=localStorage.getItem('dnaLang');if(s==='pl'||s==='en')L=s;}catch(e){}
const tr=(pl,en)=>L==='pl'?pl:en, T=a=>a[L==='pl'?0:1];
const shuffle=(a,r=Math.random)=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const pick=(a,n,r)=>shuffle(a,r).slice(0,n);
const rngOf=seed=>{let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;};
const f1=n=>Math.round(n*10)/10;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp01=t=>Math.max(0,Math.min(1,t));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const seg01=(t,a,b)=>clamp01((t-a)/(b-a));
const cap=s=>s[0].toUpperCase()+s.slice(1);

const UI={
 t1:['DNA i synteza białek','DNA and protein synthesis'],
 t2:['Budowa DNA i RNA, replikacja, transkrypcja, translacja, kod genetyczny, mutacje i quiz.','DNA and RNA structure, replication, transcription, translation, the genetic code, mutations and a quiz.'],
 gt1:['Generator kart pracy: DNA i synteza białek','Worksheet generator: DNA and protein synthesis'],
 gt2:['Karty pracy do pobrania w Wordzie, z kluczem odpowiedzi na osobnej stronie.','Downloadable Word worksheets with the answer key on a separate page.'],
 tabs:{struct:['Budowa DNA i RNA','DNA and RNA structure'],rep:['Replikacja','Replication'],tt:['Transkrypcja i translacja','Transcription and translation'],lab:['Laboratorium sekwencji','Sequence lab'],code:['Kod genetyczny','Genetic code'],mut:['Mutacje','Mutations'],quiz:['Quiz','Quiz'],sheet:['Karta pracy','Worksheet']},
};

// ================= kod genetyczny =================
// standardowy kod genetyczny; kolejność: 1., 2., 3. zasada – U, C, A, G
const RB='UCAG',CODE_STR='FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const CODE={};for(let i=0;i<64;i++)CODE[RB[i>>4]+RB[(i>>2)&3]+RB[i&3]]=CODE_STR[i];
// [skrót, nazwa PL, nazwa EN, grupa: h – niepolarne (hydrofobowe), p – polarne, a – kwasowe, b – zasadowe]
const AA={A:['Ala','alanina','alanine','h'],R:['Arg','arginina','arginine','b'],N:['Asn','asparagina','asparagine','p'],D:['Asp','kwas asparaginowy','aspartic acid','a'],C:['Cys','cysteina','cysteine','p'],
 Q:['Gln','glutamina','glutamine','p'],E:['Glu','kwas glutaminowy','glutamic acid','a'],G:['Gly','glicyna','glycine','h'],H:['His','histydyna','histidine','b'],I:['Ile','izoleucyna','isoleucine','h'],
 L:['Leu','leucyna','leucine','h'],K:['Lys','lizyna','lysine','b'],M:['Met','metionina','methionine','h'],F:['Phe','fenyloalanina','phenylalanine','h'],P:['Pro','prolina','proline','h'],
 S:['Ser','seryna','serine','p'],T:['Thr','treonina','threonine','p'],W:['Trp','tryptofan','tryptophan','h'],Y:['Tyr','tyrozyna','tyrosine','p'],V:['Val','walina','valine','h'],'*':['STOP','kodon STOP','STOP codon','s']};
const aaAb=a=>AA[a][0], aaNm=a=>L==='pl'?AA[a][1]:AA[a][2], aaCls=a=>'g'+AA[a][3];
const GRP={h:['niepolarne (hydrofobowe)','non-polar (hydrophobic)'],p:['polarne','polar'],a:['kwasowe (ładunek −)','acidic (charge −)'],b:['zasadowe (ładunek +)','basic (charge +)'],s:['kodon STOP','STOP codon']};
const codonsOf=a=>Object.keys(CODE).filter(c=>CODE[c]===a);
const aaLegend=()=>`<div class="lg">${['h','p','a','b','s'].map(g=>`<span><i class="g${g}"></i>${esc(T(GRP[g]))}</span>`).join('')}</div>`;

// ================= sekwencje =================
const CMP={A:'T',T:'A',C:'G',G:'C'},RCMP={A:'U',U:'A',C:'G',G:'C'};
const comp=s=>s.replace(/./g,c=>CMP[c]||c);
const toRNA=s=>s.replace(/T/g,'U');
const toDNA=s=>s.replace(/U/g,'T');
const STOPS=['TAA','TAG','TGA'];
function translateFrom(m,from){const out=[];for(let i=from;i+3<=m.length;i+=3){const c=m.substr(i,3),a=CODE[c];out.push({i,c,a});if(a==='*')break;}return out;}
function analyse(coding){const m=toRNA(coding),st=m.indexOf('AUG');if(st<0)return{m,st:-1,cod:[],stop:false,end:coding.length};
  const cod=translateFrom(m,st),stop=cod.length>0&&cod[cod.length-1].a==='*';return{m,st,cod,stop,end:stop?st+3*cod.length:coding.length};}
const protOf=an=>an.cod.filter(x=>x.a!=='*').map(x=>x.a);
const SENSE=Object.keys(CODE).filter(c=>CODE[c]!=='*'&&c!=='AUG').map(toDNA);
const rb=r=>'ATCG'[Math.floor(r()*4)];
// losowa nić kodująca: [przed START] ATG [nc kodonów] STOP [za STOP]
function rndSeq(r=Math.random,nc=6,pre=null,post=null){
  for(let k=0;k<200;k++){const np=pre??Math.floor(r()*3)+1;let s='';for(let i=0;i<np;i++)s+=rb(r);s+='ATG';
    for(let i=0;i<nc;i++)s+=SENSE[Math.floor(r()*SENSE.length)];s+=STOPS[Math.floor(r()*3)];const nq=post??Math.floor(r()*3);for(let i=0;i<nq;i++)s+=rb(r);
    const an=analyse(s);if(an.st===np&&an.stop&&an.cod.length===nc+2)return s;}

}

// ---- mutacje ----
function applyMut(s,m){if(m.type==='sub')return s.slice(0,m.pos)+m.base+s.slice(m.pos+1);if(m.type==='ins')return s.slice(0,m.pos)+m.ins+s.slice(m.pos);return s.slice(0,m.pos)+s.slice(m.pos+m.del);}
function classify(orig,m){
  const A=analyse(orig),mut=applyMut(orig,m),B=analyse(mut),n=m.type==='sub'?0:m.type==='ins'?m.ins.length:m.del;
  const r={A,B,mut,n};
  if(A.st<0)return Object.assign(r,{c:'noOrig'});
  const st=A.st,end=A.end,delta=m.type==='ins'?n:m.type==='del'?-n:0;
  const up=m.type==='sub'?m.pos<st:m.type==='ins'?m.pos<=st:m.pos+n<=st;
  const down=m.pos>=end;
  if(up||down){const exp=up?st+delta:st;return Object.assign(r,{c:B.st===exp?'outside':'startChange'});}
  if(m.pos<st+3&&!(m.type==='ins'&&m.pos===st)){if(B.st!==st)return Object.assign(r,{c:'startLoss'});}
  if(m.type==='sub'){const k=Math.floor((m.pos-st)/3),o=A.cod[k],nw=B.cod[k];if(!o||!nw)return Object.assign(r,{c:'outside'});
    r.k=k;r.from=o.a;r.to=nw.a;
    if(o.a===nw.a)r.c='silent';else if(nw.a==='*')r.c='nonsense';else if(o.a==='*')r.c='stopLoss';else r.c='missense';return r;}
  r.c=n%3?'frameshift':'inframe';return r;
}
const MUTC={
 silent:['Mutacja milcząca (cicha)','Silent mutation'],missense:['Mutacja zmiany sensu (missense)','Missense mutation'],nonsense:['Mutacja nonsensowna','Nonsense mutation'],
 stopLoss:['Utrata kodonu STOP','Loss of the STOP codon'],startLoss:['Uszkodzenie kodonu START','Loss of the START codon'],frameshift:['Przesunięcie ramki odczytu','Frameshift mutation'],
 inframe:['Mutacja bez przesunięcia ramki odczytu','In-frame mutation'],outside:['Mutacja poza odcinkiem kodującym','Mutation outside the coding region'],startChange:['Zmiana miejsca startu translacji','Change in the translation start site'],noOrig:['Brak białka','No protein']};
const MTYPE={sub:['Substytucja (zamiana nukleotydu)','Substitution (one nucleotide swapped)'],ins:['Insercja (wstawienie nukleotydu)','Insertion (a nucleotide added)'],del:['Delecja (utrata nukleotydu)','Deletion (a nucleotide lost)']};
function mutExpl(c){
  const x=c.c,ab=a=>`${aaAb(a)} (${aaNm(a)})`;
  if(x==='silent')return tr(`Nowy kodon nadal koduje ${ab(c.from)} – białko się nie zmienia. To możliwe, bo kod genetyczny jest zdegenerowany: jeden aminokwas może być kodowany przez kilka kodonów.`,`The new codon still codes for ${ab(c.from)} – the protein does not change. This is possible because the genetic code is degenerate: one amino acid can be coded for by several codons.`);
  if(x==='missense')return tr(`Jeden aminokwas zostaje zastąpiony innym: ${ab(c.from)} → ${ab(c.to)}. Reszta białka się nie zmienia. Białko może działać normalnie, gorzej albo wcale – zależy to od miejsca i rodzaju zmiany.`,`One amino acid is replaced by another: ${ab(c.from)} → ${ab(c.to)}. The rest of the protein is unchanged. The protein may work normally, less well or not at all – it depends on where the change is and what it is.`);
  if(x==='nonsense')return tr(`Kodon aminokwasu ${ab(c.from)} zmienił się w kodon STOP. Translacja kończy się za wcześnie – białko jest skrócone i zwykle nie działa.`,`The codon for ${ab(c.from)} has turned into a STOP codon. Translation ends too early – the protein is shortened and usually does not work.`);
  if(x==='stopLoss')return tr('Kodon STOP zmienił się w kodon aminokwasu. Rybosom czyta dalej, więc białko jest dłuższe niż powinno.','The STOP codon has turned into a codon for an amino acid. The ribosome reads on, so the protein is longer than it should be.');
  if(x==='startLoss')return tr('Zniszczony został kodon START (AUG). Translacja nie zacznie się w tym miejscu – białko nie powstanie albo powstanie od innego, dalszego kodonu AUG.','The START codon (AUG) has been destroyed. Translation cannot begin here – the protein is not made, or it starts from a different AUG further on.');
  if(x==='frameshift')return tr(`Zmiana dotyczy ${c.n} ${c.n===1?'nukleotydu':'nukleotydów'} – to nie jest wielokrotność 3, więc od miejsca mutacji zmienia się podział mRNA na kodony – wszystkie kolejne kodony są inne. Powstaje zupełnie inne białko, a często szybko pojawia się przypadkowy kodon STOP.`,`The change involves ${c.n} nucleotide${c.n===1?'':'s'} – not a multiple of 3, so from the mutation onwards the mRNA is split into codons differently – every codon after it changes. A completely different protein is made, and a random STOP codon often appears soon.`);
  if(x==='inframe')return tr(`${c.n} nukleotydy to pełny kodon (wielokrotność 3), więc ramka odczytu zostaje zachowana. W białku ${c.B&&protOf(c.B).length>protOf(c.A).length?'przybywa':'brakuje'} aminokwasu, a dalsza część się nie zmienia – tak jak w najczęstszej mutacji powodującej mukowiscydozę (ΔF508).`,`${c.n} nucleotides make a whole codon (a multiple of 3), so the reading frame is kept. The protein ${c.B&&protOf(c.B).length>protOf(c.A).length?'gains':'loses'} an amino acid, while the rest stays the same – as in the most common mutation causing cystic fibrosis (ΔF508).`);
  if(x==='outside')return tr('Zmiana leży przed kodonem START albo za kodonem STOP – poza odcinkiem, który jest tłumaczony na białko. Sekwencja aminokwasów się nie zmienia.','The change lies before the START codon or after the STOP codon – outside the part that is translated into protein. The amino-acid sequence does not change.');
  if(x==='startChange')return tr('Mutacja zmieniła położenie pierwszego kodonu AUG – translacja zaczyna się w innym miejscu, więc białko jest inne.','The mutation has moved the first AUG codon – translation starts somewhere else, so the protein is different.');
  return tr('W prawidłowej sekwencji nie ma kodonu START (AUG), więc białko nie powstaje. Należy wylosować lub wpisać inną sekwencję.','The original sequence has no START codon (AUG), so no protein is made. Pick or type a different sequence.');
}
// mutacja określonego rodzaju (do quizu i kart)
function genMut(r,cat){
  for(let k=0;k<400;k++){const s=rndSeq(r,4+Math.floor(r()*2),0,0),an=analyse(s),lo=3,hi=an.end-3;
    let type=cat==='sub'||cat==='silent'||cat==='missense'||cat==='nonsense'?'sub':cat==='ins'?'ins':cat==='del'?'del':(r()<.5?'ins':'del');
    const pos=lo+Math.floor(r()*(hi-lo)),m={type,pos};
    if(type==='sub'){m.base=pick([...'ATCG'].filter(b=>b!==s[pos]),1,r)[0];}else if(type==='ins')m.ins=rb(r);else m.del=1;
    const c=classify(s,m);
    if(['silent','missense','nonsense'].includes(cat)?c.c===cat:cat==='frameshift'?c.c==='frameshift':!['startLoss','stopLoss','outside','startChange'].includes(c.c))return{s,m,c};}
  return null;
}

 P:{n:['Reszta fosforanowa','Phosphate group'],B:['Reszta kwasu fosforowego. Łączy cukry sąsiednich nukleotydów. Fosforany i cukry na przemian tworzą szkielet nici – „boki drabiny”.','The remains of phosphoric acid. It links the sugars of neighbouring nucleotides. Alternating phosphates and sugars form the backbone of each strand – the “sides of the ladder”.'],

 S:{n:['Deoksyryboza','Deoxyribose'],B:['Cukier pięciowęglowy (pentoza). Do niego przyłączona jest zasada azotowa i reszta fosforanowa. W RNA zamiast deoksyrybozy występuje ryboza.','A five-carbon sugar (a pentose). The base and the phosphate are attached to it. In RNA, ribose is found instead of deoxyribose.'],

   <div class="ugrid"><section class="card"><h3 style="margin-top:0">${tr('Kiedy zachodzi replikacja?','When does replication happen?')}</h3>

const TX_COD='ATGGCTAAATGGTAA',TXN_=15,txx=i=>150+i*44;
const TXK={B:['bind','elong','term'],A:['bind','elong','term','splice']};

const TXD={
 bind:{B:['Enzym polimeraza RNA przyłącza się do DNA na początku genu i rozplata niewielki fragment podwójnej helisy. U roślin, zwierząt i grzybów transkrypcja zachodzi w jądrze komórkowym.','The enzyme RNA polymerase binds to the DNA at the start of a gene and unwinds a short stretch of the double helix. In plants, animals and fungi transcription takes place in the nucleus.'],
  A:['Polimeraza RNA rozpoznaje promotor – odcinek DNA przed genem, który wyznacza miejsce startu i kierunek transkrypcji, a także to, która nić będzie matrycą. U eukariontów pomagają jej czynniki transkrypcyjne.','RNA polymerase recognises the promoter – a stretch of DNA before the gene that sets the start site and the direction of transcription, and which strand will be the template. In eukaryotes it is helped by transcription factors.']},
 elong:{B:['Polimeraza przesuwa się wzdłuż genu i buduje mRNA. Wzorem jest tylko jedna nić DNA – nić matrycowa. Nukleotydy RNA dobierane są komplementarnie, ale naprzeciw adeniny (A) staje uracyl (U), bo RNA nie zawiera tyminy. Dzięki temu mRNA ma taką samą sekwencję jak druga nić DNA – nić kodująca – tylko z U zamiast T.','The polymerase moves along the gene and builds mRNA. Only one DNA strand – the template strand – is used as the pattern. RNA nucleotides are matched by complementarity, but uracil (U) goes opposite adenine (A), because RNA has no thymine. As a result the mRNA has the same sequence as the other DNA strand – the coding strand – just with U instead of T.'],
  A:['Polimeraza RNA odczytuje matrycę w kierunku 3′→5′, a mRNA rośnie w kierunku 5′→3′. W przeciwieństwie do polimerazy DNA nie potrzebuje startera. Za polimerazą helisa DNA ponownie się zamyka.','RNA polymerase reads the template 3′→5′, and the mRNA grows 5′→3′. Unlike DNA polymerase it needs no primer. Behind the polymerase the DNA helix closes up again.']},
 term:{B:['Na końcu genu polimeraza odłącza się od DNA, a gotowa cząsteczka mRNA zostaje uwolniona. DNA wraca do postaci podwójnej helisy i nie zmienia się – z jednego genu można wykonać wiele kopii mRNA.','At the end of the gene the polymerase detaches from the DNA and the finished mRNA is released. The DNA returns to a double helix and is unchanged – one gene can be copied into many mRNA molecules.'],
  A:['Koniec transkrypcji wyznacza sekwencja terminatorowa. U eukariontów powstaje najpierw pre-mRNA (transkrypt pierwotny), który musi jeszcze dojrzeć, zanim opuści jądro.','The end of transcription is marked by a terminator sequence. In eukaryotes the first product is pre-mRNA (the primary transcript), which must be processed before it leaves the nucleus.']},
 splice:{A:['Geny eukariontów są nieciągłe: odcinki kodujące (eksony) przeplatają się z niekodującymi (intronami). Podczas splicingu introny są wycinane z pre-mRNA, a eksony łączone. Na końcu 5′ dobudowana zostaje czapeczka, a na końcu 3′ – ogon poli(A); chronią one mRNA przed rozkładem.','Eukaryotic genes are split: coding stretches (exons) alternate with non-coding ones (introns). During splicing the introns are cut out of the pre-mRNA and the exons are joined. A cap is added to the 5′ end and a poly(A) tail to the 3′ end; they protect the mRNA from being broken down.'],
  A2:['Dojrzałe mRNA przechodzi przez pory w otoczce jądrowej do cytoplazmy, do rybosomów. Bakterie nie mają jądra ani (zwykle) intronów – u nich translacja może zaczynać się, zanim transkrypcja się skończy.','The mature mRNA passes through pores in the nuclear envelope into the cytoplasm, to the ribosomes. Bacteria have no nucleus and (usually) no introns – in them translation can start before transcription has finished.']},
};
function txSVG(key,t,o={}){

    g+=TX(90,96,tr('pre-mRNA (transkrypt pierwotny)','pre-mRNA (primary transcript)'),{b:1,fs:14});

      if(intr){const op=1-seg01(t,.15,.6),dy=-40*seg01(t,0,.5);g+=`<g opacity="${f1(op)}"><path d="M${x} ${y1+18+dy} q${W/2} ${-60} ${W} 0" fill="none" stroke="#868e96" stroke-width="3"/><rect x="${x}" y="${y1+dy}" width="${W}" height="36" rx="6" fill="${col}" stroke="#495057" stroke-width="1.5"/><text x="${x+W/2}" y="${y1+dy+23}" text-anchor="middle" font-size="13" font-weight="700" fill="#111">${tr('intron','intron')}</text></g>`;}
      else{const k=ease(seg01(t,.35,1)),X=lerp(x,xj,k),Y=lerp(y1,y2,k);g+=`<rect x="${f1(X)}" y="${f1(Y)}" width="${W}" height="36" rx="6" fill="${col}" stroke="#1864ab" stroke-width="1.5"/><text x="${f1(X+W/2)}" y="${f1(Y+23)}" text-anchor="middle" font-size="13" font-weight="700" fill="#111">${tr('ekson','exon')} ${nm[1]}</text>`;xj+=W;}
      x+=W;}
    const ok=seg01(t,.8,1);

    g+=TX(210,y2-14,tr('dojrzałe mRNA','mature mRNA'),{b:1,fs:14,op:ok});
    g+=`<g opacity="${f1(ok)}"><path d="M640 380 L640 430" stroke="#6a46a6" stroke-width="4" stroke-dasharray="8 6"/><path d="M${xj+90} ${y2+18} Q 640 ${y2+18} 640 372" fill="none" stroke="#1c2621" class="ln" stroke-width="2" marker-end="url(#ar2)"/></g>`+TX(660,420,tr('por jądrowy → cytoplazma','nuclear pore → cytoplasm'),{fs:13,op:ok});
    return svgWrap(`<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#56645c"/></marker></defs>`+g,Object.assign({aria:tr('Splicing pre-mRNA','Splicing of pre-mRNA')},o));
  }
  let p,bub,pop,fall=0,pdx=0;
  if(key==='bind'){p=1.5;bub=t;pop=t;pdx=-160*(1-ease(t));}
  else if(key==='elong'){p=lerp(1.5,16.5,t);bub=1;pop=1;}
  else{p=16.5;bub=1-t;pop=1-t;fall=t;pdx=120*t;}

  const stub=(x0,x1)=>`<line x1="${x0}" y1="200" x2="${x1}" y2="200" stroke="${COLS.dna}" stroke-width="5"/><line x1="${x0}" y1="270" x2="${x1}" y2="270" stroke="${COLS.dna}" stroke-width="5"/>${Array.from({length:Math.floor((x1-x0)/22)},(_,k)=>`<line x1="${x0+11+k*22}" y1="204" x2="${x0+11+k*22}" y2="266" stroke="#adb5bd" stroke-width="6"/>`).join('')}`;
  g+=stub(30,txx(0)-22)+stub(txx(N-1)+22,830);
  if(A){g+=`<rect x="30" y="182" width="${txx(0)-52}" height="106" rx="8" fill="#ffe066" fill-opacity=".35" stroke="#e67700" stroke-dasharray="5 4"/>`+TX((30+txx(0)-22)/2,244,tr('promotor','promoter'),{a:'middle',b:1,fs:13,h:1});}
  g+=`<path d="M${txx(0)-20} 112 L${txx(0)-20} 104 L${txx(N-1)+20} 104 L${txx(N-1)+20} 112" fill="none" stroke="#1c2621" class="ln" stroke-width="2"/>`+TX((txx(0)+txx(N-1))/2,96,tr('gen','gene'),{a:'middle',b:1,fs:14});

  const sl=(y,s)=>TX(26,y,s,{fs:12,b:1,h:1});
  g+=sl(192,tr('nić kodująca','coding strand'))+sl(292,tr('nić matrycowa','template strand'));
  if(A){const e=(x,y,s)=>TX(x,y,s,{a:'middle',b:1,fs:13});g+=e(txx(N-1)+30,yc(N-1)-6,'3′')+e(txx(N-1)+30,yt(N-1)+20,'5′');if(c>1)g+=e(txx(0)-30,436,'5′');}
  return svgWrap(g,Object.assign({aria:tr('Animacja transkrypcji: ','Transcription animation: ')+T(TXN[key])},o));
}

const TL_M='GC'+toRNA(TX_COD)+'CA',TL_ST=2,TL_C=translateFrom(TL_M,TL_ST);
const TLK=['init','e1','e2','e3','stop'];
const tlName=k=>{if(k==='init')return tr('Inicjacja – kodon START','Initiation – START codon');if(k==='stop')return tr('Terminacja – kodon STOP','Termination – STOP codon');const n=+k[1],a=TL_C[n].a;return tr(`Elongacja: ${n+1}. aminokwas (${aaAb(a)})`,`Elongation: amino acid ${n+1} (${aaAb(a)})`);};
const ANTI=c=>c.replace(/./g,x=>RCMP[x]);
function tlDesc(k){const A=S.lvl==='A';
  if(k==='init')return [tr('Translacja zachodzi w cytoplazmie, na rybosomach. Mała podjednostka rybosomu przyłącza się do mRNA i przesuwa się wzdłuż niego aż do kodonu START (AUG). Pasuje do niego tRNA z antykodonem UAC, niosące metioninę (Met). Następnie dołącza duża podjednostka.','Translation takes place in the cytoplasm, on ribosomes. The small ribosomal subunit binds to the mRNA and moves along it to the START codon (AUG). A tRNA with the anticodon UAC, carrying methionine (Met), matches it. Then the large subunit joins.'),
    A?tr('Inicjatorowe tRNA wiąże się w miejscu P rybosomu. Z tego powodu prawie każde nowo powstałe białko zaczyna się od metioniny (często później usuwanej).','The initiator tRNA binds in the P site of the ribosome. That is why almost every newly made protein starts with methionine (often removed later).'):''];
  if(k==='stop')return [tr('Rybosom dochodzi do kodonu STOP (UAA). Nie pasuje do niego żadne tRNA, więc synteza się kończy: gotowy łańcuch aminokwasów zostaje uwolniony, a rybosom rozpada się na podjednostki. Łańcuch zwija się i przyjmuje kształt potrzebny białku do działania.','The ribosome reaches the STOP codon (UAA). No tRNA matches it, so synthesis ends: the finished chain of amino acids is released and the ribosome splits into its subunits. The chain folds into the shape the protein needs in order to work.'),
    A?tr('Do kodonu STOP w miejscu A przyłącza się białkowy czynnik uwalniający (terminacyjny). Kodony STOP: UAA, UAG, UGA. Jedno mRNA może być jednocześnie odczytywane przez wiele rybosomów (polisom).','A protein release (termination) factor binds to the STOP codon in the A site. The STOP codons are UAA, UAG and UGA. One mRNA can be read by many ribosomes at once (a polysome).'):''];
  const n=+k[1],x=TL_C[n];
  return [tr(`Do kolejnego kodonu (${x.c}) przyłącza się tRNA z pasującym antykodonem (${ANTI(x.c)}), niosące ${aaNm(x.a)} (${aaAb(x.a)}). Między aminokwasami powstaje wiązanie peptydowe – łańcuch wydłuża się o jeden aminokwas.`,`An tRNA with the matching anticodon (${ANTI(x.c)}), carrying ${aaNm(x.a)} (${aaAb(x.a)}), binds to the next codon (${x.c}). A peptide bond forms between the amino acids – the chain grows by one amino acid.`).replace('An tRNA','A tRNA'),
    tr('Rybosom przesuwa się o jeden kodon (3 nukleotydy). Wolne tRNA odłącza się i może przyłączyć następną cząsteczkę swojego aminokwasu.','The ribosome moves along by one codon (3 nucleotides). The empty tRNA leaves and can pick up another molecule of its amino acid.'),

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
function codeHits(q){q=q.trim();if(!q)return null;const u=q.toUpperCase().replace(/\s/g,'');
  if(/^[ACGTU]{1,3}$/.test(u)){const p=toRNA(u);return new Set(Object.keys(CODE).filter(c=>c.startsWith(p)));}
  const n=norm(q),out=new Set();for(const c in CODE){const a=CODE[c],d=AA[a];const ws=x=>norm(x).split(/[\s()]+/).some(w=>w.startsWith(n))||norm(x).startsWith(n);if(norm(d[0]).startsWith(n)||ws(d[1])||ws(d[2])||(c==='AUG'&&'start'.startsWith(n)))out.add(c);}return out;}
function codeArea(){

    return `<td><button data-cod="${c}" class="${aaCls(a)}${S.code.sel===c?' on':''}${hits?(hits.has(c)?' hit':' fade'):''}" aria-label="${c}: ${esc(a==='*'?'STOP':aaNm(a))}"><span class="cd">${c}</span><span>${a==='*'?'STOP':aaAb(a)}${c==='AUG'?' <span class="tag">START</span>':''}</span></button></td>`;}).join('')}<td class="b3">${th}</td></tr>`).join('')).join('')}</tbody></table></div>`;
  let res='';
  if(hits){const aas=[...new Set([...hits].map(c=>CODE[c]))];res=hits.size?`<div class="reslist">${aas.map(a=>`<span class="aa ${aaCls(a)}"><b>${a==='*'?'STOP':`${aaAb(a)} – ${esc(aaNm(a))}`}</b>${[...hits].filter(c=>CODE[c]===a).join(', ')}</span>`).join('')}</div>`:`<p class="note">${tr('Brak wyników.','No results.')}</p>`;}
  return res+tbl;
}

   ${c==='AUG'?`<p>${tr('To kodon START: od niego zaczyna się translacja. Jednocześnie koduje metioninę – także wewnątrz białka.','This is the START codon: translation begins here. It also codes for methionine – inside the protein too.')}</p>`:''}
   <p>${a==='*'?tr('Wszystkie kodony STOP','All STOP codons'):tr('Kodony tego aminokwasu','Codons for this amino acid')} (${same.length}): <span class="sq">${same.join(', ')}</span></p>
   ${same.length>1&&a!=='*'?`<p class="note">${tr('Kilka kodonów – jeden aminokwas: to przykład degeneracji kodu.','Several codons – one amino acid: an example of the code’s degeneracy.')}</p>`:''}
   <p>${tr('Nić kodująca DNA','DNA coding strand')}: <span class="sq">${toDNA(c)}</span>${A?`<br>${tr('Nić matrycowa DNA (3′→5′)','DNA template strand (3′→5′)')}: <span class="sq">${comp(toDNA(c))}</span>`:''}${a!=='*'?`<br>${tr('Antykodon tRNA','tRNA anticodon')}${A?' (3′→5′)':''}: <span class="sq">${ANTI(c)}</span>`:''}</p>`;
}

function mutNow(){
  const A=S.lvl==='A',cod=S.seq.cod,an=analyse(cod),M=S.mut;
  if(M.pos==null||M.pos>=cod.length)M.pos=an.st>=0?Math.min(cod.length-1,an.st+4):Math.floor(cod.length/2);
  if(!A){M.del=1;M.ins=M.ins[0]||'A';}
  if(M.type==='del')M.pos=Math.min(M.pos,cod.length-M.del);
  if(M.type==='sub'&&M.base===cod[M.pos])M.base=[...'ATCG'].find(b=>b!==cod[M.pos]);
  const m={type:M.type,pos:M.pos,base:M.base,ins:M.ins,del:M.del};
  return{cod,an,m,c:classify(cod,m)};
}
function mutRes(){
  const A=S.lvl==='A',{cod,an,m,c}=mutNow(),B=c.B,mut=c.mut,n=c.n;
  const dC=k=>!an.cod[k]||!B.cod[k]||an.cod[k].c!==B.cod[k].c,dA=k=>!an.cod[k]||!B.cod[k]||an.cod[k].a!==B.cod[k].a;
  const hl=(i,b,cc)=>({cls:cc.cls+(B.st<0||i<B.st||i>=B.end?' dim':'')+((m.type==='sub'&&i===m.pos)||(m.type==='ins'&&i>=m.pos&&i<m.pos+n)?' mk':'')});
  const L5=A?' 5′→3′':'';
  const what=m.type==='sub'?tr(`${cod[m.pos]} → ${m.base} (${m.pos+1}. nukleotyd)`,`${cod[m.pos]} → ${m.base} (nucleotide ${m.pos+1})`):m.type==='ins'?tr(`wstawiono ${m.ins} przed ${m.pos+1}. nukleotydem`,`${m.ins} inserted before nucleotide ${m.pos+1}`):tr(`usunięto ${cod.substr(m.pos,m.del)} (od ${m.pos+1}. nukleotydu)`,`${cod.substr(m.pos,m.del)} removed (from nucleotide ${m.pos+1})`);
  const pO=protOf(an),pM=protOf(B);
  return `<div class="msg mbig ${['silent','outside','inframe'].includes(c.c)?'ok':'no'}"><b>${esc(T(MTYPE[m.type]))}: ${esc(what)}</b><br><b>${esc(T(MUTC[c.c]))}.</b> ${esc(mutExpl(c))}</div>
   <h3>${tr('Sekwencja prawidłowa','Original sequence')}</h3>${sgrid(cod.length,[ntRow(tr('DNA (nić kodująca)','DNA (coding strand)')+L5,cod,dimF(an)),codRow(tr('kodony mRNA','mRNA codons'),an),aaRow(tr('aminokwasy','amino acids'),an)])}
   <h3>${tr('Sekwencja zmutowana','Mutated sequence')}</h3>${sgrid(Math.max(mut.length,1),[ntRow(tr('DNA (nić kodująca)','DNA (coding strand)')+L5,mut,hl),codRow(tr('kodony mRNA','mRNA codons'),B,dC),aaRow(tr('aminokwasy','amino acids'),B,dA)])}
   <div class="ugrid"><div><h3>${tr('Białko prawidłowe','Original protein')} (${pO.length})</h3>${an.st>=0?chainHTML(an):`<p class="note">${tr('brak białka','no protein')}</p>`}</div>
    <div><h3>${tr('Białko zmutowane','Mutant protein')} (${pM.length})</h3>${B.st>=0?chainHTML(B,dA):`<p class="note">${tr('brak białka – nie ma kodonu START','no protein – no START codon')}</p>`}</div></div>
   <p class="note">${tr('Czerwona ramka = zmieniony kodon lub aminokwas w porównaniu z sekwencją prawidłową (pozycja po pozycji).','Red outline = codon or amino acid that differs from the original (position by position).')}</p>`;
}

function wsBuild(){
  const ws=S.ws,A=S.lvl==='A',gs=ws.groups?['A','B']:[''];const pool=shuffle(WOPEN[S.lvl],rngOf(ws.seed*3+5)),nq=A?3:2;
  const cats=A?['missense','nonsense','silent','frameshift']:['sub','ins','del'],c0=Math.floor(rngOf(ws.seed*11+3)()*cats.length);
  return gs.map((g,gi)=>{const r=rngOf(ws.seed*7+gi*1013+1),tasks=[];let no=0;
    tasks.push({no:++no,kind:'comp',s:rndPlain(r,A?15:12)});
    tasks.push({no:++no,kind:'tx',s:rndPlain(r,A?15:12)});
    tasks.push({no:++no,kind:'tl',m:toRNA(rndSeq(r,A?4:3,1+Math.floor(r()*2),1))});
    tasks.push({no:++no,kind:'mut',g:genMut(r,cats[(c0+gi)%cats.length])});
    tasks.push({no:++no,kind:'tbl',rows:DNARNA.filter(x=>x[3]==='B'||A)});
    for(let i=0;i<nq;i++)tasks.push({no:++no,kind:'open',q:pool[(gi*nq+i)%pool.length]});
    return{g,tasks};});
}

function svgToCanvas(svg,w,h,bg='#fff'){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c);};img.onerror=e=>{URL.revokeObjectURL(u);rej(e);};img.src=u;});}

const setKey=k=>{if(S.tab==='rep')S.rep=k;else S.tt[S.tt.mode]=k;};

// ================= animacja =================
let raf=null,hold=null,fin=null;
const RMo=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopAnim(){if(raf)cancelAnimationFrame(raf);raf=null;if(hold)clearTimeout(hold);hold=null;if(fin)clearTimeout(fin);fin=null;}
function stopPlay(){S.playing=false;stopAnim();S.t=1;}
function drawScene(){const el=$('#scene');if(el)el.innerHTML=curScene();}
function startAnim(){stopAnim();if(RMo()){S.t=1;drawScene();afterAnim();return;}
  S.t=0;drawScene();const t0=performance.now(),dur=S.tab==='rep'&&S.rep==='elong'||S.tt.mode==='tx'&&S.tt.tx==='elong'&&S.tab==='tt'?4200:2200;
  const tick=now=>{S.t=Math.min(1,(now-t0)/dur);drawScene();if(S.t<1)raf=requestAnimationFrame(tick);else{raf=null;if(fin)clearTimeout(fin);fin=null;afterAnim();}};raf=requestAnimationFrame(tick);
  // gdy karta jest w tle, requestAnimationFrame nie działa – wtedy kończymy animację od razu
  fin=setTimeout(()=>{fin=null;if(raf){cancelAnimationFrame(raf);raf=null;S.t=1;drawScene();afterAnim();}},dur+400);}
function afterAnim(){if(!S.playing)return;hold=setTimeout(()=>{hold=null;const ks=keysOf(),i=ks.indexOf(curKey());
  if(i>=ks.length-1){S.playing=false;render();return;}setKey(ks[i+1]);render();startAnim();},RMo()?4000:1800);}

// ================= całość =================
function focusKey(el){if(!el||el===document.body)return null;if(el.id)return '#'+CSS.escape(el.id);
  const a=[...el.attributes].filter(x=>x.name.startsWith('data-')).map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join('');if(!a)return null;
  const ctx=el.closest('[data-ctx]');return (ctx?`[data-ctx="${ctx.dataset.ctx}"] `:'')+el.tagName.toLowerCase()+a;}
function render(keep=true){
  const fk=keep?focusKey(document.activeElement):null;
  const sl=$$('#app .scroll, #app .tablewrap, #app .sqbox').map(e=>e.scrollLeft);
  document.documentElement.lang=L;document.title=T(GEN?UI.gt1:UI.t1);
  $('#t1').textContent=T(GEN?UI.gt1:UI.t1);$('#t2').textContent=T(GEN?UI.gt2:UI.t2);
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
  $('#tabs').innerHTML=Object.entries(UI.tabs).filter(([k])=>GEN===(k==='sheet')).map(([k,v])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(T(v))}</button>`).join('');
  $('#app').innerHTML={struct:viewStruct,rep:viewRep,tt:viewTT,lab:viewLab,code:viewCode,mut:viewMut,quiz:viewQuiz,sheet:viewSheet}[S.tab]();
  $$('#app .scroll, #app .tablewrap, #app .sqbox').forEach((e,i)=>{if(sl[i])e.scrollLeft=sl[i];});
  if(fk){const el=$(fk);if(el&&el!==document.activeElement)try{el.focus({preventScroll:true});}catch(_){}}
}
function fixKeys(){if(!REPK[S.lvl].includes(S.rep))S.rep='start';if(!TXK[S.lvl].includes(S.tt.tx))S.tt.tx='bind';}
function act(b){
  const d=b.dataset;let after=null,anim=false;
  if(d.lang){L=d.lang;try{localStorage.setItem('dnaLang',L);}catch(_){}}
  else if(d.tab){if(d.tab!==S.tab){stopPlay();S.pngSt='';}S.tab=d.tab;}
  else if(d.lvl){if(S.lvl!==d.lvl){stopPlay();S.lvl=d.lvl;S.q=null;fixKeys();S.wsSt='';S.pngSt='';
    if(d.lvl==='B'&&S.seq.strand==='t'){S.seq.strand='c';S.seq.raw=S.seq.cod;S.seq.err='';}}}
  else if(d.part){S.part=d.part;S.pngSt='';}
  else if(d.step){stopPlay();setKey(d.step);anim=true;S.pngSt='';}
  else if(d.ttm){stopPlay();S.tt.mode=d.ttm;S.pngSt='';}
  else if(d.strand){if(d.strand!==S.seq.strand){S.seq.strand=d.strand;S.seq.raw=inT()?comp(S.seq.cod):S.seq.cod;S.seq.err='';}}
  else if(d.cod){S.code.sel=d.cod;}
  else if(d.mt){S.mut.type=d.mt;}
  else if(d.mb){S.mut.base=d.mb;}
  else if(d.mi){S.mut.ins=d.mi;}
  else if(d.md){S.mut.del=+d.md;}
  else if(d.mpos){S.mut.pos=+d.mpos;}
  else if(d.ans){answer(d.ans);after='#nextQ';}
  else if(b.id==='nextQ'){newQ();after='.card .q';}
  else if(d.act==='prev'||d.act==='next'){stopPlay();const ks=keysOf(),i=ks.indexOf(curKey()),j=Math.max(0,Math.min(ks.length-1,i+(d.act==='next'?1:-1)));setKey(ks[j]);anim=true;S.pngSt='';}
  else if(d.act==='replay'){stopPlay();anim=true;}
  else if(d.act==='play'){if(S.playing){stopPlay();}else{const ks=keysOf();if(ks.indexOf(curKey())>=ks.length-1)setKey(ks[0]);S.playing=true;anim=true;}}
  else if(d.act==='png'){pngClick();return;}
  else if(d.act==='docx'){docxClick();return;}
  else if(d.act==='wsNew'){S.ws.seed=1+Math.floor(Math.random()*99999);S.wsSt='';}
  else if(d.act==='exNew'){S.ex={s:rndPlain(Math.random,10),a:''};}
  else if(d.act==='exShow'){S.ex.a=comp(S.ex.s);}
  else if(d.act==='seqRnd'){seqSet(rndSeq(Math.random,4+Math.floor(Math.random()*4)));}
  else if(d.act==='seqEx'){seqSet('GCATGGCTAAAGGTTTCTGGTAAGC');}
  else return;
  render();
  if(anim)startAnim();
  if(after){const el=$(after);if(el){if(after==='.card .q')el.setAttribute('tabindex','-1');el.focus({preventScroll:after!=='.card .q'});}}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lang],[data-tab],[data-lvl],[data-part],[data-step],[data-ttm],[data-strand],[data-cod],[data-mt],[data-mb],[data-mi],[data-md],[data-mpos],[data-ans],#nextQ,[data-act]');
  if(!b||b.disabled)return;act(b);
});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('svg [data-part][tabindex]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act(g);}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.wsopt){S.ws[t.dataset.wsopt]=t.checked;S.wsSt='';render();}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='exIn'){S.ex.a=t.value;$('#exFb').innerHTML=exFb();}
  else if(t.id==='seqIn'){S.seq.raw=t.value;const p=seqParse(t.value);
    if(p.err){S.seq.err=p.err;$('#seqErr').innerHTML=`<div class="msg no">${p.err}</div>`;}
    else{S.seq.err='';$('#seqErr').innerHTML='';S.seq.cod=inT()?comp(p.s):p.s;S.mut.pos=null;$('#labOut').innerHTML=labOut();}}
  else if(t.id==='codeQ'){S.code.q=t.value;$('#codeArea').innerHTML=codeArea();}
  else if(t.id==='insIn'){const v=t.value.toUpperCase().replace(/\s/g,'');if(/^[ATCG]{1,3}$/.test(v)){S.mut.ins=v;$('#mutRes').innerHTML=mutRes();$$('[data-mi]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mi===v));}}
});
render();
</script>

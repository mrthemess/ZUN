 jesion:['Jesion wyniosły','Fraxinus excelsior','Wysokie drzewo o liściach złożonych z 7–13 listków. Zimą łatwo je poznać po czarnych, aksamitnych pąkach.','Wilgotne lasy, łęgi, doliny rzek.',null,null,null,null,["European ash","A tall tree with compound leaves made of 7–13 leaflets. In winter it is easy to recognise by its black, velvety buds.","Damp woodland, riverside forests, river valleys.",null,null,null,null]],
 jarzab:['Jarząb pospolity (jarzębina)','Sorbus aucuparia','Niewysokie drzewo o pierzastych liściach. Czerwone owoce chętnie zjadają ptaki.','Lasy, zarośla, parki i ulice w całej Polsce.',null,null,null,null,["Rowan (mountain ash)","A small tree with pinnate leaves. Birds love eating its red berries.","Woods, thickets, parks and streets throughout Poland.",null,null,null,null]],
 klon:['Klon zwyczajny','Acer platanoides','Drzewo o dużych, dłoniastych liściach, jesienią żółtych i czerwonych. Kwitnie żółtozielono wczesną wiosną, zanim rozwiną się liście.','Lasy liściaste, parki, aleje.',null,null,null,null,["Norway maple","A tree with large, palmate leaves that turn yellow and red in autumn. Its yellowish-green flowers appear in early spring, before the leaves open.","Broadleaved woods, parks, avenues.",null,null,null,null]],
 jawor:['Klon jawor','Acer pseudoplatanus','Duży klon gór i wyżyn. Kora starych drzew łuszczy się płatami.','Lasy górskie i wyżynne, parki.',null,null,null,null,["Sycamore","A large maple of mountains and uplands. The bark of old trees peels off in flakes.","Mountain and upland forests, parks.",null,null,null,null]],
 dabszyp:['Dąb szypułkowy','Quercus robur','Potężne drzewo, które może żyć kilkaset lat. Najstarsze dęby w Polsce mają nawet ponad 600 lat.','Lasy liściaste i mieszane na nizinach, parki.',null,null,null,null,["Pedunculate oak","A mighty tree that can live for several hundred years. The oldest oaks in Poland are more than 600 years old.","Broadleaved and mixed lowland forests, parks.",null,null,null,null]],
 dabbez:['Dąb bezszypułkowy','Quercus petraea','Bardzo podobny do dębu szypułkowego. Najłatwiej odróżnić je po żołędziach i ogonkach liści.','Lasy na wyżynach i w zachodniej Polsce.',null,null,null,null,["Sessile oak","Very similar to the pedunculate oak. The easiest way to tell them apart is by their acorns and leaf stalks.","Upland forests and western Poland.",null,null,null,null]],
 buk:['Buk zwyczajny','Fagus sylvatica','Drzewo o gładkiej, szarej korze. W buczynie latem jest tak cienisto, że pod drzewami rośnie niewiele roślin.','Pomorze, góry i wyżyny.',null,null,null,null,["European beech","A tree with smooth, grey bark. In a beech wood it is so shady in summer that few plants grow under the trees.","Pomerania, mountains and uplands.",null,null,null,null]],
 wierzba:['Wierzba biała','Salix alba','Duże drzewo o liściach srebrzystych od spodu. Często przycinana – tworzy wtedy charakterystyczne „wierzby głowiaste”.','Brzegi rzek, łąki, rowy.',null,null,null,null,["White willow","A large tree with leaves that are silvery underneath. It is often cut back, forming the typical ‘pollarded willows’.","River banks, meadows, ditches.",null,null,null,null]],
 lipa:['Lipa drobnolistna','Tilia cordata','Drzewo o sercowatych liściach i bardzo pachnących kwiatach, które odwiedzają pszczoły. Owoce to kuliste orzeszki przyczepione do skrzydełka.','Lasy liściaste, parki, aleje, wsie.',null,null,null,null,["Small-leaved lime","A tree with heart-shaped leaves and very fragrant flowers that are visited by bees. Its fruits are round nutlets attached to a wing-like bract.","Broadleaved woods, parks, avenues, villages.",null,null,null,null]],
 leszczyna:['Leszczyna pospolita','Corylus avellana','Krzew o wielu pędach. Kwitnie bardzo wcześnie – już pod koniec zimy zwisają z niego żółte „kotki”. Owoce to orzechy laskowe.','Podszyt lasów, zarośla, skraje lasów.',null,null,null,null,["Common hazel","A shrub with many stems. It flowers very early – yellow ‘catkins’ hang from it at the end of winter. Its fruits are hazelnuts.","Woodland undergrowth, thickets, woodland edges.",null,null,null,null]],
 wiaz:['Wiąz','Ulmus','W Polsce rosną trzy gatunki wiązów: górski, polny i szypułkowy. Wszystkie mają niesymetryczną nasadę liścia i owoce w postaci płaskich, okrągłych skrzydlaków.','Lasy łęgowe, doliny rzek, parki.',null,'Wiąz',null,null,["Elm","Three species of elm grow in Poland: wych elm, field elm and European white elm. All have an asymmetrical leaf base and fruits that are flat, round winged seeds.","Riverside forests, river valleys, parks.",null,null,null,"Elm"]],
 osika:['Topola osika','Populus tremula','Liście drżą nawet przy słabym wietrze – stąd powiedzenie „drżeć jak osika”.','Lasy, zręby, skraje lasów w całej Polsce.',null,'Topola_osika',null,null,["Aspen","Its leaves tremble even in a light breeze – hence the saying ‘to tremble like an aspen leaf’.","Forests, clearings, woodland edges throughout Poland.",null,null,null,null]],
 brzoza:['Brzoza brodawkowata','Betula pendula','Drzewo o białej korze z czarnymi spękaniami i zwisających gałązkach. Jako jedna z pierwszych zarasta wolne miejsca.','Lasy, nieużytki, piaszczyste gleby w całej Polsce.',null,null,null,null,["Silver birch","A tree with white bark marked by black cracks, and drooping twigs. It is one of the first trees to grow on open, bare ground.","Forests, wasteland, sandy soils throughout Poland.",null,null,null,null]],
 olsza:['Olsza czarna','Alnus glutinosa','Drzewo wilgotnych miejsc. Na korzeniach ma brodawki z bakteriami, które pobierają azot z powietrza.','Olsy, brzegi rzek i jezior, mokradła.',null,null,null,null,["Black alder","A tree of damp places. Its roots have nodules with bacteria that take nitrogen from the air.","Alder swamps, banks of rivers and lakes, marshes.",null,null,null,null]],
 grab:['Grab zwyczajny','Carpinus betulus','Drzewo o gładkiej, szarej korze i nieregularnym, „żylastym” pniu. Razem z dębem tworzy lasy zwane grądami.','Lasy liściaste w całej Polsce.',null,null,null,null,["Hornbeam","A tree with smooth, grey bark and an irregular, ‘sinewy’ trunk. Together with oak it forms woods known as oak–hornbeam forests.","Broadleaved woods throughout Poland.",null,null,null,null]],
 czeremcha:['Czeremcha zwyczajna','Prunus padus','Drzewo lub duży krzew, który w maju pokrywa się białymi, mocno pachnącymi kwiatami. Owoce są cierpkie.','Wilgotne lasy, brzegi rzek, zarośla.',null,null,null,null,["Bird cherry","A tree or large shrub that is covered in white, strongly scented flowers in May. Its fruits taste sharp and bitter.","Damp woodland, river banks, thickets.",null,null,null,null]]
 }},

 sp:{
 orlica:['Orlica pospolita','Pteridium aquilinum','Największa polska paproć. Liście wyrastają pojedynczo z podziemnego kłącza i tworzą gęste zarośla.','Suche bory i zręby.',null,null,null,null,["Bracken","The largest Polish fern. Its leaves grow singly from an underground rhizome and form dense thickets.","Dry pine forests and clearings.",null,null,null,null]],
 nerecznica:['Nerecznica samcza','Dryopteris filix-mas','Pospolita paproć o liściach zebranych w kępę. Rozmnaża się przez zarodniki, które dojrzewają na spodzie liści.','Wilgotne lasy liściaste i mieszane.',null,null,null,null,["Male fern","A common fern with its leaves growing in a clump. It reproduces by spores, which ripen on the underside of the leaves.","Damp broadleaved and mixed forests.",null,null,null,null]],
 borowka:['Borówka czarna (czarna jagoda)','Vaccinium myrtillus','Niska krzewinka, której owoce to leśne jagody. Barwią język na fioletowo.','Bory i lasy mieszane.',null,null,null,null,["Bilberry","A low dwarf shrub whose fruits are wild blueberries. They stain your tongue purple.","Pine and mixed forests.",null,null,null,null]],
 brusznica:['Borówka brusznica','Vaccinium vitis-idaea','Zimozielona krzewinka o kwaśnych, czerwonych owocach, z których robi się przetwory.','Suche bory sosnowe.',null,null,null,null,["Lingonberry (cowberry)","An evergreen dwarf shrub with sour red berries, which are made into preserves.","Dry pine forests.",null,null,null,null]],
 szczawik:['Szczawik zajęczy','Oxalis acetosella','Drobna roślina, której liście składają się wieczorem i przy złej pogodzie. Kwaśny smak zawdzięcza kwasowi szczawiowemu.','Cieniste, wilgotne lasy.',null,null,null,null,["Wood sorrel","A small plant whose leaves fold up in the evening and in bad weather. Its sour taste comes from oxalic acid.","Shady, damp forests.",null,null,null,null]],
 przylaszczka:['Przylaszczka pospolita','Hepatica nobilis','Jeden z pierwszych kwiatów wiosny. Kwitnie, zanim drzewa rozwiną liście.','Lasy liściaste, zwłaszcza buczyny i grądy.','Gatunek chroniony.',null,null,null,["Liverleaf (hepatica)","One of the first flowers of spring. It blooms before the trees come into leaf.","Broadleaved woods, especially beech and oak–hornbeam woods.","Protected species.",null,null,null]],
 konwalia:['Konwalia majowa','Convallaria majalis','Kwitnie w maju, a jesienią ma czerwone jagody. Cała roślina jest silnie trująca.','Lasy liściaste i mieszane.','Trująca!',null,null,null,["Lily of the valley","It flowers in May and has red berries in autumn. The whole plant is highly poisonous.","Broadleaved and mixed forests.","Poisonous!",null,null,null]],
 zawilec:['Zawilec gajowy','Anemone nemorosa','Wczesną wiosną tworzy białe „dywany” w lasach liściastych, zanim drzewa rozwiną liście.','Lasy liściaste w całej Polsce.','Trujący!',null,null,null,["Wood anemone","In early spring it forms white ‘carpets’ in broadleaved woods, before the trees come into leaf.","Broadleaved woods throughout Poland.","Poisonous!",null,null,null]],
 zawilecz:['Zawilec żółty','Anemone ranunculoides','Podobny do zawilca gajowego, ale ma żółte kwiaty. Często rosną razem.','Wilgotne lasy liściaste, łęgi.','Trujący!',null,null,null,["Yellow anemone","Similar to the wood anemone, but with yellow flowers. The two often grow together.","Damp broadleaved woods, riverside forests.","Poisonous!",null,null,null]]

 sp:{
 nietoperze:['Nietoperze','Chiroptera','Jedyne ssaki zdolne do aktywnego lotu. W Polsce żyje ponad 20 gatunków. Polują nocą na owady i orientują się dzięki echolokacji.','Strychy, piwnice, dziuple, jaskinie.','Wszystkie gatunki są pod ochroną.','Nietoperze',null,null,["Bats","The only mammals capable of true flight. More than 20 species live in Poland. They hunt insects at night and find their way by echolocation.","Attics, cellars, tree holes, caves.","All species are protected.",null,null,"Bat"]],
 jez:['Jeż','Erinaceus','W Polsce żyją dwa bardzo podobne gatunki: jeż zachodni i jeż wschodni. Zimą zapada w sen zimowy.','Ogrody, parki, skraje lasów.','Gatunek chroniony.','Jeż',null,null,["Hedgehog","Two very similar species live in Poland: the European hedgehog and the northern white-breasted hedgehog. It hibernates in winter.","Gardens, parks, woodland edges.","Protected species.",null,null,null]],
 dzik:['Dzik','Sus scrofa','Przodek świni domowej. Młode, czyli warchlaki, mają jasne, podłużne pasy.','Lasy, pola, coraz częściej obrzeża miast.',null,null,null,null,["Wild boar","The ancestor of the domestic pig. The young (piglets) have pale stripes running along the body.","Forests, fields and, more and more often, the edges of towns.",null,null,null,null]],
 zubr:['Żubr','Bison bonasus','Największy ssak lądowy Europy. Na wolności wyginął w 1919 roku i został uratowany dzięki hodowli w niewoli.','Puszcza Białowieska, Puszcza Knyszyńska, Bieszczady i inne ostoje.','Gatunek chroniony.',null,null,null,["European bison (wisent)","The largest land mammal in Europe. It died out in the wild in 1919 and was saved thanks to breeding in captivity.","Białowieża Forest, Knyszyn Forest, the Bieszczady Mountains and other refuges.","Protected species.",null,null,null]],
 los:['Łoś','Alces alces','Największy jeleniowaty świata. Dobrze pływa i chętnie zjada rośliny wodne.','Bagna i wilgotne lasy, np. nad Biebrzą.',null,'Łoś_euroazjatycki',null,null,["Elk (moose)","The largest member of the deer family in the world. It is a good swimmer and likes eating water plants.","Marshes and damp forests, e.g. in the Biebrza valley.",null,null,null,null]],

  if(S.view==='home'||!K){
    app.innerHTML=`<p class="lead">${esc(t('lead',KEYS.reduce((s,K)=>s+K.count,0)))}</p>
    <ul class="glist">${KEYS.map(K=>`<li><button data-g="${K.id}" style="--g:${K.hue}"><span class="em" aria-hidden="true">${K.e}</span><span><h2>${esc(gName(K))}</h2><p>${esc(gIntro(K))}</p></span><span class="cnt">${K.count}<small>${t('plural',K.count)}</small></span></button></li>`).join('')}</ul>`;
    return;
  }
  const head=`<div class="gtitle"><span class="em" aria-hidden="true">${K.e}</span><h2>${esc(gName(K))}</h2></div><p class="intro">${esc(gIntro(K))}</p>`;
  if(S.view==='key'){
    const [A,B]=K.nodes[S.node], n=K.num[S.node];
    const opt=(o,l,j)=>`<button class="opt" data-pick="${j}"><span class="l" aria-hidden="true">${l}</span><span><span class="sr">${n}${l}. </span>${esc(optText(o))}<span class="go">${isSp(K,o[1])?t('result')+esc(spName(K,o[1])):t('goto',K.num[o[1]])}</span></span></button>`;
    app.innerHTML=`<div class="kgrid"><section>${head}
      <div class="couplet"><div class="num">${n}</div><h3>${t('which')}</h3>${opt(A,'a',0)}${opt(B,'b',1)}</div>
      <div class="tools"><button class="btn" data-back ${S.path.length?'':'disabled'}>${t('back')}</button><button class="btn" data-restart ${S.path.length?'':'disabled'}>${t('restart')}</button><button class="btn" data-list>${t('all')}</button><button class="btn" data-full>${t('full')}</button></div>
      </section>${pathAside(K)}</div>`;
    return;
  }
  if(S.view==='res'){
    const sp=spData(K,S.sp), lat=K.sp[S.sp][1], path=S.via==='key'?S.path:K.paths[S.sp];
    const wiki=wikiUrl(K,S.sp);
    app.innerHTML=`<div class="kgrid one"><section>${head}<article class="result">
      <p class="found">${S.via==='key'?t('foundKey'):t('foundList')}</p>
      <h2>${esc(sp.name)}</h2><p class="lat" lang="la">${esc(lat)}</p>
      <p class="chips">${sp.warn?`<span class="chip">${esc(sp.warn)}</span>`:''}${sp.form?`<span class="chip out">${esc(sp.form)}</span>`:''}${sp.orig?`<span class="chip out">${sp.native?t('native'):t('origin')+esc(sp.orig)}</span>`:''}</p>
      <p class="d">${esc(sp.desc)}</p>
      <dl><dt>${t('where')}</dt><dd>${esc(sp.hab)}</dd></dl>
      <div class="feat"><h3>${S.via==='key'?t('howKey'):t('howList')}</h3><ul>${path.map(p=>`<li>${esc(optText(K.nodes[p.node][p.j]))}</li>`).join('')}</ul></div>
      <div class="tools" style="margin-top:18px"><button class="btn primary" data-restart>${t('another')}</button>${S.via==='key'?`<button class="btn" data-back>${t('back')}</button>`:''}<a class="btn" href="${wiki}" target="_blank" rel="noopener">${t('wiki')}</a><button class="btn" data-list>${t('all')}</button></div>
      </article></section></div>`;
    return;
  }
  if(S.view==='list'){
    const ids=Object.keys(K.sp).sort((a,b)=>spName(K,a).localeCompare(spName(K,b),L));
    app.innerHTML=`<section style="margin-top:26px">${head}<div class="tools"><button class="btn primary" data-restart>${t('fromStart')}</button><button class="btn" data-full>${t('full')}</button></div>
      <ul class="splist">${ids.map(id=>`<li><button data-sp="${id}">${esc(spName(K,id))}<i lang="la">${esc(K.sp[id][1])}</i></button></li>`).join('')}</ul>
      <p class="note">${t('listNote')}</p></section>`;
    return;
  }
  if(S.view==='full'){
    const rows=K.order.map(id=>K.nodes[id].map((o,j)=>{const g=o[1];return `<div class="row ${j?'b':'a'}"><span class="n">${K.num[id]}${j?'b':'a'}</span><span class="t"><span>${esc(optText(o))}</span></span><span class="g ${isSp(K,g)?'sp':''}">${isSp(K,g)?esc(spName(K,g)):K.num[g]}</span></div>`;}).join('')).join('');
    app.innerHTML=`<section style="margin-top:26px">${head}<div class="tools noprint"><button class="btn primary" data-restart>${t('stepwise')}</button><button class="btn" data-list>${t('all')}</button><button class="btn" data-print>${t('print')}</button></div>
      <div class="full">${rows}</div><p class="note">${t('fullNote')}</p></section>`;
  }
}
function pathAside(K){
  return `<aside class="path"><h3>${t('path')}</h3>${S.path.length?`<ol>${S.path.map((p,i)=>`<li><button data-jump="${i}" title="${esc(t('jumpBack'))}"><b>${K.num[p.node]}${p.j?'b':'a'}</b><span class="t">${esc(optText(K.nodes[p.node][p.j]))}</span></button></li>`).join('')}</ol>`:`<p class="empty">${t('pathEmpty')}</p>`}</aside>`;
}
function start(g){S={g,view:'key',node:KG[g].root,path:[],sp:null,via:'key'};render();scrollTo(0,0);}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return; const K=KG[S.g];
  if(t.dataset.lang){if(t.dataset.lang!==L){L=t.dataset.lang;try{localStorage.setItem('kluczLang',L);}catch(_){}render();}return;}
  if(t.dataset.g){start(t.dataset.g);return;}
  if('home' in t.dataset){S.view='home';S.g=null;render();return;}
  if(t.dataset.pick!=null){const j=+t.dataset.pick, g=K.nodes[S.node][j][1];S.path.push({node:S.node,j});if(isSp(K,g)){S.view='res';S.sp=g;S.via='key';}else S.node=g;render();return;}
  if('back' in t.dataset){const p=S.path.pop();if(p){S.node=p.node;S.view='key';}render();return;}
  if('restart' in t.dataset){start(S.g);return;}
  if(t.dataset.jump!=null){const i=+t.dataset.jump;S.node=S.path[i].node;S.path=S.path.slice(0,i);S.view='key';render();return;}
  if('list' in t.dataset){S.view='list';render();scrollTo(0,0);return;}
  if('full' in t.dataset){S.view='full';render();scrollTo(0,0);return;}
  if(t.dataset.sp){S.view='res';S.sp=t.dataset.sp;S.via='list';render();scrollTo(0,0);return;}
  if('print' in t.dataset){try{window.print();}catch(_){}}
});
render();

</script>

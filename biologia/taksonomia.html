<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taksonomia – od królestwa do gatunku</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--paper:#fbfbfd;--ink:#1a1f2b;--muted:#5a6273;--line:#d3d8e2;--soft:#e5e8ef;--acc:#3b4a8f;--acc-t:#3b4a8f;--acc-ink:#fff;--ok:#2e7d4f;--no:#b4432a;--focus:#c2571a;
--r0:#3b2a5c;--r1:#4b3f8f;--r2:#355f9e;--r3:#257a7d;--r4:#2f7f4f;--r5:#6e7d1e;--r6:#a3700f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--paper:#191d27;--ink:#e4e7ee;--muted:#9aa2b3;--line:#2d3342;--soft:#212633;--acc:#6b7ad1;--acc-t:#a9b3f2;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--paper:#191d27;--ink:#e4e7ee;--muted:#9aa2b3;--line:#2d3342;--soft:#212633;--acc:#6b7ad1;--acc-t:#a9b3f2;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.015em;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:16px}
header h1{margin:0;font-size:clamp(1.6rem,3.6vw,2.5rem);font-weight:800}
header p{margin:2px 0 0;color:var(--muted)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.9rem;border:0;background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 16px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn{font:inherit;font-size:.95rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}.pz .btn:disabled{opacity:.75}.pz .btn.primary:disabled{opacity:1}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
section.s{margin-top:34px}
section.s>h2{font-size:1.6rem;margin:0 0 10px}
p.lead{max-width:68ch;margin:0 0 12px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px}
.muted{color:var(--muted)}
/* drabina poziomów */
.ladder{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.exsel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.exsel button{font:inherit;font-size:.9rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px}
.exsel button[aria-pressed=true]{border-color:var(--acc);color:var(--acc-t);font-weight:700;background:var(--soft)}
.rungs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rung{display:grid;grid-template-columns:120px 1fr;align-items:center;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--paper)}
.rung .rk{color:#fff;font-weight:700;padding:10px 12px;height:100%;display:flex;align-items:center;font-size:.95rem}
.rung .tx{padding:8px 14px}.rung .tx b{display:block}.rung .tx i{color:var(--muted);font-size:.9rem}
.rung[aria-pressed=true]{border-color:var(--ink)}
.feat h3{margin:0 0 6px;font-size:1.2rem}
.mnem{margin-top:14px;font-size:1.05rem}
.mnem b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.25rem}
/* lejek */
.funnel{display:grid;gap:5px;margin-top:6px}
.fr{display:grid;grid-template-columns:110px 1fr 96px;align-items:center;gap:10px;font-size:.9rem}
.fr .in{position:absolute;left:10px;top:0;bottom:0;display:flex;align-items:center;color:#fff;font-weight:700;white-space:nowrap}
.fr .out{position:absolute;top:0;bottom:0;display:flex;align-items:center;color:var(--ink);font-weight:700;white-space:nowrap}
.fr .cnt{font-size:.85rem;color:var(--muted);white-space:nowrap}
.fr .lab{color:var(--muted);text-align:right}
.fr .bar{position:relative;height:30px;border-radius:8px;background:var(--soft);overflow:hidden}
.fr .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;overflow:hidden;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.fr .txt{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;align-items:center;height:100%;padding:0 10px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden}
.fr .txt span:last-child{font-weight:400;opacity:.95}
.kings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kings .card h3{margin:4px 0 6px;font-size:1.15rem}.kings .em{font-size:1.8rem}
.kings p{margin:0;font-size:.95rem}
/* wyszukiwarka */
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:220px;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.search input:focus{border-color:var(--acc);outline:none}
.mode{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.results{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.results li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.results .nm b{display:block}.results .nm i,.results .nm small{color:var(--muted);font-size:.88rem}
.results .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.quick button{font:inherit;font-size:.85rem;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px}
.sp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:18px}
.sp .head{display:flex;gap:16px;align-items:flex-start}
.sp img{width:120px;height:120px;object-fit:cover;border-radius:12px;flex:none;background:var(--soft)}
.sp h2{margin:0;font-size:clamp(1.6rem,3.4vw,2.2rem)}.sp .lat{font-style:italic;color:var(--muted);margin:2px 0 8px}
.sp .ext{font-size:.95rem;margin:10px 0}
table.cls{width:100%;border-collapse:collapse;margin-top:10px}
table.cls td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.cls td:first-child{width:34%}
.rkdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
table.cls i{color:var(--muted)}
/* porównanie */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.slot{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:64px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.slot.full{border-style:solid;border-color:var(--sc)}
.slot.empty{flex-direction:column;align-items:stretch;border-color:color-mix(in srgb,var(--sc) 55%,var(--line))}
.slot .sq{display:flex;gap:6px}.slot input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 9px}.slot select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;width:100%}
.sres{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;max-height:220px;overflow:auto}.sres button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;background:var(--soft);font-size:.9rem}.sres button:hover,.sres button:focus-visible{outline:2px solid var(--sc)}.sres i{color:var(--muted)}
.slot b{display:block}.slot i{color:var(--muted);font-size:.85rem}
.slot .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.2rem}
.cmp{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:5px 6px;margin-top:10px}
.cmp .rl{font-size:.85rem;color:var(--muted);text-align:right;align-self:center}
.cmp .c{border-radius:10px;padding:7px 10px;font-size:.9rem;line-height:1.25;border:2px solid var(--line);background:var(--paper);min-width:0;overflow:hidden}
.cmp .c.sh{color:#fff;border-color:transparent}
.cmp .c i{display:block;font-size:.78rem;opacity:.85}
.cmp .hd{font-weight:700;text-align:center;padding:4px 6px;border-bottom:4px solid var(--sc);font-size:.95rem}
.verdict{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--soft);border-left:6px solid var(--acc)}
.verdict p{margin:4px 0}
/* gra */
.gopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.gopts button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:14px;font-size:1.05rem;text-align:center}
.gopts button:hover{border-color:var(--acc)}
.gopts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.gopts button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio div{border-radius:14px;padding:14px;text-align:center;background:var(--paper);border:2px solid var(--sc)}
.trio b{display:block;font-size:1.15rem}.trio i{color:var(--muted);font-size:.9rem}
.score{font-weight:700;color:var(--acc-t)}
.fb{font-weight:700;font-size:1.1rem}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.pz{display:grid;gap:14px}
.pz .q{font-size:1.15rem;font-weight:700;margin:0 0 10px}
.two{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.88rem;color:var(--muted);margin-top:10px}
@media (max-width:820px){.ladder,.sp{grid-template-columns:1fr}.slots,.gopts,.trio{grid-template-columns:1fr}.cmp{grid-template-columns:80px repeat(3,minmax(0,1fr));font-size:.85rem}.hr{align-items:flex-start}.rung{grid-template-columns:96px 1fr}}
@media (prefers-reduced-motion:reduce){.fr .fill{transition:none}}
</style>
</head>

function cmpHTML(list,showHeads=true,noClosest=false){

  if(showHeads)h+=`<span></span>`+cols.map(i=>`<div class="hd" style="--sc:${SC[i]}">${esc(spName(list[i]))}</div>`).join('');
  R7.forEach((r,ri)=>{h+=`<span class="rl">${rankName(r,list[cols[0]].ranks.kingdom.la)}</span>`;
    cols.forEach(i=>{const la=list[i].ranks[r]&&list[i].ranks[r].la;const shared=la&&cols.some(j=>j!==i&&list[j].ranks[r]&&list[j].ranks[r].la===la&&R7.slice(0,ri).every(rr=>list[j].ranks[rr].la===list[i].ranks[rr].la));

  if(pairs.length===3&&!noClosest){const m=Math.max(...pairs.map(p=>p[2]));const best=pairs.filter(p=>p[2]===m);

  return h+`<div class="verdict">${v}</div>`;
}

async function enrich(sp){

  const ranks={};R7.forEach(r=>{if(m[r])ranks[r]={la:m[r],key:m[r+'Key']};});
  if(!ranks.species)ranks.species={la:sp.latin,key:m.usageKey};
  sp.ranks=ranks;sp.src='gbif';
  // polskie i angielskie nazwy wyższych taksonów z Wikidata
  const miss=R7.slice(0,6).map(r=>ranks[r]&&ranks[r].la).filter(la=>la&&!NAMES[la]);
  if(miss.length){try{const q=`SELECT ?n ?pl ?en WHERE{VALUES ?n{${miss.map(x=>JSON.stringify(x)).join(' ')}} ?t wdt:P225 ?n. OPTIONAL{?t rdfs:label ?pl FILTER(lang(?pl)='pl')} OPTIONAL{?t rdfs:label ?en FILTER(lang(?en)='en')}}`;
    const r=await getJSON('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q));
    r.results.bindings.forEach(b=>{const n=b.n.value;if(!NAMES[n]||!NAMES[n][0])NAMES[n]=[b.pl?b.pl.value:n,b.en?b.en.value:n];});}catch(e){}}

  return sp;
}

async function doSearch(q){
  q=(q||'').trim();if(!q)return;S.searched=true;const loc=localFind(q);S.results=loc;S.busy=t('loading');render();$('#q').value=q;
  if(await checkOnline()){try{const r=await wdSearch(q);const seen=new Set(loc.map(s=>s.latin));r.forEach(s=>{if(!seen.has(s.latin)){S.results.push(s);seen.add(s.latin);}else{const l=loc.find(x=>x.latin===s.latin);if(l){l.wiki=s.wiki;l.qid=s.qid;}}});}catch(e){}}
  S.busy='';render();$('#q').value=q;
}
const ENR={};
async function ready(s){
  if(s.src==='local'&&S.online){if(ENR[s.latin])s=ENR[s.latin];else{const c=Object.assign({},s,{ranks:JSON.parse(JSON.stringify(s.ranks)),src:'wd'});ENR[s.latin]=c;s=c;}}
  if(s.src==='wd'&&!s.enriched){S.busy=t('loadc');render();
    try{await enrich(s);s.enriched=true;}catch(e){const l=byLatin(s.latin);S.busy='';if(l)return l;S.busy=t('err');render();return null;}
    if(!s.wiki&&S.online){try{const r=await wdSearch(s.latin);const m=r.find(x=>x.latin===s.latin);if(m){s.wiki=m.wiki;if(!s.pl)s.pl=m.pl;if(!s.en)s.en=m.en;}}catch(e){}}
    await summary(s);S.busy='';}
  else if(S.online)await summary(s);
  return s;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-rung]');if(!b)return;
  if(b.dataset.lang){L=b.dataset.lang;try{localStorage.setItem('taksoLang',L);}catch(_){}if(S.cur&&S.online)await summary(S.cur);render();return;}
  if(b.dataset.tab){S.tab=b.dataset.tab;render();if(S.tab==='find'&&S.online===null){checkOnline().then(render);}return;}
  if(b.dataset.ex){S.ex=b.dataset.ex;render();return;}
  if(b.dataset.rung){S.rung=b.dataset.rung;render();return;}
  if(b.id==='go'){doSearch($('#q').value);return;}
  if(b.dataset.q){const s=byLatin(b.dataset.q);S.cur=s;render();const r=await ready(s);if(r)S.cur=r;render();return;}
  if(b.dataset.show!=null){const s=S.results[+b.dataset.show];const r=await ready(s);if(r){S.cur=r;}render();return;}
  const addTo=s=>{if(S.cmp.some(x=>x&&x.latin===s.latin))return;const i=S.cmp.indexOf(null);S.cmp[i<0?2:i]=s;};
  if(b.dataset.add!=null){const s=await ready(S.results[+b.dataset.add]);if(s){addTo(s);}render();return;}
  if('addcur' in b.dataset){addTo(S.cur);render();return;}
  if(b.dataset.rm!=null){S.cmp[+b.dataset.rm]=null;render();return;}
  if(b.dataset.slotgo!=null){slotSearch(+b.dataset.slotgo);return;}
  if(b.dataset.fill){const [i,j]=b.dataset.fill.split(':').map(Number);const r=await ready(S.slotRes[i][j]);if(r){S.cmp[i]=r;S.slotRes[i]=[];S.slotQ[i]='';}render();return;}
  if(b.dataset.pick!=null&&S.round.picked==null){S.round.picked=+b.dataset.pick;S.score[1]++;if(S.round.picked===S.round.ans)S.score[0]++;render();return;}
  if('newround' in b.dataset){newRound();render();return;}
  if(b.dataset.pz!=null){S.pz[+b.dataset.pz]=+b.dataset.pc;render();return;}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.slotq!=null)S.slotQ[+e.target.dataset.slotq]=e.target.value;});
document.addEventListener('change',async e=>{const i=e.target.dataset&&e.target.dataset.slotsel;if(i==null||!e.target.value)return;const s=byLatin(e.target.value);const r=await ready(s);if(r)S.cmp[+i]=r;render();});
async function slotSearch(i){const q=(S.slotQ[i]||'').trim();if(!q)return;S.slotRes[i]=localFind(q);S.slotBusy[i]=1;render();
  if(await checkOnline()){try{const r=await wdSearch(q);const seen=new Set(S.slotRes[i].map(s=>s.latin));r.forEach(s=>{if(!seen.has(s.latin)){S.slotRes[i].push(s);seen.add(s.latin);}});}catch(e){}}
  S.slotBusy[i]=0;if(!S.slotRes[i].length)S.slotRes[i]=[];render();const el=document.querySelector(`[data-slotq="${i}"]`);if(el){el.focus();}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.slotq!=null){slotSearch(+e.target.dataset.slotq);return;}if(e.key==='Enter'&&e.target.id==='q')doSearch(e.target.value);const r=e.target.closest&&e.target.closest('[data-rung]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.rung=r.dataset.rung;render();}});
render();

</script>

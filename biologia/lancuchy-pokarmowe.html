<html lang="pl"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Łańcuchy i sieci pokarmowe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>:root{--bg:#e9f0eb;--panel:#fff;--ink:#16302a;--muted:#5a6e66;--line:#cbd9d0;--acc:#1f5e4b;--accs:#d9eae1;
--l1:#3e8e41;--l2:#c4930f;--l3:#df7433;--l4:#c2412d;--l5:#7b3f8c;--l6:#3f4c9e;--ld:#8b6b4a;
--ok:#2f8a4a;--bad:#c2412d;--warn:#b7791f;--r:14px;font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.btn,.tabs button,.ecos button,.card .nm{font-family:"Bricolage Grotesque",system-ui,sans-serif}
#app{max-width:1280px;margin:0 auto;padding:18px 18px 30px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ttl{display:flex;gap:14px;align-items:center}
.logo{flex:none}
h1{margin:0;font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.1;font-weight:800;letter-spacing:-.01em}
#sub{margin:4px 0 0;color:var(--muted)}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);font:700 .95rem system-ui;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px;border-bottom:2px solid var(--line);padding-bottom:10px}
.tabs button{border:2px solid transparent;background:transparent;color:var(--ink);font-size:1.05rem;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button:hover{background:var(--accs)}
.tabs button[aria-selected=true]{background:var(--acc);color:#fff}
#ecobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
#ecolbl{font-weight:700;color:var(--muted);font-size:.9rem}
.ecos{display:flex;gap:6px;flex-wrap:wrap}
.ecos button{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:.95rem;font-weight:600;cursor:pointer}
.ecos button[aria-pressed=true]{border-color:var(--acc);background:var(--accs)}
main>section{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
button:focus-visible,select:focus-visible,input:focus-visible,[data-node]:focus-visible{outline:3px solid #2a7fd4;outline-offset:2px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:8px 13px;font:600 .95rem system-ui;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accs);color:var(--acc);font-weight:800}
.btn{border:2px solid var(--acc);background:var(--panel);color:var(--acc);border-radius:12px;padding:8px 15px;font-size:.98rem;font-weight:700;cursor:pointer}
.btn.main{background:var(--acc);color:#fff}
.btn:hover{filter:brightness(1.06)}
select,input[type=number]{font:inherit;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=number]{width:9em}
.inl{display:inline-flex;gap:8px;align-items:center;font-weight:600}
.tog{display:inline-flex;gap:7px;align-items:center;font-weight:600;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--acc)}
.hint{color:var(--muted);margin:0 0 12px}
.note{background:#fff7e3;border-left:5px solid var(--warn);padding:8px 12px;border-radius:8px}
.small{font-size:.86rem;color:var(--muted)}
.mut{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
/* karty łańcucha */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:8px 0 6px}
.arr{align-self:center;font-size:2rem;font-weight:800;color:var(--acc);line-height:1}
.card{--c:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;width:150px;min-height:150px;padding:12px 8px 10px;border-radius:16px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);text-align:center;font:inherit;color:var(--ink)}
button.card{cursor:pointer}
.card .em{font-size:2.6rem;line-height:1.1}
.card .nm{font-weight:700;font-size:1rem;line-height:1.2}
.card .lvp{margin-top:auto;font-size:.82rem;font-weight:800;color:#fff;background:var(--c);border-radius:999px;padding:3px 9px}
.card .tl{font-size:.75rem;color:var(--muted)}
.c1{--c:var(--l1)}.c2{--c:var(--l2)}.c3{--c:var(--l3)}.c4{--c:var(--l4)}.c5{--c:var(--l5)}.c6{--c:var(--l6)}.cd{--c:var(--ld)}.c0{--c:#7d8f87}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:10px;border:2px dashed var(--line);border-radius:16px;margin-bottom:10px}
.pool .card{min-height:120px;width:140px}
.card.ghost{border-style:dashed;border-color:var(--line);background:transparent;min-height:120px}
.card.slot{justify-content:center;border-style:dashed;border-color:var(--line);background:#f6f9f7;font-size:1.6rem;font-weight:800;color:var(--line);min-height:120px}
.card.placed{--c:var(--acc)}
.card.placed.ok{--c:var(--ok)}.card.placed.bad{--c:var(--bad)}
.card.placed.c1,.card.placed.c2,.card.placed.c3,.card.placed.c4,.card.placed.c5,.card.placed.cd{}
.fb{padding:11px 14px;border-radius:10px;margin:12px 0 0}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,#fff);border-left:5px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,#fff);border-left:5px solid var(--bad)}
.expl ul{margin:14px 0 0;padding-left:20px}
.expl li{margin:4px 0}
.also{margin-top:12px;background:var(--accs);border-radius:12px;padding:10px 14px}
.also h3{margin:0 0 4px;font-size:1rem}
.also p{margin:0}
.cch{--c:#7d8f87;display:inline-flex;gap:4px;align-items:center;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:999px;padding:2px 10px;font-weight:600;white-space:nowrap}
.car{font-weight:800;color:var(--acc);margin:0 4px}
.mini{line-height:2.2;margin:6px 0 12px}
/* sieć */
.webwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.webscroll{overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fbfdfb;max-height:78vh}
#websvg{display:block;width:100%;height:auto;min-width:760px}
.band{stroke:#e2ebe5;stroke-width:1.5;stroke-dasharray:3 6}
.bandt{font:800 22px "Bricolage Grotesque",system-ui;fill:#c5d5cb}
.bandt.dec{font-size:15px}
.e{stroke:#9aaba3;stroke-width:1.7;opacity:.75}
.e.edec{stroke-dasharray:5 5}
.e.ein{stroke:#2f8a4a;stroke-width:3.2;opacity:1}
.e.eout{stroke:#d0661f;stroke-width:3.2;opacity:1}
.e.echain{stroke:var(--acc);stroke-width:4.5;opacity:1}
.e.efade{opacity:.12}
.e.egone{opacity:.08;stroke-dasharray:3 5}
.nd{cursor:pointer}
.nd circle{fill:#fff;stroke:var(--c);stroke-width:3.5}
.nd .em{font-size:26px;text-anchor:middle;pointer-events:none}
.nd .lb{font:600 12.5px system-ui,sans-serif;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:#fbfdfb;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.nd .tlb{font:700 11px system-ui;fill:var(--muted);paint-order:stroke;stroke:#fbfdfb;stroke-width:3px}
.nd:hover circle{stroke-width:5}
.nd.sel circle{stroke-width:6;fill:color-mix(in srgb,var(--c) 18%,#fff)}
.nd.rel circle{stroke-width:5}
.nd.fade{opacity:.25}
.nd.inchain circle{stroke-width:6;fill:color-mix(in srgb,var(--c) 16%,#fff)}
.nd.rem,.nd.ext{opacity:.45}
.nd.rem circle{stroke-dasharray:4 4}
.bdg circle{stroke:#fff;stroke-width:2}
.bdg text{font:800 14px system-ui;fill:#fff;text-anchor:middle}
.bdg.rm circle{fill:#555}.bdg.ex circle{fill:#7a1d12}.bdg.up circle{fill:var(--ok)}.bdg.dn circle{fill:var(--bad)}.bdg.mx circle{fill:var(--warn)}
.bdg.ind circle{opacity:.6}
.info{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;position:sticky;top:10px}
.info h3{margin:0 0 6px}
.info p{margin:6px 0}
.ihead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.ihead h3{margin:0}.ihead p{margin:0}
.iem{font-size:2.3rem}
.tag{--c:var(--muted);display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:.8rem;border-radius:999px;padding:2px 9px}
ul.pos{margin:4px 0;padding-left:0;list-style:none}
ul.pos li{margin:6px 0}
ul.pos .ex{display:block;font-size:.86rem;color:var(--muted);margin-top:2px}
.kv{margin:8px 0}
.fxg{border-left:5px solid var(--c,#555);padding:2px 0 2px 10px;margin:10px 0}
.fxg h3{font-size:1rem;margin:0 0 4px}
.fxg ul{margin:0;padding-left:16px}
.fxg li span{display:block;font-size:.84rem;color:var(--muted)}
.fxg.rm{--c:#555}.fxg.ex{--c:#7a1d12}.fxg.dn{--c:var(--bad)}.fxg.up{--c:var(--ok)}.fxg.mx{--c:var(--warn)}
/* piramida */
.pyr{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:center}
.pfill{--c:var(--l1);justify-self:center;height:52px;border-radius:8px;background:var(--c);display:flex;align-items:center;justify-content:center;min-width:44px;transition:width .4s}
.pfill span{font-size:1.6rem}
.pfill.tox{background:#6b4fa3}
.plab{font-size:.92rem;line-height:1.35}
.pbox{background:var(--accs);border-radius:12px;padding:10px 16px;margin-top:10px}
.pbox h3{margin:10px 0 2px;font-size:1.02rem}
/* zadania */
.score{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.score span{border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;color:var(--muted);font-size:.9rem}
.score b{color:var(--ink);font-size:1.15rem;margin-left:3px}
.qcard{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;background:#fbfdfb}
.qt{margin:0 0 6px;font-weight:800;color:var(--acc);font-size:.92rem}
.ecot{display:inline-block;background:var(--accs);border-radius:999px;padding:2px 10px;font-size:.88rem;font-weight:600}
.qcard p{font-size:1.1rem;margin:8px 0}
.stmt{font-size:1.25rem!important;font-weight:600}
.qlist{margin:6px 0 10px;padding-left:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:12px 0 0}
.opt{text-align:left;font:inherit;font-size:1.02rem;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,#fff)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,#fff)}
.opt:disabled{cursor:default;color:var(--ink)}
/* teoria */
.theory{max-width:900px}
.th{margin:0 0 26px}
.th h2{font-size:1.45rem;margin:0 0 8px;font-weight:800}
.th h3{font-size:1.08rem;margin:14px 0 4px}
.th p{margin:6px 0;max-width:75ch}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.tcard{--c:var(--l1);border-top:6px solid var(--c);background:color-mix(in srgb,var(--c) 8%,#fff);border-radius:12px;padding:10px 14px}
.tcard.l2{--c:var(--l3)}.tcard.ld{--c:var(--ld)}
.tcard h3{margin:2px 0 4px}
.tcard .ex{font-style:italic;color:var(--muted);font-size:.92rem}
.tchip{--c:#7d8f87;display:inline-block;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:999px;padding:3px 11px;font-weight:600;margin:3px 0}
.tchip.l1{--c:var(--l1)}.tchip.l2{--c:var(--l2)}.tchip.l3{--c:var(--l3)}.tchip.l4{--c:var(--l4)}.tchip.ld{--c:var(--ld)}.tchip.sun{--c:#d9a400}
.tar{font-weight:800;color:var(--acc);margin:0 6px}
.tchain,.tloop{margin:10px 0;line-height:2.3}
.tnote{background:#fff7e3;border-left:5px solid var(--warn);padding:9px 13px;border-radius:8px;margin:10px 0;max-width:75ch}
.tadv{background:#eef0fa;border-left:5px solid var(--l6);padding:9px 13px;border-radius:8px;margin:12px 0;max-width:75ch}
.tadv h3{margin:0 0 4px}
.tl{padding-left:20px;max-width:75ch}
.tl li{margin:5px 0}
.tl.err li::marker{content:"✗  ";color:var(--bad);font-weight:800}
.tlev{display:flex;flex-direction:column-reverse;gap:6px;max-width:560px;margin:10px 0}
.lv{--c:var(--l1);display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;border-left:8px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:8px;padding:7px 12px}
.lv.l2{--c:var(--l2)}.lv.l3{--c:var(--l3)}.lv.l4{--c:var(--l4)}
.lv em{color:var(--muted)}
footer{margin:14px 4px 0;font-size:.85rem;color:var(--muted)}
@media (max-width:980px){.webwrap{grid-template-columns:1fr}.info{position:static}}
@media (max-width:620px){#app{padding:12px}main>section{padding:14px}.card{width:128px;min-height:132px}.card .em{font-size:2.1rem}.pbar{grid-template-columns:1fr}.plab{text-align:center}.arr{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.vchain{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:6px 0 10px}.vchain .car{margin-left:18px}
.tag.c1{--c:var(--l1)}.tag.c2{--c:var(--l2)}.tag.c3{--c:var(--l3)}.tag.c4{--c:var(--l4)}.tag.c5{--c:var(--l5)}.tag.c6{--c:var(--l6)}.tag.cd{--c:var(--ld)}
.nd .lb{font-size:13.5px}
.pfill.c1{--c:var(--l1)}.pfill.c2{--c:var(--l2)}.pfill.c3{--c:var(--l3)}.pfill.c4{--c:var(--l4)}.pfill.c5{--c:var(--l5)}.pfill.c6{--c:var(--l6)}
.cch.c1{--c:var(--l1)}.cch.c2{--c:var(--l2)}.cch.c3{--c:var(--l3)}.cch.c4{--c:var(--l4)}.cch.c5{--c:var(--l5)}.cch.c6{--c:var(--l6)}.cch.cd{--c:var(--ld)}.cch.c0{--c:#7d8f87}
[hidden]{display:none!important}
</style></head><body>

<header class="top"><div class="ttl"><svg class="logo" width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><g stroke="#1f5e4b" stroke-width="2.4" fill="none"><line x1="14" y1="46" x2="29" y2="32"/><line x1="44" y1="46" x2="29" y2="32"/><line x1="44" y1="46" x2="44" y2="30"/><line x1="29" y1="32" x2="29" y2="14"/><line x1="44" y1="30" x2="29" y2="14"/></g><circle cx="14" cy="46" r="7" fill="#3e8e41"/><circle cx="44" cy="46" r="7" fill="#3e8e41"/><circle cx="29" cy="32" r="6.5" fill="#c4930f"/><circle cx="44" cy="30" r="6.5" fill="#df7433"/><circle cx="29" cy="13" r="7" fill="#c2412d"/></svg>

function lvlName(pos,detr,L){
  if(pos===1) return detr?(L==='pl'?'martwa materia organiczna':'dead organic matter'):(L==='pl'?'producent':'producer');
  return L==='pl'?`konsument ${ROMAN[pos-1]} rzędu`:`${ORD_EN[pos-1]} consumer`;
}

pl:`
<section class="th"><h2>Kto kogo zjada</h2>
<p>Każdy organizm w ekosystemie potrzebuje energii i materii. Ze względu na to, skąd je bierze, dzielimy organizmy na trzy grupy.</p>
<div class="trio">
<div class="tcard l1"><h3>Producenci</h3><p>Samożywne organizmy, które w <b>fotosyntezie</b> wytwarzają materię organiczną z dwutlenku węgla i wody, korzystając z energii światła. To rośliny, glony i sinice.</p><p class="ex">sosna, trawy, fitoplankton</p></div>
<div class="tcard l2"><h3>Konsumenci</h3><p>Cudzożywne organizmy, które zjadają inne organizmy (albo ich części) i w ten sposób zdobywają materię i energię. To roślinożercy, drapieżniki i wszystkożercy.</p><p class="ex">sarna, sikora, wilk</p></div>
<div class="tcard ld"><h3>Destruenci</h3><p>Rozkładają martwą materię organiczną na proste związki nieorganiczne (np. sole mineralne), które znów mogą pobrać producenci. To głównie bakterie i grzyby. Nazywa się je też <b>reducentami</b>.</p><p class="ex">bakterie glebowe, grzyby</p></div>
</div></section>

<section class="th"><h2>Łańcuch pokarmowy</h2>
<p><b>Łańcuch pokarmowy</b> to szereg organizmów, w którym każdy kolejny zjada poprzedni. Pokazuje, którędy płyną materia i energia.</p>
<div class="tchain">${CH('🌲 sosna','l1')}${AR}${CH('🐛 brudnica mniszka','l2')}${AR}${CH('🐦 sikora bogatka','l3')}${AR}${CH('🦅 krogulec','l4')}</div>
<div class="tnote"><b>Strzałka pokazuje kierunek przepływu energii,</b> czyli wskazuje od zjadanego do zjadającego. „Sosna → brudnica” czytamy: brudnica zjada sosnę. Strzałka w drugą stronę to najczęstszy błąd na sprawdzianie.</div>
<p>Wyróżniamy dwa główne typy łańcuchów:</p>
<ul class="tl">
<li><b>Łańcuch spasania</b> zaczyna się od żywego producenta, którego zjadają roślinożercy. Przykład: trawy → konik polny → jaszczurka zwinka → pustułka.</li>
<li><b>Łańcuch detrytusowy</b> zaczyna się od martwej materii organicznej (opadłych liści, szczątków, odchodów), którą zjadają detrytusożercy, np. dżdżownice. Przykład: opadłe liście → dżdżownice → ryjówka → puszczyk. W lesie właśnie tędy przepływa większość energii, bo zwierzęta zjadają tylko niewielką część żywych roślin.</li>
</ul></section>

<section class="th"><h2>Poziomy troficzne</h2>
<p><b>Poziom troficzny</b> to miejsce organizmu w łańcuchu pokarmowym, czyli liczba „kroków” od producenta.</p>
<div class="tlev">
<div class="lv l1"><b>1. poziom</b><span>producenci</span><em>sosna</em></div>
<div class="lv l2"><b>2. poziom</b><span>konsumenci I rzędu</span><em>brudnica mniszka</em></div>
<div class="lv l3"><b>3. poziom</b><span>konsumenci II rzędu</span><em>sikora bogatka</em></div>
<div class="lv l4"><b>4. poziom</b><span>konsumenci III rzędu</span><em>krogulec</em></div>
</div>
<h3>Czym różnią się konsumenci I i II rzędu?</h3>
<p><b>Konsument I rzędu</b> zjada producenta. W łańcuchu spasania jest więc roślinożercą: sarna skubiąca trawę, gąsienica na igłach sosny, kryl filtrujący fitoplankton. <b>Konsument II rzędu</b> zjada konsumenta I rzędu, czyli zwykle jest drapieżnikiem albo owadożercą. <b>Konsument III rzędu</b> zjada konsumenta II rzędu i tak dalej. Konsumenta, którego w danym ekosystemie nikt już nie zjada, nazywamy <b>drapieżnikiem szczytowym</b> (np. wilk, orka).</p>
<div class="tnote"><b>Uwaga:</b> „rząd” konsumenta zależy od łańcucha, a nie od gatunku. Sikora jedząca gąsienice jest konsumentem II rzędu, ale ta sama sikora jedząca zimą nasiona sosny jest konsumentem I rzędu.</div>
</section>

<section class="th"><h2>Sieć pokarmowa</h2>
<p>W przyrodzie prawie żaden organizm nie je tylko jednego gatunku i nie jest zjadany tylko przez jeden. Łańcuchy przeplatają się więc ze sobą i tworzą <b>sieć pokarmową</b>, czyli zbiór wszystkich zależności pokarmowych w ekosystemie.</p>
<ul class="tl">
<li><b>Wszystkożercy</b> zajmują kilka poziomów troficznych naraz. Lis zjadający borówki jest konsumentem I rzędu, a zjadający nornice – II rzędu.</li>
<li><b>Im bardziej rozbudowana sieć, tym stabilniejszy ekosystem.</b> Jeśli zniknie jeden gatunek, zjadający go konsumenci mogą przerzucić się na inny pokarm.</li>
<li><b>Gatunek z jednym źródłem pokarmu jest wrażliwy.</b> Ryś zjada głównie sarny, więc ich spadek uderza w niego bardziej niż w wilka.</li>
</ul>
<div class="tadv"><h3>Dla dociekliwych: średni poziom troficzny</h3><p>Ekolodzy często podają poziom troficzny jako ułamek. Liczy się go tak: <b>1 + średnia poziomów troficznych zjadanego pokarmu</b>. Sikora jedząca po równo gąsienice (poziom 2) i nasiona sosny (poziom 1) ma poziom 1 + (2 + 1) : 2 = <b>2,5</b>. W zakładce „Sieć” narzędzie liczy go dla każdego organizmu (przy założeniu, że każdy pokarm jest zjadany w równej ilości) i według niego ustawia organizmy w pionie.</p></div>
</section>

<section class="th"><h2>Przepływ energii i zasada 10%</h2>
<p>Na każdy kolejny poziom troficzny trafia tylko część energii z poprzedniego, średnio około <b>10%</b> (w rzeczywistości zwykle od kilku do kilkunastu procent). Reszta:</p>
<ul class="tl">
<li>jest zużywana w <b>oddychaniu komórkowym</b> na procesy życiowe (ruch, utrzymanie temperatury ciała) i ostatecznie uchodzi jako <b>ciepło</b>,</li>
<li>pozostaje w <b>niezjedzonych częściach</b> (korzenie, kości, sierść),</li>
<li>trafia do <b>odchodów</b>, a stamtąd do destruentów.</li>
</ul>
<p>Dlatego łańcuchy pokarmowe są krótkie, zwykle mają 3–5 ogniw: na wyższe poziomy po prostu nie starczy energii. Dlatego też drapieżników szczytowych jest zawsze mniej niż roślinożerców.</p>
<h3>Piramidy ekologiczne</h3>
<ul class="tl">
<li><b>Piramida energii</b> pokazuje, ile energii jest na każdym poziomie. Zawsze zwęża się ku górze.</li>
<li><b>Piramida biomasy</b> pokazuje masę organizmów na każdym poziomie. Zwykle też zwęża się ku górze.</li>
<li><b>Piramida liczebności</b> pokazuje liczbę osobników. Może być odwrócona: jeden dąb wykarmi tysiące gąsienic.</li>
</ul></section>

<section class="th"><h2>Materia krąży, energia przepływa</h2>
<p>Materia (np. pierwiastki węgiel i azot) krąży w ekosystemie: producenci budują z niej związki organiczne, konsumenci je zjadają, a destruenci rozkładają szczątki na związki nieorganiczne, które znów pobierają producenci. <b>Energia krąży tylko w jedną stronę:</b> wchodzi do ekosystemu jako światło, a opuszcza go jako ciepło. Ekosystem potrzebuje więc stałego dopływu energii ze Słońca.</p>
<div class="tloop">${CH('☀️ światło','sun')}${AR}${CH('🌿 producenci','l1')}${AR}${CH('🦌 konsumenci','l2')}${AR}${CH('🍂 szczątki','ld')}${AR}${CH('🍄 destruenci','ld')}${AR}${CH('🧂 sole mineralne','ld')}<span class="tar">↩</span>${CH('🌿 producenci','l1')}</div>
</section>

<section class="th"><h2>Kumulacja toksyn w łańcuchu</h2>
<p>Niektóre trwałe substancje, np. rtęć czy insektycyd DDT, nie są rozkładane ani wydalane, tylko gromadzą się w tkankach. Każdy drapieżnik zjada w ciągu życia ogromną liczbę ofiar, więc ich stężenie rośnie z każdym poziomem troficznym. To zjawisko nazywa się <b>biomagnifikacją</b>. W XX wieku DDT tak bardzo osłabiło skorupki jaj bielików i sokołów wędrownych, że ich liczebność gwałtownie spadła. Po zakazie DDT populacje się odbudowały.</p></section>

<section class="th"><h2>Kaskada troficzna</h2>
<p>Zmiana na jednym poziomie przenosi się na kolejne. Klasyczny przykład to Park Yellowstone w USA: po powrocie wilków w 1995 roku zmniejszyła się liczebność jeleni wapiti i zmieniło się ich zachowanie, a w niektórych miejscach odrosły wierzby i osiki. Badacze wciąż dyskutują, jak silny był ten efekt, ale mechanizm jest ten sam co w zakładce „Co jeśli?”: <b>mniej drapieżników → więcej roślinożerców → mniej roślin</b>.</p></section>

<section class="th"><h2>Typowe błędy</h2>
<ul class="tl err">
<li><b>Strzałka od zjadającego do zjadanego.</b> Poprawnie: od pokarmu do tego, kto go zjada.</li>
<li><b>„Producent to roślina”.</b> Producentami są też glony i sinice. W morzach i jeziorach to właśnie fitoplankton jest najważniejszym producentem.</li>
<li><b>„Konsument I rzędu to małe zwierzę, a III rzędu duże”.</b> Rząd zależy od tego, co organizm je, a nie od jego wielkości. Płetwal błękitny jedzący kryl jest konsumentem II rzędu.</li>
<li><b>„Destruenci to ostatnie ogniwo łańcucha”.</b> Destruenci rozkładają szczątki organizmów ze wszystkich poziomów, a nie tylko drapieżnika na końcu.</li>
<li><b>„Każdy gatunek ma jeden poziom troficzny”.</b> Wszystkożercy mogą zajmować kilka poziomów, zależnie od tego, co akurat jedzą.</li>
</ul></section>`,
en:`
<section class="th"><h2>Who eats whom</h2>
<p>Every organism in an ecosystem needs energy and matter. Depending on where they get them from, we divide organisms into three groups.</p>
<div class="trio">
<div class="tcard l1"><h3>Producers</h3><p>Autotrophs that make organic matter from carbon dioxide and water in <b>photosynthesis</b>, using light energy. These are plants, algae and cyanobacteria.</p><p class="ex">pine, grasses, phytoplankton</p></div>
<div class="tcard l2"><h3>Consumers</h3><p>Heterotrophs that eat other organisms (or parts of them) to get matter and energy. They include herbivores, carnivores and omnivores.</p><p class="ex">roe deer, great tit, wolf</p></div>
<div class="tcard ld"><h3>Decomposers</h3><p>They break dead organic matter down into simple inorganic substances (e.g. mineral salts), which producers can take up again. Mostly bacteria and fungi.</p><p class="ex">soil bacteria, fungi</p></div>
</div></section>

<section class="th"><h2>Food chain</h2>
<p>A <b>food chain</b> is a sequence of organisms in which each one eats the one before it. It shows the path that matter and energy take.</p>
<div class="tchain">${CH('🌲 Scots pine','l1')}${AR}${CH('🐛 nun moth','l2')}${AR}${CH('🐦 great tit','l3')}${AR}${CH('🦅 sparrowhawk','l4')}</div>
<div class="tnote"><b>The arrow shows the direction of energy flow,</b> so it points from the eaten to the eater. “Pine → nun moth” means: the nun moth eats the pine. Drawing the arrow the other way is the most common test mistake.</div>
<p>There are two main types of food chain:</p>
<ul class="tl">
<li><b>A grazing food chain</b> starts with a living producer eaten by herbivores. Example: grasses → grasshopper → sand lizard → kestrel.</li>
<li><b>A detrital food chain</b> starts with dead organic matter (fallen leaves, remains, dung) eaten by detritivores such as earthworms. Example: fallen leaves → earthworms → shrew → tawny owl. In a forest most energy actually flows this way, because animals eat only a small part of the living plants.</li>
</ul></section>

<section class="th"><h2>Trophic levels</h2>
<p>A <b>trophic level</b> is an organism’s position in a food chain, i.e. the number of “steps” from the producer.</p>
<div class="tlev">
<div class="lv l1"><b>Level 1</b><span>producers</span><em>Scots pine</em></div>
<div class="lv l2"><b>Level 2</b><span>primary consumers</span><em>nun moth</em></div>
<div class="lv l3"><b>Level 3</b><span>secondary consumers</span><em>great tit</em></div>
<div class="lv l4"><b>Level 4</b><span>tertiary consumers</span><em>sparrowhawk</em></div>
</div>
<h3>Primary vs secondary consumers</h3>
<p>A <b>primary consumer</b> eats a producer, so in a grazing chain it is a herbivore: a deer grazing on grass, a caterpillar on pine needles, krill filtering phytoplankton. A <b>secondary consumer</b> eats a primary consumer, so it is usually a carnivore or an insectivore. A <b>tertiary consumer</b> eats a secondary consumer, and so on. A consumer that nothing else eats in the ecosystem is called an <b>apex predator</b> (e.g. wolf, orca).</p>
<div class="tnote"><b>Careful:</b> the consumer’s level depends on the chain, not on the species. A great tit eating caterpillars is a secondary consumer, but the same tit eating pine seeds in winter is a primary consumer.</div>
</section>

<section class="th"><h2>Food web</h2>
<p>In nature almost no organism eats just one species or is eaten by just one. Food chains therefore interconnect to form a <b>food web</b>: all the feeding relationships in an ecosystem.</p>
<ul class="tl">
<li><b>Omnivores</b> occupy several trophic levels at once. A fox eating bilberries is a primary consumer; a fox eating voles is a secondary consumer.</li>
<li><b>The more complex the web, the more stable the ecosystem.</b> If one species disappears, its consumers can switch to other food.</li>
<li><b>A species with a single food source is vulnerable.</b> The lynx eats mainly roe deer, so a drop in deer numbers hits it harder than the wolf.</li>
</ul>
<div class="tadv"><h3>Going further: average trophic level</h3><p>Ecologists often give trophic levels as fractions: <b>1 + the average trophic level of the food eaten</b>. A great tit eating equal amounts of caterpillars (level 2) and pine seeds (level 1) has a level of 1 + (2 + 1) ÷ 2 = <b>2.5</b>. In the “Web” tab the tool works this out for every organism (assuming each food item is eaten in equal amounts) and uses it to place organisms vertically.</p></div>
</section>

<section class="th"><h2>Energy flow and the 10% rule</h2>
<p>Only part of the energy passes from one trophic level to the next, on average about <b>10%</b> (in reality usually from a few to over a dozen per cent). The rest:</p>
<ul class="tl">
<li>is used in <b>cellular respiration</b> for life processes (movement, keeping warm) and finally escapes as <b>heat</b>,</li>
<li>stays in <b>uneaten parts</b> (roots, bones, fur),</li>
<li>ends up in <b>faeces</b>, and from there goes to decomposers.</li>
</ul>
<p>That is why food chains are short, usually 3–5 links: there is not enough energy left for higher levels. It is also why there are always fewer apex predators than herbivores.</p>
<h3>Ecological pyramids</h3>
<ul class="tl">
<li><b>A pyramid of energy</b> shows the energy at each level. It always narrows towards the top.</li>
<li><b>A pyramid of biomass</b> shows the mass of organisms at each level. It usually narrows towards the top too.</li>
<li><b>A pyramid of numbers</b> shows the number of individuals. It can be upside down: one oak can feed thousands of caterpillars.</li>
</ul></section>

<section class="th"><h2>Matter cycles, energy flows</h2>
<p>Matter (e.g. the elements carbon and nitrogen) cycles in an ecosystem: producers build organic compounds from it, consumers eat them, and decomposers break remains down into inorganic substances that producers take up again. <b>Energy flows only one way:</b> it enters the ecosystem as light and leaves as heat, so an ecosystem needs a constant supply of energy from the Sun.</p>
<div class="tloop">${CH('☀️ light','sun')}${AR}${CH('🌿 producers','l1')}${AR}${CH('🦌 consumers','l2')}${AR}${CH('🍂 remains','ld')}${AR}${CH('🍄 decomposers','ld')}${AR}${CH('🧂 mineral salts','ld')}<span class="tar">↩</span>${CH('🌿 producers','l1')}</div>
</section>

<section class="th"><h2>Toxins building up in a chain</h2>
<p>Some persistent substances, such as mercury or the insecticide DDT, are neither broken down nor excreted; they build up in body tissues. Every predator eats a huge number of prey in its lifetime, so the concentration rises at each trophic level. This is called <b>biomagnification</b>. In the 20th century DDT thinned the eggshells of white-tailed eagles and peregrine falcons so much that their numbers crashed. After DDT was banned, the populations recovered.</p></section>

<section class="th"><h2>Trophic cascade</h2>
<p>A change at one level spreads to the others. The classic example is Yellowstone National Park in the USA: after wolves returned in 1995, elk numbers fell and their behaviour changed, and in some places willows and aspens grew back. Scientists still debate how strong this effect was, but the mechanism is the same as in the “What if?” mode: <b>fewer predators → more herbivores → fewer plants</b>.</p></section>

<section class="th"><h2>Common mistakes</h2>
<ul class="tl err">
<li><b>Arrow from the eater to the eaten.</b> Correct: from the food to whoever eats it.</li>
<li><b>“A producer is a plant.”</b> Algae and cyanobacteria are producers too. In seas and lakes phytoplankton is the most important producer.</li>
<li><b>“Primary consumers are small, tertiary ones are big.”</b> The level depends on what an organism eats, not on its size. A blue whale eating krill is a secondary consumer.</li>
<li><b>“Decomposers are the last link of the chain.”</b> Decomposers break down remains from every level, not just the predator at the end.</li>
<li><b>“Each species has one trophic level.”</b> Omnivores can occupy several levels, depending on what they are eating.</li>
</ul></section>`};

const fmt=(x,d=2)=>new Intl.NumberFormat(L==='pl'?'pl-PL':'en-GB',{maximumFractionDigits:d}).format(x).replace(/\u00a0|\u202f/g,' ');

const CS={type:'g',len:'any',chain:null,eco:null,prac:false,placed:[],pool:[],res:null};
function genChain(){
  const g=build(ECO);let note='';let type=CS.type;
  let pool=(type==='d'?g.PD:g.PG).filter(p=>p.length>=3);
  if(type==='d'&&!pool.length){type='g';note=t('noDetr');pool=g.PG.filter(p=>p.length>=3);}
  let want=CS.len==='any'?null:+CS.len;
  let cand=want?pool.filter(p=>p.length===want):pool.filter(p=>g.isApex(p[p.length-1]));
  if(!cand.length&&want){const lens=[...new Set(pool.map(p=>p.length))].sort((a,b)=>Math.abs(a-want)-Math.abs(b-want));cand=pool.filter(p=>p.length===lens[0]);note=(note?note+' ':'')+t('noLen')(lens[0]);}
  if(!cand.length)cand=pool;
  let c=rnd(cand); if(CS.chain&&cand.length>1){let k=0;while(c.join()===CS.chain.join()&&k++<10)c=rnd(cand);}
  CS.chain=c;CS.eco=ECO;CS.note=note;CS.placed=[];CS.pool=shuffle(c);CS.res=null;
  if(CS.pool.join()===c.join()&&c.length>1)CS.pool=CS.pool.reverse();
}

const W={sel:null,whatIf:false,removed:new Set(),det:store.get('det',false),tl:store.get('tl',true),chain:null,chainEco:null};
const COL=['','var(--l1)','var(--l2)','var(--l3)','var(--l4)','var(--l5)','var(--l6)'];
function visible(g){return g.nodes.filter(n=>W.det||g.fromP.has(n.id));}
function layout(g,vis){
  const ids=new Set(vis.map(n=>n.id));
  const rowsM={};vis.forEach(n=>{const k=n.t==='R'?0:Math.round(g.TL[n.id]*2)/2;(rowsM[k]=rowsM[k]||[]).push(n.id);});
  const keys=Object.keys(rowsM).map(Number).sort((a,b)=>a-b);
  // X na końcu pierwszego rzędu
  if(rowsM[1])rowsM[1].sort((a,b)=>(g.by[a].t==='X')-(g.by[b].t==='X'));
  const maxN=Math.max(...keys.map(k=>rowsM[k].length));
  const Wd=Math.max(920,maxN*128+60),sp=k=>Math.min(150,(Wd-60)/rowsM[k].length);
  const X={};const place=()=>keys.forEach(k=>{const r=rowsM[k],s=sp(k);r.forEach((id,i)=>X[id]=Wd/2+(i-(r.length-1)/2)*s);});
  place();
  const bary=(id,list)=>{const v=list.filter(x=>ids.has(x)&&X[x]!=null);return v.length?v.reduce((a,x)=>a+X[x],0)/v.length:X[id];};
  for(let it=0;it<6;it++){
    keys.filter(k=>k>1).forEach(k=>{rowsM[k].sort((a,b)=>bary(a,g.by[a].food)-bary(b,g.by[b].food));place();});
    keys.slice().reverse().filter(k=>k>=1).forEach(k=>{if(k===1)rowsM[1].sort((a,b)=>(g.by[a].t==='X')-(g.by[b].t==='X')||bary(a,g.by[a].eaters)-bary(b,g.by[b].eaters));else rowsM[k].sort((a,b)=>bary(a,g.by[a].eaters)-bary(b,g.by[b].eaters));place();});
  }
  const top=Math.max(...keys),unit=Math.max(150,Math.min(230,600/Math.max(1,top-1))),pad=70;
  const ymain=k=>pad+(top-k)*unit;
  const hasR=keys.includes(0);
  const H=ymain(1)+ (hasR?160:0)+70;
  const Y={};keys.forEach(k=>rowsM[k].forEach(id=>Y[id]=k===0?ymain(1)+160:ymain(k)));
  return {X,Y,Wd,H,keys,ymain,top};
}
function effects(g,vis){
  const ids=new Set(vis.map(n=>n.id));const gone=new Set(W.removed);const ext=new Set();
  let ch=true;while(ch){ch=false;vis.forEach(n=>{if(n.t!=='C'&&n.t!=='R')return;if(gone.has(n.id))return;const f=n.food.filter(x=>ids.has(x));if(f.length&&f.every(x=>gone.has(x))){gone.add(n.id);ext.add(n.id);ch=true;}});}
  const eff={};
  vis.forEach(n=>{if(gone.has(n.id))return;const up=[],dn=[];
    n.food.filter(x=>ids.has(x)&&gone.has(x)).forEach(x=>dn.push(['lostFood',nm(g,x)]));
    n.eaters.filter(x=>ids.has(x)&&gone.has(x)).forEach(x=>up.push(['lostPred',nm(g,x)]));
    if(up.length||dn.length)eff[n.id]={up,dn,ind:false};});
  const dir=Object.keys(eff).map(id=>[id,eff[id].up.length&&!eff[id].dn.length?1:eff[id].dn.length&&!eff[id].up.length?-1:0]);
  const ind={};const add=(id,s,why)=>{if(gone.has(id)||eff[id])return;(ind[id]=ind[id]||{up:[],dn:[],ind:true})[s>0?'up':'dn'].push(why);};
  dir.forEach(([id,s])=>{if(!s)return;const n=g.by[id];
    if(n.t==='C')n.food.filter(x=>ids.has(x)).forEach(x=>add(x,-s,[s>0?'moreEaters':'fewerEaters',nm(g,id)]));
    n.eaters.filter(x=>ids.has(x)).forEach(x=>add(x,s,[s>0?'moreFood':'lessFood',nm(g,id)]));});
  Object.assign(eff,ind);
  return {gone,ext,eff};
}

        badge=`<g class="bdg ${s}${e.ind?' ind':''}"><circle cx="${R-2}" cy="${-R+2}" r="11"/><text x="${R-2}" y="${-R+7}">${s==='up'?'↑':s==='dn'?'↓':'?'}</text></g>`;}}

const PY={chain:null,eco:null,E:100000,eff:10,mode:'e',note:''};

  h+=`<div class="row"><button class="btn ${QZ.ans!=null?'main':''}" id="qnext">${t('qNext')} →</button></div></div>`;
  $('#p-zadania').innerHTML=h;
}

// ---------- zdarzenia ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-node],[data-bg]');if(!b)return;
  if(b.dataset.lang){L=b.dataset.lang;store.set('lang',L);render();return;}
  if(b.dataset.tab){TAB=b.dataset.tab;render();return;}
  if(b.dataset.eco){ECO=b.dataset.eco;store.set('eco',ECO);W.sel=null;W.removed.clear();render();return;}
  // łańcuch
  if(b.dataset.ctype){CS.type=b.dataset.ctype;genChain();rChain();return;}
  if(b.id==='cnew'){genChain();rChain();return;}
  if(b.dataset.cmode){CS.prac=b.dataset.cmode==='prac';CS.placed=[];CS.res=null;rChain();return;}
  if(b.dataset.pick){if(CS.placed.length<CS.chain.length)CS.placed.push(b.dataset.pick);CS.res=null;rChain();return;}
  if(b.dataset.unpick!=null&&CS.res!=='ok'){CS.placed.splice(+b.dataset.unpick,1);CS.res=null;rChain();return;}
  if(b.id==='pchk'){if(CS.placed.length<CS.chain.length)CS.res='fill';else{const g=build(ECO);CS.okIdx=CS.placed.map((x,i)=>i===0?(g.by[x].t==='P'||g.by[x].t==='X'):g.by[x].food.includes(CS.placed[i-1]));CS.res=CS.okIdx.every(Boolean)?'ok':'bad';if(CS.res==='ok')CS.chain=CS.placed.slice();}rChain();return;}
  if(b.id==='pclr'){CS.placed=[];CS.res=null;rChain();return;}
  if(b.id==='toweb'){W.chain=CS.chain;W.chainEco=ECO;W.sel=null;W.whatIf=false;W.removed.clear();TAB='siec';render();window.scrollTo&&$('#tabs').scrollIntoView({block:'start'});return;}
  // sieć
  if(b.dataset.node){const id=b.dataset.node;
    if(W.whatIf){W.removed.has(id)?W.removed.delete(id):W.removed.add(id);}else W.sel=W.sel===id?null:id;rWeb();return;}
  if(b.dataset.bg){if(W.sel){W.sel=null;rWeb();}return;}
  if(b.id==='wwhat'){W.whatIf=!W.whatIf;W.sel=null;if(!W.whatIf)W.removed.clear();rWeb();return;}
  if(b.id==='wrest'){W.removed.clear();rWeb();return;}
  if(b.id==='whide'){W.chain=null;rWeb();return;}
  // piramida
  if(b.dataset.pmode){PY.mode=b.dataset.pmode;rPyr();return;}
  if(b.id==='pnew'){pyrChain(false);rPyr();return;}
  if(b.id==='ptake'){pyrChain(true);rPyr();return;}
  // zadania
  if(b.dataset.opt!=null&&QZ.ans==null){QZ.ans=+b.dataset.opt;QZ.all++;if(QZ.q.o[QZ.ans].ok){QZ.ok++;QZ.streak++;}else QZ.streak=0;rQuiz();return;}
  if(b.id==='qnext'){newQ();rQuiz();return;}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.node){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='clen'){CS.len=el.value;genChain();rChain();}
  if(el.id==='wdet'){W.det=el.checked;store.set('det',W.det);if(!W.det&&W.chain&&W.chain.some(x=>!build(ECO).fromP.has(x)))W.chain=null;rWeb();}
  if(el.id==='wtl'){W.tl=el.checked;store.set('tl',W.tl);rWeb();}
  if(el.id==='pE'){const v=Math.max(1,Math.round(+el.value||0));PY.E=v;rPyr();}
  if(el.id==='pEff'){PY.eff=+el.value;rPyr();}
  if(el.id==='qtype'){QZ.type=el.value;store.set('qtype',QZ.type);newQ();rQuiz();}
  if(el.id==='qmix'){QZ.mix=el.checked;store.set('qmix',QZ.mix);newQ();rQuiz();}
});
window.__fw={build,QG,newQ,QZ,CS,W,ECOS,setEco:k=>{ECO=k;render();},setTab:k=>{TAB=k;render();}};
render();
})();

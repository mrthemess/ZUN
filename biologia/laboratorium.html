function focusKey(el){if(!el||el===document.body)return null;if(el.id)return '#'+CSS.escape(el.id);
  const a=[...el.attributes].filter(x=>x.name.startsWith('data-')).map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join('');if(!a)return null;
  return el.tagName.toLowerCase()+a;}
function render(keep=true){
  const fk=keep?focusKey(document.activeElement):null;
  const sl=$$('#app .tablewrap').map(e=>e.scrollLeft);
  document.documentElement.lang=L;document.title=T(GEN?UI.gt1:UI.t1);
  $('#t1').textContent=T(GEN?UI.gt1:UI.t1);$('#t2').textContent=T(GEN?UI.gt2:UI.t2);
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
  $('#tabs').innerHTML=Object.entries(UI.tabs).filter(([k])=>GEN===(k==='sheet')).map(([k,v])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(T(v))}</button>`).join('');
  $('#app').innerHTML={exp:viewExp,err:viewErr,theory:viewTheory,quiz:viewQuiz,sheet:viewSheet}[S.tab]();
  $$('#app .tablewrap').forEach((e,i)=>{if(sl[i])e.scrollLeft=sl[i];});
  if(fk){const el=$(fk);if(el&&el!==document.activeElement&&!el.disabled)try{el.focus({preventScroll:true});}catch(_){}}
}
function act(b){
  const d=b.dataset;let after=null;
  if(d.lang){L=d.lang;try{localStorage.setItem('labLang',L);}catch(_){}}
  else if(d.tab)S.tab=d.tab;
  else if(d.lvl){if(S.lvl!==d.lvl){S.lvl=d.lvl;if(S.q&&QZ[S.q.i].lv==='A'&&d.lvl==='B')S.q=null;}}
  else if(d.ex){if(S.run)return;S.ex=d.ex;S.pngSt='';}
  else if(d.inv){if(S.run)return;S.inv[S.ex]=d.inv;S.pngSt='';}
  else if(d.mat){if(S.run)return;S.mat=d.mat;S.pngSt='';}
  else if(d.xcat){if(S.run)return;S.x[KEY()]=d.xcat;}
  else if(d.con!==undefined){const dd=D(),i=+d.con;if(!dd.tried.includes(i)&&!dd.tried.includes(0))dd.tried.push(i);after='.cons button:not(:disabled), .fb';}
  else if(d.act==='run'||d.act==='ctrl'){runTrial(d.act==='ctrl',+d.n);return;}
  else if(d.act==='clear'){if(!confirm(tr('Usunąć wszystkie wyniki tego doświadczenia?','Delete all the results of this experiment?')))return;const k=KEY();delete S.data[k];if(S.last&&S.last.k===k)S.last=null;}
  else if(d.act==='png'){pngClick();return;}
  else if(d.act==='cyPng'){cyPngClick();return;}
  else if(d.act==='docx'){docxClick();return;}
  else if(d.act==='wsNew'){S.ws.seed=1+Math.floor(Math.random()*99999);S.wsSt='';}
  else if(d.act==='atomChk'){const id=S.atom.eq,q=EQ[id],v=S.atom.v[id]||{},res={};for(const sd of ['L','R'])for(const el of ELS){const k=sd+'.'+el;res[k]=String(v[k]??'').trim()!==''&&+v[k]===sideCount(q[sd],el);}S.atom.res[id]=res;}
  else if(d.act==='atomShow'){const id=S.atom.eq;S.atom.show[id]=!S.atom.show[id];}
  else if(d.eq)S.atom.eq=d.eq;
  else if(d.fam)S.lf.fam=d.fam;
  else if(d.ans!==undefined){if(S.q&&S.q.picked===null){S.q.picked=+d.ans;S.all++;if(+d.ans===0)S.ok++;}after='#nextQ';}
  else if(b.id==='nextQ'){newQ();after='.opts button';}
  else if(d.errans){const E=S.err;if(E.pick===null){E.pick=d.errans;E.all++;if(d.errans===ERR[E.ord[E.i]].a)E.ok++;}after='#nextE';}
  else if(b.id==='nextE'){S.err.i++;newErr();after='.opts button';}
  else if(d.wsinv){S.ws.inv=d.wsinv;S.wsSt='';}
  else if(d.wsdata){S.ws.data=d.wsdata;S.wsSt='';}
  else return;
  render();
  if(after){const el=$(after);if(el)el.focus({preventScroll:true});}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lang],[data-tab],[data-lvl],[data-ex],[data-inv],[data-mat],[data-xcat],[data-con],[data-act],[data-eq],[data-fam],[data-ans],#nextQ,[data-errans],#nextE,[data-wsinv],[data-wsdata]');
  if(!b||b.disabled)return;
  if(b.matches('.sheet *'))return;
  act(b);
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.hyp!==undefined){const d=D();if(!d.t.length){d.hyp=+t.dataset.hyp;render();}}
  else if(t.dataset.wsopt){S.ws[t.dataset.wsopt]=t.checked;S.wsSt='';render();}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='xr'){if(S.run)return;const P=curP();S.x[KEY()]=+t.value;const s=fmtV(P,P.vals[+t.value]);t.setAttribute('aria-valuetext',s);$('#xv').textContent=s;$('#appar').innerHTML=idleApp();}
  else if(t.id==='lfI'){S.lf.I=+t.value;t.setAttribute('aria-valuetext',S.lf.I+'%');$('#lfV').textContent=S.lf.I+'%';$('#lfBox').innerHTML=lfSVG();$('#lfR').innerHTML=lfRead();}
  else if(t.dataset.atom){const id=S.atom.eq;(S.atom.v[id]||(S.atom.v[id]={}))[t.dataset.atom]=t.value;if(S.atom.res[id]){S.atom.res[id]=null;$$('[data-atom]').forEach(i=>i.classList.remove('ok','no'));const f=$('#app .eqbox ~ .fb, #app table.atoms ~ .fb');$$('#app .fb').forEach(x=>x.remove());}}});

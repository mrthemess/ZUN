<style>
:root{--bg:#eef0f5;--paper:#fcfcfe;--ink:#161a26;--muted:#5a6072;--line:#d3d7e2;--soft:#e5e8f1;--acc:#2b4fa3;--acc-t:#2b4fa3;--acc-ink:#fff;--sun:#f2b632;--night:#1b2440;--ok:#2e7d4f;--no:#b4432a;--focus:#c2571a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--paper:#171b26;--ink:#e4e7f0;--muted:#9aa1b5;--line:#2b3142;--soft:#1f2432;--acc:#5a82d8;--acc-t:#9db8f0;--acc-ink:#0c1222;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131b;--paper:#171b26;--ink:#e4e7f0;--muted:#9aa1b5;--line:#2b3142;--soft:#1f2432;--acc:#5a82d8;--acc-t:#9db8f0;--acc-ink:#0c1222;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.015em;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 70px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800}header p{margin:2px 0 0;color:var(--muted)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.9rem;border:0;background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 15px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-size:.95rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn[aria-pressed=true]{border-color:var(--acc);background:var(--soft);color:var(--acc-t);font-weight:700}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
input[type=range]{accent-color:var(--acc);padding:0;border:0;background:none}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.card svg,.card canvas{max-width:100%;height:auto;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:10px 0}
.ctrl label{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}
.facts div{background:var(--soft);border-radius:12px;padding:9px 12px;font-size:.88rem;color:var(--muted)}
.facts b{display:block;color:var(--ink);font:800 1.3rem 'Bricolage Grotesque',sans-serif}
ul.pts{margin:6px 0 0;padding-left:20px}ul.pts li{margin:5px 0}
.note{font-size:.88rem;color:var(--muted)}
h2.sec{font-size:1.45rem;margin:24px 0 4px}
.lead{max-width:72ch;margin:0 0 6px}
.sugg{position:absolute;left:0;top:calc(100% + 4px);z-index:30;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:280px;max-height:320px;overflow:auto;padding:4px}
.sugg button{display:block;width:100%;text-align:left;font:inherit;font-size:.95rem;border:0;background:none;color:var(--ink);padding:7px 10px;border-radius:7px;cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--soft);outline:none}.sugg small{color:var(--muted)}
/* praktyka */
.score{display:flex;flex-wrap:wrap;gap:8px}
.score span{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.9rem;color:var(--muted)}
.score b{color:var(--ink);font:800 1.2rem 'Bricolage Grotesque',sans-serif;margin-left:4px}
.task{font-size:1.18rem;margin:0 0 6px}
.pstep{border:2px solid var(--line);border-radius:14px;padding:13px 15px;margin:12px 0 0;background:var(--paper)}
.pstep.locked{opacity:.45}.pstep.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--paper))}.pstep.shown{border-color:var(--focus)}
.pstep h3{margin:0 0 6px;font-size:1.02rem;display:flex;gap:10px;align-items:center}
.pstep h3 .n{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:inline-grid;place-items:center;font-size:.9rem}
.pstep.done h3 .n{background:var(--ok)}
.arow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arow input{width:6em;font-size:1.25rem}
.arow .u{font:800 1.3rem 'Bricolage Grotesque',sans-serif}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:10px}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--paper))}.fb.bad{background:color-mix(in srgb,var(--focus) 15%,var(--paper))}.fb.sol{background:var(--soft);border-left:5px solid var(--focus)}
.final{margin:16px 0 0;padding:14px 16px;border-radius:14px;background:var(--soft);border-left:6px solid var(--ok)}
.final .big{font:800 1.8rem 'Bricolage Grotesque',sans-serif}
@media (max-width:860px){.two{grid-template-columns:1fr}.hr{align-items:flex-start}}
</style>

 if(h<=0)return s+`<text x="${W/2}" y="70" text-anchor="middle" font-size="15" fill="currentColor">${tr('Słońce pod horyzontem','Sun below the horizon')}</text></svg>`;
 const t=h*D2R,L0=150;for(let k=-2;k<=2;k++){const x0=170+k*30/Math.max(Math.sin(t),.25);s+=`<line x1="${x0-Math.cos(t)*L0}" y1="${118-Math.sin(t)*L0}" x2="${x0}" y2="117" stroke="#f2b632" stroke-width="3"/>`;}
 s+=`<path d="M${170-46} 118 A46 46 0 0 1 ${170-46*Math.cos(t)} ${118-46*Math.sin(t)}" fill="none" stroke="#c2571a" stroke-width="2.4"/><text x="${170-54-(h<30?10:0)}" y="${110-(h<20?0:8)}" text-anchor="end" font-size="16" font-weight="700" fill="#c2571a">${dm(h)}</text></svg>`;return s;}
// ---------- wykres długości dnia ----------
function dayChart(fs){const W=640,H=230,Lm=44,Rm=12,T=12,B=30;const X=n=>Lm+(n-1)/364*(W-Lm-Rm),Y=h=>T+(24-h)/24*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;[0,6,12,18,24].forEach(h=>s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${Y(h)}" y2="${Y(h)}" stroke="currentColor" stroke-opacity=".15"/><text x="${Lm-6}" y="${Y(h)+4}" text-anchor="end" font-size="12" fill="currentColor">${h} h</text>`);
 ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'].forEach((m,i)=>s+=`<text x="${X(doy(i+1,15))}" y="${H-10}" text-anchor="middle" font-size="12" fill="currentColor">${m}</text>`);
 PRE.forEach(p=>s+=`<line x1="${X(p[0])}" x2="${X(p[0])}" y1="${T}" y2="${H-B}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3"/>`);
 fs.forEach(([f,col])=>{let d='';for(let n=1;n<=365;n+=2)d+=(n===1?'M':'L')+X(n).toFixed(1)+' '+Y(dayLen(f,decl(n))).toFixed(1);s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6"/>`;});
 s+=`<line x1="${X(S.day)}" x2="${X(S.day)}" y1="${T}" y2="${H-B}" stroke="#c2571a" stroke-width="2"/></svg>`;return s;}
// ---------- wyszukiwarka miejsc (lista + internet) ----------
const normT=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
function parseLatTxt(t){const m=String(t).trim().replace(',','.').match(/^(-?\d+(?:\.\d+)?)\s*°?\s*(?:(\d+(?:\.\d+)?)\s*['′])?\s*([NSns])?$/);if(!m)return null;let v=parseFloat(m[1])+(m[2]?parseFloat(m[2])/60:0);if(m[3]&&/s/i.test(m[3]))v=-Math.abs(v);if(Math.abs(v)>90)return null;return v;}
const placeBox=(id,ph)=>`<span class="combo" style="position:relative;display:inline-block"><input id="${id}" class="pinp" placeholder="${esc(ph)}" autocomplete="off" style="width:17em"><span class="sugg" id="${id}-s" hidden></span></span>`;
let geoT=0;
function suggest(inp){const id=inp.id,q=inp.value.trim();const box=document.getElementById(id+'-s');if(!q){box.hidden=true;return;}
 const items=[];const lv=parseLatTxt(q);if(lv!=null)items.push({n:lat(lv),f:lv,sub:tr('szerokość geograficzna','latitude')});
 ALLC.filter(c=>normT(nm(c[0])+' '+c[0]).includes(normT(q))).slice(0,6).forEach(c=>items.push({n:nm(c[0]),f:c[1],sub:lat(c[1])}));
 const draw=(extra,msg)=>{const all=items.concat(extra||[]);box.innerHTML=(all.length?all.map((x,i)=>`<button type="button" data-geo="${id}" data-i="${i}">${esc(x.n)} <small>${esc(x.sub||'')}</small></button>`).join(''):'')+(msg?`<span class="note" style="display:block;padding:6px 10px">${msg}</span>`:'');box._items=all;box.hidden=!all.length&&!msg;};
 draw(null,q.length>=3?tr('Szukam w internecie…','Searching online…'):'');clearTimeout(geoT);if(q.length<3||lv!=null)return draw();
 geoT=setTimeout(async()=>{try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${L}&format=json`);const j=await r.json();
  if(inp.value.trim()!==q)return;const ex=(j.results||[]).map(x=>({n:x.name+(x.country?', '+x.country:''),f:x.latitude,sub:[x.admin1,lat(x.latitude)].filter(Boolean).join(' · ')}));draw(ex,ex.length?'':tr('Nie udało się znaleźć takiego miejsca. Możesz wpisać szerokość, np. 45°30′N.','No such place found. You can type a latitude, e.g. 45°30′N.'));}
  catch(e){draw(null,tr('Brak połączenia z wyszukiwarką miejsc – wybierz miasto z listy albo wpisz szerokość, np. 45°30′N.','Place search is offline – pick a city from the list or type a latitude, e.g. 45°30′N.'));}},350);}
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('pinp'))suggest(e.target);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('pinp')){const b=document.querySelector('#'+e.target.id+'-s [data-geo]');if(b){e.preventDefault();b.click();}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-geo]');if(b){const box=b.parentElement,x=box._items[+b.dataset.i];if(b.dataset.geo==='geoc')S.cmp={n:x.n,f:x.f};else{S.city='__geo';S.geo={n:x.n,f:x.f};}render();return;}if(!e.target.closest('.combo'))document.querySelectorAll('.sugg').forEach(s=>s.hidden=true);});
// ---------- zakładka: kalkulator + sklepienie ----------
function citySel(id,val,empty){return `<select id="${id}">${empty?`<option value="">${tr('— brak —','— none —')}</option>`:''}${!empty&&!val?`<option value="" selected disabled>${tr('— miejsce z wyszukiwarki —','— place from search —')}</option>`:''}<optgroup label="${tr('Polska','Poland')}">${PL_C.map(c=>`<option value="${esc(c[0])}" ${c[0]===val?'selected':''}>${esc(c[0])} (${lat(c[1])})</option>`).join('')}</optgroup><optgroup label="${tr('Świat','World')}">${W_C.map(c=>`<option value="${esc(c[0])}" ${c[0]===val?'selected':''}>${esc(nm(c[0]))} (${lat(c[1])})</option>`).join('')}</optgroup>${empty?'':`<option value="__custom" ${val==='__custom'?'selected':''}>${tr('Własna szerokość…','Custom latitude…')}</option>`}</select>`;}
function dayCtl(){const[m,dd]=fromDoy(S.day);return `<label>${tr('Dzień roku','Day of the year')}: <b>${dateTxt(S.day)}</b><input type="range" id="day" min="1" max="365" value="${S.day}" style="width:260px"></label><label>${tr('…albo wpisz datę','…or type a date')}<span style="display:flex;gap:6px"><input id="dd" type="number" min="1" max="31" value="${dd}" style="width:4.6em" aria-label="${tr('dzień','day')}"><select id="mm" aria-label="${tr('miesiąc','month')}">${(L==='pl'?['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień']:MONE).map((x,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${x}</option>`).join('')}</select></span></label><span class="chips">${PRE.map(p=>`<button class="btn" data-pre="${p[0]}" aria-pressed="${S.day===p[0]}">${p[1+li()]}</button>`).join('')}</span>`;}
function viewCalc(){const f=curLat(),d=decl(S.day),h=noonH(f,d),dl=dayLen(f,d);
 const title=S.multi?tr(`Pozorna droga Słońca – ${curName()}`,`Apparent path of the Sun – ${curName()}`):tr(`Ruch Słońca – ${curName()}, ${dateTxt(S.day)}`,`Path of the Sun – ${curName()}, ${dateTxt(S.day)}`);
 const days=S.multi?[[TILT,tr('22 VI','22 VI')],[0,tr('21 III i 23 IX','21 III & 23 IX')],[-TILT,tr('22 XII','22 XII')]]:[[d,dateTxt(S.day)]];
 const zen=Math.abs(d)<1e-6?tr('nad równikiem','over the equator'):tr(`nad równoleżnikiem ${lat(d)}`,`over latitude ${lat(d)}`);
 let h0=`<h2 class="sec">${tr('Wysokość Słońca i długość dnia','Sun height and day length')}</h2><p class="lead">${tr('Wybierz miejsce i dzień. Obok zobaczysz pozorną drogę Słońca nad horyzontem – możesz ją pobrać jako obrazek.','Choose a place and a day. Next to it you will see the apparent path of the Sun above the horizon – you can download it as a picture.')}</p>
 <div class="two"><div class="card" style="margin-top:8px"><div class="ctrl"><label>${tr('Miejsce','Place')}${citySel('city',S.city==='__geo'?'':S.city)}</label><label>${tr('…albo wyszukaj dowolne miejsce','…or search any place')}${placeBox('geom',S.city==='__geo'&&S.geo?S.geo.n:tr('np. Paryż, Tokio, Hel','e.g. Paris, Tokyo, Hel'))}</label>${S.city==='__custom'?`<label>${tr('Szerokość (°, minus = S)','Latitude (°, minus = S)')}<input id="custom" value="${esc(S.custom||'52')}" style="width:7em" inputmode="decimal"></label>`:''}</div>
 <div class="ctrl">${dayCtl()}</div>
 <div class="facts"><div>${tr('Wysokość Słońca w południe','Sun height at noon')}<b>${h>0?dm(h):tr('pod horyzontem','below horizon')}</b><span class="note">h = 90° − |φ − δ|</span></div><div>${tr('Długość dnia','Day length')}<b>${dl>=24?tr('24 h (dzień polarny)','24 h (polar day)'):dl<=0?tr('0 h (noc polarna)','0 h (polar night)'):hrs(dl)}</b></div>
 <div>${tr('Wschód i zachód (czas słoneczny)','Sunrise and sunset (solar time)')}<b>${dl>0&&dl<24?clock(12-dl/2)+' – '+clock(12+dl/2):'–'}</b></div><div>${tr('Słońce w zenicie','Sun at the zenith')}<b style="font-size:1rem">${zen}</b><span class="note">δ = ${dm(d)}</span></div></div>
 <h3 style="margin:16px 0 4px;font-size:1rem">${tr('Kąt padania promieni w południe','Angle of the Sun’s rays at noon')}</h3><div class="chart" style="max-width:340px">${angleFig(h)}</div><p class="note" style="margin:2px 0 8px">${tr('Im wyżej Słońce, tym bardziej skupione promienie i tym cieplej.','The higher the Sun, the more concentrated its rays and the warmer it gets.')}</p>
 <p class="note">${tr('Godziny wschodu i zachodu to czas słoneczny (12:00 = górowanie Słońca), bez wpływu stref czasowych i załamania światła w atmosferze.','Sunrise and sunset are given in solar time (12:00 = noon), without time zones or atmospheric refraction.')}</p></div>
 <div class="card" style="margin-top:8px"><div id="domebox">${dome(f,days,title,{angle:!S.multi})}</div>
 <div class="ctrl"><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" id="multi" ${S.multi?'checked':''}> ${tr('Pokaż drogi Słońca w dni równonocy i przesileń','Show the Sun’s paths on equinoxes and solstices')}</label><button class="btn primary" id="dlpng">${tr('Pobierz obrazek (PNG)','Download picture (PNG)')}</button><span class="note" id="dlst"></span></div></div></div>
 <div class="card"><h3 style="margin:0 0 4px;font-size:1.05rem">${tr('Długość dnia w ciągu roku','Day length through the year')}</h3><div class="ctrl"><label>${tr('Porównaj z – wpisz dowolne miasto lub szerokość','Compare with – type any city or latitude')}${placeBox('geoc',tr('np. Oslo, Kair, Sydney, 60°N','e.g. Oslo, Cairo, Sydney, 60°N'))}</label>${cmpObj()?`<button class="btn" id="cmpclr">${tr('Usuń porównanie','Remove comparison')}</button>`:''}</div><div class="chart">${dayChart([[f,'#d1462f'],...(cmpObj()?[[cmpObj().f,'#1f6fb2']]:[])])}</div>
 <p class="note"><span style="color:#d1462f;font-weight:700">■ ${esc(curName())}${curName()===lat(f)?'':' ('+lat(f)+')'}</span>${cmpObj()?` · <span style="color:#1f6fb2;font-weight:700">■ ${esc(cmpObj().n)}${cmpObj().n===lat(cmpObj().f)?'':' ('+lat(cmpObj().f)+')'}</span>`:''}</p>${cmpObj()?(()=>{const c=cmpObj(),a=dayLen(f,decl(S.day)),b=dayLen(c.f,decl(S.day));return `<div class="facts"><div>${esc(curName())} – ${dateTxt(S.day)}<b>${hrs(a)}</b></div><div>${esc(c.n)} – ${dateTxt(S.day)}<b>${hrs(b)}</b></div><div>${tr('Różnica','Difference')}<b>${hrs(Math.abs(a-b))}</b></div></div>`;})():''}</div>`;
 return h0;}
// ---------- zakładka: ruch obiegowy ----------
function orbitSVG(n){const W=560,H=300,cx=280,cy=150,rx=220,ry=90;let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="5 5"/>`;
 s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="#f2b632"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3b00">${tr('Słońce','Sun')}</text>`;
 const pos=k=>{const ang=Math.PI/2+(k-80)/365.25*2*Math.PI;return [cx+Math.cos(ang)*rx*-1*-1*Math.sign(1)*1,cy+Math.sin(ang)*ry];};
 const P=k=>{const t=(k-80)/365.25*2*Math.PI;return [cx+Math.sin(t)*rx,cy+Math.cos(t)*ry];};
 const earth=(x,y,r,lab,big)=>{const toS=Math.atan2(cy-y,cx-x);let g=`<g><circle cx="${x}" cy="${y}" r="${r}" fill="var(--night)"/>`;
  const a1=toS-Math.PI/2,a2=toS+Math.PI/2;g+=`<path d="M${x+Math.cos(a1)*r} ${y+Math.sin(a1)*r} A${r} ${r} 0 0 1 ${x+Math.cos(a2)*r} ${y+Math.sin(a2)*r}Z" fill="#7fb3e6"/>`;
  const ax=-TILT*D2R;g+=`<line x1="${x-Math.sin(ax)*-r*1.5}" y1="${y+Math.cos(ax)*r*1.5}" x2="${x+Math.sin(ax)*-r*1.5}" y2="${y-Math.cos(ax)*r*1.5}" stroke="currentColor" stroke-width="${big?2:1.4}"/>`;
  g+=`<circle cx="${x+Math.sin(ax)*-r*1.5}" cy="${y-Math.cos(ax)*r*1.5}" r="2.5" fill="currentColor"/>`;
  if(lab)g+=`<text x="${x}" y="${y+r+16}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${lab}</text>`;return g+'</g>';};
 PRE.forEach(p=>{const[x,y]=P(p[0]);s+=earth(x,y,11,p[1+li()]);});
 const[x,y]=P(n);s+=earth(x,y,17,'',true)+`<circle cx="${x}" cy="${y}" r="21" fill="none" stroke="#c2571a" stroke-width="2.5"/>`;
 s+=`<text x="12" y="20" font-size="12" fill="currentColor">${tr('Oś Ziemi jest zawsze nachylona w tę samą stronę (66°34′ do płaszczyzny orbity)','Earth’s axis always tilts the same way (66°34′ to the orbital plane)')}</text></svg>`;return s;}
function illumSVG(d,opts={}){const W=440,H=330,cx=230,cy=170,R=118;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial,Helvetica,sans-serif"><rect width="${W}" height="${H}" fill="#fff"/>`;
 for(let k=-3;k<=3;k++)s+=`<line x1="8" y1="${cy+k*28}" x2="${cx-Math.sqrt(Math.max(0,R*R-(k*28)**2))-4}" y2="${cy+k*28}" stroke="#f2b632" stroke-width="2.5"/><path d="M${cx-Math.sqrt(Math.max(0,R*R-(k*28)**2))-12} ${cy+k*28-5}l8 5 -8 5z" fill="#f2b632"/>`;
 s+=`<text x="10" y="${cy+3*28+22}" font-size="13" font-weight="700" fill="#b07d00">${tr('promienie Słońca','Sun’s rays')}</text>`;
 s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#dceeff" stroke="#111" stroke-width="2"/><path d="M${cx} ${cy-R} A${R} ${R} 0 0 1 ${cx} ${cy+R}Z" fill="#26324f" fill-opacity=".72"/>`;
 const t=d*D2R;// oś odchylona w lewo o d (biegun N ku Słońcu gdy d>0)
 const ux=-Math.sin(t),uy=-Math.cos(t);// kierunek osi do N (ekran)
 const px=-uy,py=ux;// prostopadle
 const par=(phi,col,lab,w)=>{const c=Math.sin(phi*D2R)*R,hl=Math.cos(phi*D2R)*R;const mx=cx+ux*c,my=cy+uy*c;s+=`<line x1="${mx-px*hl}" y1="${my-py*hl}" x2="${mx+px*hl}" y2="${my+py*hl}" stroke="${col}" stroke-width="${w||1.4}" ${w?'':'stroke-dasharray="4 3"'}/>`;
  if(lab&&!opts.nolab)s+=`<text x="${mx+px*hl+6}" y="${my+py*hl+4}" font-size="11.5" fill="#111">${lab}</text>`;};
 par(0,'#111',tr('równik','equator'),2);par(TILT,'#d1462f',tr('zwrotnik Raka','Tropic of Cancer'));par(-TILT,'#d1462f',tr('zwrotnik Koziorożca','Tropic of Capricorn'));par(PCIR,'#1f6fb2',tr('koło podbiegunowe','Arctic Circle'));par(-PCIR,'#1f6fb2',tr('koło podbiegunowe','Antarctic Circle'));
 s+=`<line x1="${cx-ux*(R+26)}" y1="${cy-uy*(R+26)}" x2="${cx+ux*(R+26)}" y2="${cy+uy*(R+26)}" stroke="#111" stroke-width="2"/><text x="${cx+ux*(R+34)}" y="${cy+uy*(R+34)+4}" text-anchor="middle" font-size="14" font-weight="700">N</text><text x="${cx-ux*(R+34)}" y="${cy-uy*(R+34)+4}" text-anchor="middle" font-size="14" font-weight="700">S</text>`;
 s+=`<line x1="8" y1="${cy}" x2="${cx-R}" y2="${cy}" stroke="#c2571a" stroke-width="3.5"/><circle cx="${cx-R}" cy="${cy}" r="5" fill="#c2571a"/>`;
 if(!opts.nolab)s+=`<text x="${cx-R-8}" y="${cy+20}" text-anchor="end" font-size="12" font-weight="700" fill="#c2571a">${tr('Słońce w zenicie','Sun at zenith')}</text>`;
 if(Math.abs(d)>0.5&&!opts.nolab){const sg=d>0?1:-1;const lx=cx+ux*R*0.8*sg,ly=cy+uy*R*0.8*sg,dx=cx-ux*R*0.8*sg,dy=cy-uy*R*0.8*sg;
  s+=`<text x="${lx-6}" y="${ly+(sg>0?6:4)}" text-anchor="end" font-size="12" font-weight="700" fill="#7a5200" paint-order="stroke" stroke="#dceeff" stroke-width="3">${tr('dzień polarny','polar day')}</text><text x="${dx+8}" y="${dy+4}" font-size="12" font-weight="700" fill="#fff">${tr('noc polarna','polar night')}</text>`;}
 if(!opts.nolab)s+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#555">${tr('lewa strona – dzień, prawa – noc','left side – day, right side – night')}</text>`;
 return s+'</svg>';}
function viewOrbit(){const d=decl(S.day);const zen=Math.abs(d)<1e-6?tr('nad równikiem (0°)','over the equator (0°)'):tr(`nad ${lat(d)}`,`over ${lat(d)}`);
 const rows=[90,PCIR,60,52+14/60,TILT,0,-TILT,-PCIR,-90].map(f=>`<tr><td>${f===90?tr('biegun N','North Pole'):f===-90?tr('biegun S','South Pole'):Math.abs(f-PCIR)<1e-6?tr('koło podbieg. N','Arctic Circle'):Math.abs(f+PCIR)<1e-6?tr('koło podbieg. S','Antarctic Circle'):Math.abs(f-TILT)<1e-6?tr('zwrotnik Raka','Tropic of Cancer'):Math.abs(f+TILT)<1e-6?tr('zwrotnik Koziorożca','Tropic of Capricorn'):f===0?tr('równik','equator'):lat(f)+(Math.abs(f-52.233)<0.01?' (Warszawa)':'')}</td><td style="text-align:right">${(()=>{const dl=dayLen(f,d);return dl>=24?'24 h':dl<=0?'0 h':hrs(dl);})()}</td><td style="text-align:right">${noonH(f,d)>0?dm(noonH(f,d)):'–'}</td></tr>`).join('');
 return `<h2 class="sec">${tr('Ruch obiegowy Ziemi i pory roku','Earth’s orbit and the seasons')}</h2><p class="lead">${tr('Ziemia okrąża Słońce w ciągu roku (365 dni 6 godzin). Jej oś jest zawsze nachylona w tę samą stronę, dlatego raz bardziej oświetlona jest półkula północna, a raz południowa – stąd pory roku.','Earth goes around the Sun once a year (365 days 6 hours). Its axis always tilts the same way, so sometimes the northern and sometimes the southern hemisphere gets more sunlight – that is why we have seasons.')}</p>
 <div class="card"><div class="ctrl">${dayCtl()}</div><div class="two"><div class="chart">${orbitSVG(S.day)}</div><div class="chart">${illumSVG(d)}</div></div>

 <div style="overflow-x:auto;margin-top:12px"><table style="border-collapse:collapse;min-width:420px;font-size:.95rem"><tr><th style="text-align:left;padding:4px 8px">${tr('Szerokość','Latitude')}</th><th style="text-align:right;padding:4px 8px">${tr('Długość dnia','Day length')}</th><th style="text-align:right;padding:4px 8px">${tr('Wysokość Słońca w południe','Noon Sun height')}</th></tr>${rows.replace(/<td/g,'<td style="padding:4px 8px;border-top:1px solid var(--line)"')}</table></div></div>

function drawGlobe(){const cv=$('#globe');if(!cv)return;const x=cv.getContext('2d'),W=cv.width,R=W/2-10,cx=W/2,cy=W/2;const d=decl(S.day);
 const lonS=(12-(S.utc-21/15))*15; // czas słoneczny Warszawy -> UTC ok. (21°E = +1h24m)
 const subLon=-(S.utc-21/15-12)*15; const lc=subLon+70,pc=18*D2R;const sp=Math.sin(pc),cp=Math.cos(pc);
 x.clearRect(0,0,W,W);x.fillStyle='#bcd7f0';x.beginPath();x.arc(cx,cy,R,0,7);x.fill();
 const pr=(lo,la)=>{const l=(lo-lc)*D2R,f=la*D2R;const c=sp*Math.sin(f)+cp*Math.cos(f)*Math.cos(l);return [cx+R*Math.cos(f)*Math.sin(l),cy-R*(cp*Math.sin(f)-sp*Math.cos(f)*Math.cos(l)),c>0];};
 x.fillStyle='#8fbf7a';x.strokeStyle='#5f8f4f';x.lineWidth=.6;
 LAND.forEach(ring=>{x.beginPath();let vis=0,started=false;ring.forEach(([lo,la])=>{const[a,b,v]=pr(lo,la);if(v){vis++;if(!started){x.moveTo(a,b);started=true;}else x.lineTo(a,b);}else if(started){const k=Math.hypot(a-cx,b-cy)||1;x.lineTo(cx+(a-cx)/k*R,cy+(b-cy)/k*R);} });if(vis>2){x.fill();x.stroke();}});
 // siatka
 x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=.8;for(let la=-60;la<=60;la+=30){x.beginPath();let st=false;for(let lo=-180;lo<=180;lo+=4){const[a,b,v]=pr(lo,la);if(v){st?x.lineTo(a,b):x.moveTo(a,b);st=true;}else st=false;}x.stroke();}
 for(let lo=-180;lo<180;lo+=30){x.beginPath();let st=false;for(let la=-90;la<=90;la+=4){const[a,b,v]=pr(lo,la);if(v){st?x.lineTo(a,b):x.moveTo(a,b);st=true;}else st=false;}x.stroke();}
 // noc
 const N=180,img=x.createImageData(N,N),sd=Math.sin(d*D2R),cd=Math.cos(d*D2R);
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){const X=(i+.5)/N*2-1,Y=1-(j+.5)/N*2;const rho=Math.hypot(X,Y);if(rho>=1)continue;const c=Math.asin(rho);const sc=Math.sin(c),cc=Math.cos(c);
  const f=Math.asin(cc*sp+(rho?Y*sc*cp/rho:0));const l=lc*D2R+Math.atan2(X*sc,rho*cc*cp-Y*sc*sp);const cz=Math.sin(f)*sd+Math.cos(f)*cd*Math.cos(l-subLon*D2R);
  const al=cz<-0.1?0.62:cz<0.05?0.62*(0.05-cz)/0.15:0;const k=(j*N+i)*4;img.data[k]=10;img.data[k+1]=16;img.data[k+2]=40;img.data[k+3]=al*255;}
 const oc=document.createElement('canvas');oc.width=N;oc.height=N;oc.getContext('2d').putImageData(img,0,0);x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();x.imageSmoothingEnabled=true;x.drawImage(oc,cx-R,cy-R,2*R,2*R);x.restore();
 x.strokeStyle='#333';x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
 const[wx,wy,wv]=pr(21,52.23);if(wv){x.fillStyle='#d1462f';x.beginPath();x.arc(wx,wy,5,0,7);x.fill();x.fillStyle='#111';x.font='bold 13px Arial';x.fillText(tr('Polska','Poland'),wx+8,wy-6);}
 x.fillStyle='#b07d00';x.font='bold 13px Arial';x.fillText(tr('← Słońce świeci z tej strony','← sunlight from this side'),10,20);
 const el=$('#utcl');if(el)el.textContent=clock(S.utc);}
function loop(t){if(!S.play||S.tab!=='rot'){RAF=0;return;}const dt=lastT?(t-lastT)/1000:0;lastT=t;S.utc=(S.utc+dt*S.spd*2)%24;const r=$('#utc');if(r)r.value=S.utc;drawGlobe();RAF=requestAnimationFrame(loop);}

function dateTxtL(n,l){const[m,d]=fromDoy(n);return l?`${d} ${MONE[m-1]}`:`${d} ${MONG[m-1]}`;}

function genNoon(lvl){const pool=lvl==='easy'?PL_C:lvl==='medium'?[...PL_C,...W_C.filter(c=>c[1]>TILT)]:W_C;const c=pick(pool),f=c[1];const n=lvl==='easy'?pick([80,266,173]):pick([80,173,266,356]);const d=decl(n);
 if(noonH(f,d)<=0)return genNoon(lvl);const diff=Math.abs(f-d),h=90-diff;
 return {type:'noon',text:[`Oblicz wysokość Słońca w południe ${dateTxtL(n,0)} w miejscowości <strong>${placeTxt(c,0)}</strong>.`,`Calculate the height of the Sun at noon on ${dateTxtL(n,1)} in <strong>${placeTxt(c,1)}</strong>.`],steps:[zStep(n),
  {kind:'angle',q:[`Oblicz odległość kątową między ${placeTxt(c,0)} a tym równoleżnikiem.`,`Calculate the angular distance between ${placeTxt(c,1)} and that line of latitude.`],ans:diff,
   hints:f*d<0?[['Miejsce i równoleżnik leżą na różnych półkulach – dodaj ich szerokości.','The place and the line of latitude are in different hemispheres – add their latitudes.'],[`${dm(Math.abs(f))} + ${dm(Math.abs(d))} = ?`,`${dm(Math.abs(f))} + ${dm(Math.abs(d))} = ?`]]:[['Odejmij mniejszą szerokość od większej (obie są na tej samej półkuli).','Subtract the smaller latitude from the larger one (both are in the same hemisphere).'],[`${dm(Math.max(Math.abs(f),Math.abs(d)))} − ${dm(Math.min(Math.abs(f),Math.abs(d)))} = ? Pamiętaj: 1° = 60′.`,`${dm(Math.max(Math.abs(f),Math.abs(d)))} − ${dm(Math.min(Math.abs(f),Math.abs(d)))} = ? Remember: 1° = 60′.`]],sol:[`${dm(diff)}`,`${dm(diff)}`]},
  {kind:'angle',q:['Oblicz wysokość Słońca w południe: h = 90° − odległość z kroku 2.','Calculate the noon Sun height: h = 90° − the distance from step 2.'],ans:h,hints:[['Od 90° (zenit) odejmij wynik z kroku 2.','Subtract the result of step 2 from 90° (the zenith).'],[`90° − ${dm(diff)} = ? (90° = 89°60′)`,`90° − ${dm(diff)} = ? (90° = 89°60′)`]],sol:[`h = 90° − ${dm(diff)} = ${dm(h)}`,`h = 90° − ${dm(diff)} = ${dm(h)}`]}],final:[`h = ${dm(h)}`,`h = ${dm(h)}`]};}
function genLat(lvl){const n=lvl==='hard'?pick([173,356]):pick([80,266]);const d=decl(n);let f;do{f=(Math.round(Math.random()*60*70)/60)*(lvl==='hard'&&Math.random()<.3?-1:1);}while(Math.abs(f)<1||noonH(f,d)<=5||Math.abs(f-d)<1);
 const h=noonH(f,d),side=f>d?'S':'N',diff=Math.abs(f-d);const sideTxt=side==='S'?['południowej','southern']:['północnej','northern'];
 const s3=lvl==='hard'?{kind:'angle',hemi:true,q:['Podaj szerokość geograficzną miejsca (wybierz N lub S).','Give the latitude of the place (choose N or S).'],ans:f,hints:[['Miejsce leży o wynik z kroku 2 dalej od równoleżnika zenitalnego – w stronę przeciwną do tej, gdzie widać Słońce.','The place is the step-2 distance away from the zenith parallel – on the side opposite to where the Sun is seen.'],[`Słońce widać nad ${sideTxt[0]} stroną horyzontu, więc miejsce leży na ${side==='S'?'północ':'południe'} od ${dm(d,['N','S'])||'0°'}.`,`The Sun is seen over the ${sideTxt[1]} horizon, so the place lies ${side==='S'?'north':'south'} of ${dm(d,['N','S'])||'0°'}.`]],sol:[`φ = ${lat(f)}`,`φ = ${lat(f)}`]}
  :{kind:'choice',q:['Na której półkuli leży to miejsce?','Which hemisphere is the place in?'],opts:[['N',['północnej (N)','northern (N)']],['S',['południowej (S)','southern (S)']]],ans:f>0?'N':'S',hints:[['Jeśli w południe Słońce widać nad południową stroną horyzontu, a jest równonoc, jesteś na północ od równika.','If at noon on an equinox the Sun is over the southern horizon, you are north of the equator.'],['Słońce jest zawsze po stronie równoleżnika, nad którym góruje w zenicie.','The Sun is always on the side of the parallel where it is overhead.']],sol:[f>0?'półkula północna':'półkula południowa',f>0?'northern hemisphere':'southern hemisphere']};
 return {type:'lat',text:[`${dateTxtL(n,0)} Słońce górowało w pewnym miejscu na wysokości <strong>${dm(h)}</strong> nad ${sideTxt[0]} stroną horyzontu. Oblicz szerokość geograficzną tego miejsca.`,`On ${dateTxtL(n,1)} the Sun reached a height of <strong>${dm(h)}</strong> above the ${sideTxt[1]} horizon at noon somewhere. Calculate the latitude of that place.`],steps:[zStep(n),
  {kind:'angle',q:['Oblicz odległość kątową miejsca od tego równoleżnika: 90° − h.','Calculate the angular distance of the place from that parallel: 90° − h.'],ans:diff,hints:[['Im dalej od równoleżnika zenitalnego, tym niżej Słońce. Odejmij wysokość od 90°.','The farther from the zenith parallel, the lower the Sun. Subtract the height from 90°.'],[`90° − ${dm(h)} = ? (90° = 89°60′)`,`90° − ${dm(h)} = ? (90° = 89°60′)`]],sol:[`90° − ${dm(h)} = ${dm(diff)}`,`90° − ${dm(h)} = ${dm(diff)}`]},s3],final:[`φ = ${lat(f)}`,`φ = ${lat(f)}`]};}
function genPolar(lvl){const n=pick([80,173,266,356]);const d=decl(n);const f=(lvl==='easy'?pick([1,1,-1]):pick([1,-1]))*pick([70,72,75,78,80,85,60,55,68,67]);
 const beyond=Math.abs(f)>=PCIR;const res=Math.abs(d)<1e-6?'normal':beyond?(f*d>0?'day':'night'):'normal';
 const RES={day:['dzień polarny','polar day'],night:['noc polarna','polar night'],normal:['zwykły dzień i noc','ordinary day and night']};
 return {type:'polar',text:[`Co będzie się działo ${dateTxtL(n,0)} na szerokości <strong>${lat(f)}</strong>: dzień polarny, noc polarna czy zwykła doba z dniem i nocą?`,`What happens on ${dateTxtL(n,1)} at latitude <strong>${lat(f)}</strong>: polar day, polar night or an ordinary day with day and night?`],steps:[zStep(n),

  {kind:'choice',q:['Co się tam dzieje tego dnia?','What happens there on that day?'],opts:Object.entries(RES).map(([k,v])=>[k,v]),ans:res,hints:[['Dzień i noc polarna występują tylko za kołami podbiegunowymi i tylko poza równonocami.','Polar day and night happen only beyond the polar circles and not on the equinoxes.'],['Ta półkula, nad której zwrotnikiem góruje Słońce, ma dzień polarny; druga – noc polarną.','The hemisphere whose tropic has the Sun overhead gets polar day; the other gets polar night.']],sol:RES[res]}],final:RES[res]};}
function genDate(lvl){const n=pick([80,173,266,356]);const d=decl(n);const pole=Math.abs(d)<1e-6?'none':d>0?'N':'S';
 const OPT=PRE.map(p=>[String(p[0]),[dateTxtL(p[0],0),dateTxtL(p[0],1)]]);

  {kind:'choice',q:['Nad którym równoleżnikiem Słońce góruje w zenicie (pomarańczowy promień)?','Over which parallel is the Sun at the zenith (orange ray)?'],opts:ZEN.map(z=>[z.k,z.n]),ans:zenOf(d),hints:[['Pomarańczowy promień pada prostopadle na powierzchnię Ziemi. Na jakiej szerokości?','The orange ray hits the surface at a right angle. At which latitude?'],['Czerwone przerywane linie to zwrotniki, czarna – równik.','The red dashed lines are the tropics, the black one is the equator.']],sol:ZEN.find(z=>z.k===zenOf(d)).n},

 if(st.kind==='choice'){ok=choice===st.ans||(st.alt&&st.alt.includes(choice));TK.val[i]=choice;}
 else{const r=readAngle(i,st);TK.val[i]=[$('#pd'+i).value,$('#pm'+i).value,st.hemi?$('#ph'+i).value:''];if(r.err){TK.fb[i]=['bad',r.err==='empty'?tr('Wpisz stopnie (i minuty).','Type the degrees (and minutes).'):tr('Stopnie wpisz w pierwsze pole, minuty (0–59) w drugie.','Degrees go in the first box, minutes (0–59) in the second.')];return renderPr(i);}
  ok=Math.abs(r.v-st.ans)<=1.5/60;if(!ok&&st.hemi&&Math.abs(Math.abs(r.v)-Math.abs(st.ans))<=1.5/60)msg=tr('Liczba się zgadza, ale sprawdź półkulę (N/S).','The number is right, but check the hemisphere (N/S).');
  else if(!ok&&Math.abs(r.v-st.ans)<1.2&&Math.abs(r.v-st.ans)>0.1)msg=tr('Jesteś blisko. Sprawdź minuty: 1° = 60′, więc np. 89°60′ − 37°46′ = 52°14′.','Close. Check the minutes: 1° = 60′, e.g. 89°60′ − 37°46′ = 52°14′.');}
 if(ok){TK.fb[i]=['ok',pick(PRAISE)[li()]];TK.cur=i+1;if(i===2)pfinish();return renderPr(i+1);}
 TK.tries[i]++;const n=TK.tries[i];const base=n===1?st.hints[0][li()]:st.hints[1][li()];TK.fb[i]=['bad',(msg?msg+' ':'')+base+(n>=3?' '+tr('Możesz spróbować jeszcze raz albo zobaczyć rozwiązanie kroku.','You can try again or reveal the solution of this step.'):` <span class="note">${tr('Próby przed pokazaniem rozwiązania','Tries before the solution can be shown')}: ${3-n}</span>`)];renderPr(i);}
function preveal(i){const st=TK.steps[i];TK.shown[i]=1;TK.fb[i]=['sol',(Array.isArray(st.sol)?st.sol[li()]:st.sol)];
 if(st.kind==='choice')TK.val[i]=st.ans;else{const a=Math.abs(st.ans);let D=Math.floor(a+1e-9),M=Math.round((a-D)*60);if(M===60){D++;M=0;}TK.val[i]=[D,M,st.ans<0?'S':'N'];}TK.cur=i+1;if(i===2)pfinish();renderPr(i+1);}
function pfinish(){if(TK.done)return;TK.done=true;S.pr.all++;if(!TK.shown.some(Boolean)){S.pr.ok++;S.pr.streak++;TK.self=true;}else{S.pr.streak=0;TK.self=false;}save();}
function viewPr(){if(!TK)newTk();return `<h2 class="sec">${tr('Zadania','Practice')}</h2><p class="lead">${tr('Rozwiąż zadanie krok po kroku. Kąty wpisuj w stopniach i minutach, np. 37° 46′.','Solve each task step by step. Enter angles in degrees and minutes, e.g. 37° 46′.')}</p>
 <div class="ctrl" style="justify-content:space-between"><span class="chips">${['easy','medium','hard'].map(l=>`<button class="btn" data-plvl="${l}" aria-pressed="${S.pr.lvl===l}">${{easy:tr('Łatwy','Easy'),medium:tr('Średni','Medium'),hard:tr('Trudny','Hard')}[l]}</button>`).join('')}</span><span class="score" id="pscore"></span></div>
 <div class="chips" style="margin-bottom:10px"><button class="btn" data-ptype="all" aria-pressed="${S.pr.type==='all'}">${tr('Wszystkie typy','All types')}</button>${Object.keys(PGEN).map(k=>`<button class="btn" data-ptype="${k}" aria-pressed="${S.pr.type===k}">${PT[k][li()]}</button>`).join('')}</div>
 <div class="card" id="ppanel" style="margin-top:6px"></div>`;}
function renderPr(focus){const p=$('#ppanel');if(!p)return;const tk=TK;
 $('#pscore').innerHTML=`<span>${tr('Rozwiązane samodzielnie','Solved on your own')}<b>${S.pr.ok}</b></span><span>${tr('Wszystkie','All')}<b>${S.pr.all}</b></span><span>${tr('Seria','Streak')}<b>${S.pr.streak}</b> ${tr('z rzędu','in a row')}</span>`;
 let h=`<p class="note" style="margin:0 0 4px">${PT[tk.type][li()]}</p><p class="task">${tk.text[li()]}</p>${tk.fig?`<div class="chart" style="max-width:440px">${tk.fig}</div>`:''}`;
 tk.steps.forEach((st,i)=>{const locked=i>tk.cur,done=i<tk.cur;const dis=locked||done?'disabled':'';
  h+=`<div class="pstep ${locked?'locked':''} ${done?(tk.shown[i]?'done shown':'done'):''}"><h3><span class="n">${done?'✓':i+1}</span>${tr('Krok','Step')} ${i+1}</h3><p style="margin:0 0 8px">${locked?tr(`Odblokuje się po rozwiązaniu kroku ${i}.`,`Unlocks after you solve step ${i}.`):st.q[li()]}</p>`;
  if(!locked){if(st.kind==='choice')h+=`<div class="chips">${st.opts.map(o=>`<button class="btn" data-pch="${i}" data-v="${o[0]}" ${dis} aria-pressed="${tk.val[i]===o[0]}">${esc(o[1][li()])}</button>`).join('')}</div>`;
   else{const v=tk.val[i]||['','',''];h+=`<div class="arow"><input id="pd${i}" inputmode="decimal" value="${esc(v[0])}" ${dis} aria-label="${tr('stopnie','degrees')}"><span class="u">°</span><input id="pm${i}" inputmode="numeric" value="${esc(v[1])}" ${dis} aria-label="${tr('minuty','minutes')}" style="width:4.5em"><span class="u">′</span>${st.hemi?`<select id="ph${i}" ${dis}><option ${v[2]==='N'?'selected':''}>N</option><option ${v[2]==='S'?'selected':''}>S</option></select>`:''}${!done?`<button class="btn primary" data-pck="${i}">${tr('Sprawdź','Check')}</button>`:''}</div>`;}
   if(!done&&tk.tries[i]>=3)h+=`<p style="margin:8px 0 0"><button class="btn" data-psol="${i}">${tr('Pokaż rozwiązanie kroku','Show this step’s solution')}</button></p>`;}
  if(tk.fb[i])h+=`<div class="fb ${tk.fb[i][0]}" role="status">${tk.fb[i][1]}</div>`;h+='</div>';});
 if(tk.done)h+=`<div class="final">${tr('Odpowiedź:','Answer:')}<div class="big">${tk.final[li()]}</div><p style="margin:6px 0 0">${tk.self?tr('Rozwiązane samodzielnie – licznik +1!','Solved on your own – counter +1!'):tr('Zadanie skończone z podglądem rozwiązania. Następne spróbuj samodzielnie.','Finished with a revealed solution. Try the next one on your own.')}</p></div>`;
 h+=`<p style="margin:14px 0 0"><button class="btn ${tk.done?'primary':''}" id="pnew">${tr('Nowe zadanie','New task')}</button></p>`;p.innerHTML=h;
 if(focus!=null){const el=$('#pd'+focus);if(el&&!el.disabled)el.focus();}}
// ---------- PNG ----------
let DL={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'};}};
if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{if(d)DL=d;}).catch(()=>{});
async function dlPng(){const svg=$('#domebox svg');if(!svg)return;const xml=new XMLSerializer().serializeToString(svg);const img=new Image();const u=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));
 img.onload=async()=>{const c=document.createElement('canvas');c.width=1360;c.height=880;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(async b=>{try{await DL.save({filename:tr('ruch-slonca','sun-path')+'-'+(S.multi?'rok':S.day)+'.png',data:b});$('#dlst').textContent=tr('Zapisano.','Saved.');}catch(e){$('#dlst').textContent=tr('Nie udało się zapisać.','Could not save.');}},'image/png');};img.src=u;}
// ---------- render ----------
const TABS=[['rot',['Ruch obrotowy','Rotation']],['orb',['Ruch obiegowy','Orbit & seasons']],['calc',['Wysokość Słońca i droga po niebie','Sun height & sky path']],['pr',['Zadania','Practice']]];
function render(){document.documentElement.lang=L;$('#t1').textContent=tr('Ruchy Ziemi i oświetlenie','Earth’s motions and sunlight');$('#t2').textContent=tr('Dzień i noc, pory roku, wysokość Słońca i jego pozorna droga po niebie.','Day and night, seasons, the height of the Sun and its apparent path across the sky.');
 $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
 $('#tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${n[li()]}</button>`).join('');
 $('#app').innerHTML={rot:viewRot,orb:viewOrbit,calc:viewCalc,pr:viewPr}[S.tab]();
 if(S.tab==='rot'){drawGlobe();if(S.play&&!RAF){lastT=0;RAF=requestAnimationFrame(loop);}}
 if(S.tab==='pr')renderPr();save();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.lang){L=b.dataset.lang;render();}
 else if(b.dataset.tab){S.tab=b.dataset.tab;render();}
 else if(b.dataset.pre){S.day=+b.dataset.pre;render();}
 else if(b.id==='play'){S.play=!S.play;render();}
 else if(b.id==='dlpng')dlPng();
 else if(b.id==='cmpclr'){S.cmp='';render();}
 else if(b.dataset.plvl){S.pr.lvl=b.dataset.plvl;newTk();render();}
 else if(b.dataset.ptype){S.pr.type=b.dataset.ptype;newTk();render();}
 else if(b.dataset.pch!=null)pcheck(+b.dataset.pch,b.dataset.v);
 else if(b.dataset.pck!=null)pcheck(+b.dataset.pck);
 else if(b.dataset.psol!=null)preveal(+b.dataset.psol);
 else if(b.id==='pnew'){if(TK&&!TK.done&&TK.cur>0){S.pr.streak=0;}newTk();renderPr(0);save();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&/^p[dm]\d$/.test(e.target.id||'')){e.preventDefault();pcheck(+e.target.id.slice(2));}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='day'){S.day=+e.target.value;if(S.tab==='rot'){drawGlobe();const lb=e.target.closest('label').querySelector('b');lb.textContent=dateTxt(S.day);}else render2();}
 else if(id==='utc'){S.utc=+e.target.value;drawGlobe();}});
let rt=0;function render2(){cancelAnimationFrame(rt);rt=requestAnimationFrame(()=>{const a=document.activeElement&&document.activeElement.id;render();if(a){const el=document.getElementById(a);if(el)el.focus();}});}
document.addEventListener('change',e=>{const id=e.target.id;if(id==='dd'||id==='mm'){let d=parseInt($('#dd').value,10),m=+$('#mm').value;if(!(d>=1))d=1;d=Math.min(d,MDAYS[m-1]);S.day=doy(m,d);render();return;}if(id==='city'){if(!e.target.value)return;S.city=e.target.value;render();}else if(id==='custom'){S.custom=e.target.value;render();}else if(id==='multi'){S.multi=e.target.checked;render();}else if(id==='cmp'){S.cmp=e.target.value;render();}else if(id==='spd'){S.spd=+e.target.value;}});
render();

</script>

<title>Porównywarka państw świata</title>

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--paper:#fcfdfe;--ink:#17202a;--muted:#566070;--line:#d0d7e0;--soft:#e3e8ef;--acc:#14558f;--acc-t:#14558f;--acc-ink:#fff;--ok:#2e7d4f;--no:#b4432a;--focus:#c2571a;--sea:#dde7f1;--nodata:#d9d9d9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--paper:#171d25;--ink:#e3e8ee;--muted:#9aa5b3;--line:#2a3340;--soft:#1e2631;--acc:#4b8fd1;--acc-t:#93c0ec;--acc-ink:#0b1622;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;--sea:#142234;--nodata:#3a414c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141a;--paper:#171d25;--ink:#e3e8ee;--muted:#9aa5b3;--line:#2a3340;--soft:#1e2631;--acc:#4b8fd1;--acc-t:#93c0ec;--acc-ink:#0b1622;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;--sea:#142234;--nodata:#3a414c;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.015em;line-height:1.15}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 70px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800}header p{margin:2px 0 0;color:var(--muted)}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.9rem;border:0;background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tabs button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-size:.92rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 13px}
.btn:hover{border-color:var(--acc)}.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
select,input{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:16px 0}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--c);border-radius:999px;padding:3px 6px 3px 11px;background:var(--paper);font-weight:700}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 4px}
.combo{position:relative;display:inline-block}.combo input{min-width:320px}
.sugg{position:absolute;left:0;top:calc(100% + 4px);z-index:20;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:300px;max-height:320px;overflow:auto;padding:4px}
.sugg button{display:block;width:100%;text-align:left;font:inherit;font-size:.92rem;border:0;background:none;color:var(--ink);padding:6px 10px;border-radius:7px;cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--soft);outline:none}
.lay{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 16px}
.sidehead{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.sidebtns{font-size:.82rem;color:var(--muted)}
.lnk{font:inherit;font-size:.82rem;border:0;background:none;color:var(--acc-t);cursor:pointer;padding:0;text-decoration:underline}
.side details{border-top:1px solid var(--line);padding:4px 0}
.side summary{cursor:pointer;font-weight:700;padding:6px 2px;list-style-position:inside}
.side .cnt{display:inline-block;min-width:20px;text-align:center;font-size:.75rem;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:0 6px;margin-left:4px}
.side ul{list-style:none;margin:2px 0 6px;padding:0}
.side li label{display:flex;gap:8px;align-items:flex-start;padding:4px 4px;border-radius:6px;cursor:pointer;font-size:.9rem;line-height:1.3}
.side li label:hover{background:var(--soft)}
.side input{margin-top:2px;accent-color:var(--acc);flex:none}
.side .grpb{margin:0 0 4px 2px}
.side li.xy{display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center;font-size:.88rem;padding:3px 4px}
.xyb{font:inherit;font-size:.78rem;font-weight:700;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:1px 7px;cursor:pointer}
.xyb[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
@media (max-width:900px){.lay{grid-template-columns:1fr}.side{position:static;max-height:none}}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px}
.status{color:var(--muted);font-size:.9rem;min-height:1.3em}
.err{background:color-mix(in srgb,var(--no) 12%,var(--paper));border:1.5px solid var(--no);border-radius:12px;padding:12px 14px;margin-top:14px}
table.cmp{width:100%;border-collapse:collapse;font-size:.93rem}
table.cmp th,table.cmp td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp thead th{position:sticky;top:0;background:var(--paper);z-index:1;border-bottom:3px solid var(--c,var(--line))}
table.cmp td small{display:block;color:var(--muted);font-size:.75rem}
table.cmp tr.grp td{background:var(--soft);font-weight:700;text-align:left;cursor:pointer}
table.cmp td.best{font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.85rem;margin-top:6px}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.rank{list-style:none;margin:0;padding:0;max-height:640px;overflow:auto}
.rank li{display:grid;grid-template-columns:44px 180px 1fr 130px;gap:8px;align-items:center;padding:3px 4px;font-size:.9rem;border-radius:6px}
.rank li.sel{background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:700}
.rank .b{height:14px;border-radius:4px;background:var(--acc);opacity:.8}
.rank .v{text-align:right}
.mapwrap{position:relative}
.mapwrap svg{width:100%;height:auto;display:block;background:var(--sea);border-radius:12px}
.mapwrap path{stroke:var(--paper);stroke-width:.35;cursor:pointer}
.mapwrap path.sel{stroke:var(--ink);stroke-width:1.6}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.85rem;padding:4px 8px;border-radius:6px;z-index:9;max-width:260px}
.quiz .clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.quiz .clues div{background:var(--soft);border-radius:12px;padding:10px 12px}
.quiz .clues b{display:block;font:800 1.3rem 'Bricolage Grotesque',sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px;font-size:1.05rem}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opts button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.fb{font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.note{font-size:.85rem;color:var(--muted)}
@media (max-width:760px){.rank li{grid-template-columns:36px 1fr 90px}.rank .b{display:none}.opts{grid-template-columns:1fr}}
</style>
</head>

 S.meta={list:list.map(c=>c.id),by};}
const REGPL={'East Asia & Pacific':'Azja Wschodnia i Pacyfik','Europe & Central Asia':'Europa i Azja Środkowa','Latin America & Caribbean':'Ameryka Łacińska i Karaiby','Middle East & North Africa':'Bliski Wschód i Afryka Północna','Middle East, North Africa, Afghanistan & Pakistan':'Bliski Wschód, Afryka Północna, Afganistan i Pakistan','North America':'Ameryka Północna','South Asia':'Azja Południowa','Sub-Saharan Africa':'Afryka Subsaharyjska'};
const INCPL={'High income':'wysoki dochód','Upper middle income':'wyższy średni dochód','Lower middle income':'niższy średni dochód','Low income':'niski dochód','Not classified':'brak klasyfikacji'};
const regName=r=>L==='pl'?(REGPL[r]||r):r;
const parseWB=j=>{const m={};(j[1]||[]).forEach(d=>{if(d.value!=null&&d.countryiso3code)(m[d.countryiso3code]=m[d.countryiso3code]||[]).push([+d.date,+d.value]);});Object.values(m).forEach(a=>a.sort((x,y)=>x[0]-y[0]));return m;};
// najnowsze wartości dla wszystkich państw: Map iso3 -> [rok, wartość]
const LATEST={};
const yq=()=>S.year?`date=${S.year}`:'mrnev=1';
async function latestAll(code,forceLatest){const yk=forceLatest?'':S.year;const key=code+'|'+yk;if(LATEST[key])return LATEST[key];const sv=S.year;if(forceLatest)S.year='';let out={};try{
 if(code==='natincr'){const[a,b]=await Promise.all([latestAll('SP.DYN.CBRT.IN',forceLatest),latestAll('SP.DYN.CDRT.IN',forceLatest)]);for(const k in a)if(b[k])out[k]=[Math.min(a[k][0],b[k][0]),a[k][1]-b[k][1]];}
 else if(code==='netmigr'){const[a,b]=await Promise.all([latestAll('SM.POP.NETM',forceLatest),latestAll('SP.POP.TOTL',forceLatest)]);for(const k in a)if(b[k])out[k]=[a[k][0],a[k][1]/b[k][1]*1000];}
 else if(code==='hdi'){out=await hdiAll();}
 else{let j=await getJSON(`${WB}country/all/indicator/${code}?format=json&${yq()}&per_page=500`);
  if(code==='EN.GHG.CO2.PC.CE.AR5'&&!(j[1]&&j[1].length))j=await getJSON(`${WB}country/all/indicator/EN.ATM.CO2E.PC?format=json&${yq()}&per_page=500`);
  (j[1]||[]).forEach(d=>{if(d.value!=null&&S.meta.by[d.countryiso3code]&&(!S.year||d.date===String(S.year)))out[d.countryiso3code]=[+d.date,+d.value];});}
 }finally{S.year=sv;} LATEST[key]=out;return out;}
async function series(code,isos){const key=code+isos.join(';');if(CACHE[key])return CACHE[key];let out={};
 if(code==='natincr'||code==='netmigr'){const[a,b]=await Promise.all(code==='natincr'?[series('SP.DYN.CBRT.IN',isos),series('SP.DYN.CDRT.IN',isos)]:[series('SM.POP.NETM',isos),series('SP.POP.TOTL',isos)]);
  isos.forEach(k=>{const bm=new Map((b[k]||[]).map(x=>[x[0],x[1]]));out[k]=(a[k]||[]).filter(x=>bm.has(x[0])).map(x=>[x[0],code==='natincr'?x[1]-bm.get(x[0]):x[1]/bm.get(x[0])*1000]);});}
 else if(code==='hdi'){const h=await hdiSeries(isos);out=h;}
 else out=parseWB(await getJSON(`${WB}country/${isos.join(';')}/indicator/${code}?format=json&date=1960:2030&per_page=3000`));
 CACHE[key]=out;return out;}

const sparql=q=>getJSON('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q),20000);
async function hdiAll(){const r=await sparql(`SELECT ?iso ?v ?d WHERE{?c wdt:P297 ?iso; p:P1081 ?s. ?s ps:P1081 ?v. OPTIONAL{?s pq:P585 ?d}}`);const i2={};S.meta.list.forEach(k=>i2[S.meta.by[k].iso2]=k);const out={};
 r.results.bindings.forEach(b=>{const k=i2[b.iso.value];if(!k)return;const y=b.d?+b.d.value.slice(0,4):0;if(S.year&&y!==+S.year)return;if(!out[k]||y>out[k][0])out[k]=[y,+b.v.value];});return out;}
async function hdiSeries(isos){const r=await sparql(`SELECT ?iso ?v ?d WHERE{VALUES ?iso{${isos.map(k=>'"'+S.meta.by[k].iso2+'"').join(' ')}} ?c wdt:P297 ?iso; p:P1081 ?s. ?s ps:P1081 ?v; pq:P585 ?d.}`);const i2={};isos.forEach(k=>i2[S.meta.by[k].iso2]=k);const out={};
 r.results.bindings.forEach(b=>{const k=i2[b.iso.value];(out[k]=out[k]||[]).push([+b.d.value.slice(0,4),+b.v.value]);});Object.values(out).forEach(a=>a.sort((x,y)=>x[0]-y[0]));return out;}
async function atlas(isos){const lang=L;const q=`SELECT ?iso (GROUP_CONCAT(DISTINCT ?curL;separator=", ") AS ?cur) (GROUP_CONCAT(DISTINCT ?lanL;separator=", ") AS ?lan) (SAMPLE(?hpL) AS ?hp) (SAMPLE(?el) AS ?elev) (COUNT(DISTINCT ?nb) AS ?nbn) WHERE{VALUES ?iso{${isos.map(k=>'"'+S.meta.by[k].iso2+'"').join(' ')}} ?c wdt:P297 ?iso.
 OPTIONAL{?c wdt:P38 ?cu. ?cu rdfs:label ?curL FILTER(lang(?curL)="${lang}")} OPTIONAL{?c wdt:P37 ?la. ?la rdfs:label ?lanL FILTER(lang(?lanL)="${lang}")}
 OPTIONAL{?c wdt:P610 ?hpi. ?hpi rdfs:label ?hpL FILTER(lang(?hpL)="${lang}") OPTIONAL{?hpi wdt:P2044 ?el}} OPTIONAL{?c wdt:P47 ?nb. ?nb wdt:P31 wd:Q3624078}} GROUP BY ?iso`;
 const r=await sparql(q);const i2={};isos.forEach(k=>i2[S.meta.by[k].iso2]=k);const out={};r.results.bindings.forEach(b=>{out[i2[b.iso.value]]={cur:b.cur&&b.cur.value,lan:b.lan&&b.lan.value,hp:b.hp&&b.hp.value,el:b.elev&&Math.round(+b.elev.value),nb:b.nbn&&+b.nbn.value};});return out;}

const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
const indName=k=>{if(k.startsWith('atl_')){const a=ATL.find(x=>x[0]===k);return a[1]==='AG.SRF.TOTL.K2'?IBY[a[1]].n[li()]:tx(a[1]);}return IBY[k].n[li()];};
function comboItems(id){if(id==='addc')return S.meta.list.filter(k=>!S.sel.includes(k)).map(k=>[k,cname(k)]).sort((a,b)=>a[1].localeCompare(b[1],L));
 const inds=IND.filter(r=>r[1]!=='atlas').map(r=>[r[0],IBY[r[0]].n[li()]+' · '+GROUPS[r[1]][li()]]);
 if(id==='indc')return [...inds,...ATL.map(a=>[a[0],indName(a[0])+' · '+GROUPS.atlas[li()]])].filter(x=>!S.cmpInd.includes(x[0]));
 return [...inds,['AG.SRF.TOTL.K2',IBY['AG.SRF.TOTL.K2'].n[li()]]];}
const combo=(id,ph)=>`<span class="combo"><input id="${id}" class="cinp" placeholder="${esc(ph)}" autocomplete="off" aria-autocomplete="list"><span class="sugg" id="${id}-s" hidden></span></span>`;
function showSugg(inp){const id=inp.id,q=norm(inp.value.trim());const box=document.getElementById(id+'-s');let it=comboItems(id);if(q)it=it.filter(x=>norm(x[1]).includes(q));
 box.innerHTML=it.length?it.slice(0,12).map(x=>`<button type="button" data-pick="${id}" data-v="${esc(x[0])}">${esc(x[1])}</button>`).join(''):`<span class="note" style="padding:6px 10px;display:block">${tx('none')}</span>`;box.hidden=false;}
function pick(id,v){if(id==='addc'){if(S.sel.length<5&&!S.sel.includes(v))S.sel.push(v);}else if(id==='indc'){if(!S.cmpInd.includes(v))S.cmpInd.push(v);}else if(id==='ind')S.ind=v;else if(id==='xs')S.x=v;else if(id==='ys')S.y=v;render();setTimeout(()=>{const el=document.getElementById(id);if(el&&(id==='addc'||id==='indc'))el.focus();},0);}
document.addEventListener('input',e=>{if(e.target.classList.contains('cinp'))showSugg(e.target);});
document.addEventListener('focusin',e=>{if(e.target.classList.contains('cinp'))showSugg(e.target);});
document.addEventListener('keydown',e=>{if(!e.target.classList||!e.target.classList.contains('cinp'))return;const box=document.getElementById(e.target.id+'-s');
 if(e.key==='Enter'){const f=box&&box.querySelector('[data-pick]');if(f){e.preventDefault();pick(f.dataset.pick,f.dataset.v);}}else if(e.key==='Escape'){box.hidden=true;}else if(e.key==='ArrowDown'){const f=box&&box.querySelector('[data-pick]');if(f){e.preventDefault();f.focus();}}});

 Object.entries(GROUPS).forEach(([g,n])=>{if(!multi&&g==='atlas')return;const items=sideItems(g);const cnt=multi?items.filter(k=>S.cmpInd.includes(k)).length:scat?items.filter(k=>k===S.x||k===S.y).length:items.filter(k=>k===S.ind).length;

 const needA=S.cmpInd.some(k=>['atl_cur','atl_lang','atl_hp','atl_nb'].includes(k));const at=needA?atlas(isos).catch(()=>({})):Promise.resolve({});
 for(let i=0;i<codes.length;i+=8)await Promise.all(codes.slice(i,i+8).map(fetchOne));

async function viewTime(){$('#status').textContent=tx('loading');const s0=await series(S.ind,S.sel);$('#status').textContent='';const lo=+S.y0||1960,hi=+S.y1||9999;const s={};for(const k in s0)s[k]=s0[k].filter(p=>p[0]>=lo&&p[0]<=hi);

async function viewMap(){$('#status').textContent=tx('loading');const d=await latestAll(S.ind);$('#status').textContent='';
 const vals=Object.entries(d).filter(([k])=>!S.region||S.meta.by[k].region===S.region).map(r=>r[1][1]).sort((a,b)=>a-b);
 const PAL=['#f7fbff','#d6e6f4','#abd0e6','#6aaed6','#3787c0','#105ba4','#08306b'];const PALd=['#fde9c9','#fbc98a','#f6a35c','#e8783b','#c9512a','#9b2f1c','#651a12'];
 const pal=(IBY[S.ind].g==='env'&&S.ind.startsWith('EN.GHG'))||['SP.DYN.IMRT.IN','SP.DYN.CDRT.IN','FP.CPI.TOTL.ZG','SL.UEM.TOTL.ZS','SI.POV.DDAY','SI.POV.GINI'].includes(S.ind)?PALd:PAL;
 const q=i=>vals[Math.min(vals.length-1,Math.floor(i*vals.length/7))];const br=[1,2,3,4,5,6].map(i=>q(i/1));
 const cls=v=>{let c=0;while(c<6&&v>=br[c])c++;return c;};
 let g=`<svg viewBox="0 0 ${WORLD.w} ${WORLD.h}">`;WORLD.c.forEach(([iso,dd])=>{const v=d[iso];const inR=!S.region||(S.meta.by[iso]&&S.meta.by[iso].region===S.region);const fill=v&&inR?pal[cls(v[1])]:'var(--nodata)';g+=`<path d="${dd}" fill="${fill}" data-iso="${iso}" class="${S.sel.includes(iso)?'sel':''}" opacity="${inR?1:.35}"/>`;});g+='</svg>';
 const lim=[vals[0],...br,vals[vals.length-1]];
 MAINSEL().innerHTML=`<div class="card"><h3 style="margin:0 0 8px">${esc(IBY[S.ind].n[li()])}${unit(S.ind)?` (${esc(unit(S.ind))})`:''}</h3><div class="mapwrap" id="mapw">${g}</div>
  <div class="legend">${pal.map((c,i)=>`<span><i style="background:${c};border:1px solid var(--line)"></i>${fmt(S.ind,lim[i])} – ${fmt(S.ind,lim[i+1])}</span>`).join('')}<span><i style="background:var(--nodata)"></i>${tx('nodata')}</span></div><p class="note">${esc(tx('clickAdd'))}</p></div><p class="note">${esc(tx('src'))}</p>`;
 const tip=$('#tip');$('#mapw').addEventListener('mousemove',e=>{const p=e.target.closest('[data-iso]');if(!p||!S.meta.by[p.dataset.iso]){tip.hidden=true;return;}const v=d[p.dataset.iso];tip.hidden=false;tip.innerHTML=`<b>${esc(cname(p.dataset.iso))}</b><br>${v?fmtU(S.ind,v[1])+` (${v[0]})`:tx('nodata')}`;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';});
 $('#mapw').addEventListener('mouseleave',()=>tip.hidden=true);}
// ---------- ZALEŻNOŚCI ----------
const RCOL={};const RC=['#d1462f','#1f6fb2','#2e8b57','#b7791f','#7b3fa8','#0f8b8d','#c2185b','#6d4c41'];
async function viewScat(){$('#status').textContent=tx('loading');const[xd,yd,pd]=await Promise.all([latestAll(S.x),latestAll(S.y),latestAll('SP.POP.TOTL')]);$('#status').textContent='';
 const regs=[...new Set(S.meta.list.map(k=>S.meta.by[k].region))].sort();regs.forEach((r,i)=>RCOL[r]=RC[i%RC.length]);
 const pts=Object.keys(xd).filter(k=>yd[k]&&(!S.region||S.meta.by[k].region===S.region)&&(!S.logx||xd[k][1]>0)).map(k=>({k,x:xd[k][1],y:yd[k][1],p:pd[k]?pd[k][1]:1e6}));
 if(!pts.length){MAINSEL().innerHTML=`<div class="card">${tx('nodata')}</div>`;return;}
 const W=900,H=520,Lm=80,R=20,T=20,B=50;const fx=v=>S.logx?Math.log10(v):v;const xs=pts.map(p=>fx(p.x)),ys=pts.map(p=>p.y);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const X=v=>Lm+(fx(v)-x0)/(x1-x0||1)*(W-Lm-R),Y=v=>T+(y1-v)/(y1-y0||1)*(H-T-B);
 let g=`<svg viewBox="0 0 ${W} ${H}">`;
 for(let i=0;i<=5;i++){const v=y0+(y1-y0)*i/5;g+=`<line x1="${Lm}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".1"/><text x="${Lm-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="currentColor">${fmt(S.y,v)}</text>`;}
 const xt=S.logx?(()=>{const a=[];for(let e=Math.floor(x0);e<=Math.ceil(x1);e++)[1,2,5].forEach(m=>{const v=m*10**e;if(Math.log10(v)>=x0&&Math.log10(v)<=x1)a.push(v);});return a;})():[0,1,2,3,4,5].map(i=>{const v=x0+(x1-x0)*i/5;return v;});
 xt.forEach(v=>g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="currentColor" stroke-opacity=".08"/><text x="${X(v)}" y="${H-B+18}" text-anchor="middle" font-size="12" fill="currentColor">${fmt(S.x,v)}</text>`);
 g+=`<text x="${(Lm+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${esc(IBY[S.x].n[li()])}</text>`;
 pts.sort((a,b)=>b.p-a.p).forEach(p=>{const r=Math.max(3,Math.min(26,Math.sqrt(p.p/1e6)*1.6));const sel=S.sel.indexOf(p.k);g+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${r.toFixed(1)}" fill="${RCOL[S.meta.by[p.k].region]}" fill-opacity="${sel>=0?.95:.5}" stroke="${sel>=0?'var(--ink)':'none'}" stroke-width="2" data-iso="${p.k}"><title>${esc(cname(p.k))}: ${fmtU(S.x,p.x)}; ${fmtU(S.y,p.y)}</title></circle>`;});
 pts.filter(p=>S.sel.includes(p.k)).forEach(p=>g+=`<text x="${X(p.x)>W-140?X(p.x)-8:X(p.x)+8}" text-anchor="${X(p.x)>W-140?'end':'start'}" y="${Y(p.y)-8}" font-size="13" font-weight="700" fill="currentColor" paint-order="stroke" stroke="var(--paper)" stroke-width="3">${esc(cname(p.k))}</text>`);
 g+='</svg>';
 MAINSEL().innerHTML=`<div class="card chart"><h3 style="margin:0 0 8px">${esc(IBY[S.y].n[li()])} ↔ ${esc(IBY[S.x].n[li()])}</h3>${g}<div class="legend">${regs.map(r=>`<span><i style="background:${RCOL[r]}"></i>${esc(regName(r))}</span>`).join('')}</div><p class="note">${L==='pl'?'Wielkość kółka odpowiada liczbie ludności. Najedź na kółko, żeby zobaczyć państwo.':'Circle size shows population. Hover over a circle to see the country.'}</p></div><p class="note">${esc(tx('src'))}</p>`;}
// ---------- QUIZ ----------
const QI=['SP.POP.TOTL','NY.GDP.PCAP.PP.CD','SP.DYN.LE00.IN','SP.URB.TOTL.IN.ZS','SP.DYN.TFRT.IN','AG.SRF.TOTL.K2'];
async function viewQuiz(){$('#status').textContent=tx('loading');const D=await Promise.all(QI.map(c=>latestAll(c,true)));$('#status').textContent='';
 if(!S.q){const ok=S.meta.list.filter(k=>D.every(d=>d[k])&&D[0][k][1]>1e6);const k=ok[Math.floor(Math.random()*ok.length)];const same=ok.filter(x=>x!==k&&S.meta.by[x].region===S.meta.by[k].region).sort(()=>Math.random()-.5);
  const opts=[k,...same.slice(0,3)];while(opts.length<4){const x=ok[Math.floor(Math.random()*ok.length)];if(!opts.includes(x))opts.push(x);}S.q={k,opts:opts.sort(()=>Math.random()-.5),done:null};}
 const q=S.q;$('#app').innerHTML=`<div class="card quiz"><h3 style="margin:0">${tx('quizQ')} <span class="note">${tx('score')}: ${S.qs[0]} / ${S.qs[1]}</span></h3>
  <div class="clues"><div>${tx('reg')}<b style="font-size:1rem">${esc(regName(S.meta.by[q.k].region))}</b></div>${QI.map((c,i)=>`<div>${esc(IBY[c].n[li()])}<b>${fmtU(c,D[i][q.k][1])}</b><small class="note">${D[i][q.k][0]}</small></div>`).join('')}</div>
  <div class="opts">${q.opts.map(o=>`<button data-qa="${o}" class="${q.done?(o===q.k?'right':o===q.done?'wrong':''):''}" ${q.done?'disabled':''}>${esc(cname(o))}</button>`).join('')}</div>
  ${q.done?`<p class="fb ${q.done===q.k?'ok':'no'}">${q.done===q.k?tx('right'):tx('wrong')+' '+esc(cname(q.k))+'.'}</p><button class="btn primary" id="qnext">${tx('next')}</button>`:''}</div>`;}
// ---------- render ----------
let RT=0;
async function render(){const my=++RT;document.documentElement.lang=L;$('#t1').textContent=tx('t1');$('#t2').textContent=tx('t2');$$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
 $('#tabs').innerHTML=Object.entries(tx('tabs')).map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${n}</button>`).join('');
 if(!S.meta){$('#status').textContent=tx('loading');try{await loadMeta();}catch(e){$('#status').textContent='';$('#app').innerHTML=`<div class="err">${esc(tx('noconn'))}</div>`;return;}$('#status').textContent='';S.sel=S.sel.filter(k=>S.meta.by[k]);}
 topbar();save();
 const sideOld=document.getElementById('side');const scr=sideOld?sideOld.scrollTop:0;
 if(S.tab!=='quiz'){$('#app').innerHTML=`<div class="lay"><aside class="side" id="side" aria-label="${esc(tx('pickInd'))}">${sidebar()}</aside><div id="main"></div></div>`;document.getElementById('side').scrollTop=scr;}
 try{await ({cmp:viewCmp,time:viewTime,rank:viewRank,map:viewMap,scat:viewScat,quiz:viewQuiz}[S.tab])();}catch(e){console.error(e);if(my===RT){$('#status').textContent='';$('#app').innerHTML=`<div class="err">${esc(tx('noconn'))}</div>`;}}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-iso]');if(!b)return;
 if(b.dataset.lang){L=b.dataset.lang;render();}
 else if(b.dataset.tab){S.tab=b.dataset.tab;render();}
 else if(b.dataset.rm){S.sel=S.sel.filter(k=>k!==b.dataset.rm);render();}
 else if(b.dataset.pick){pick(b.dataset.pick,b.dataset.v);}
 else if(b.dataset.rmi){S.cmpInd=S.cmpInd.filter(k=>k!==b.dataset.rmi);render();}
 else if(b.dataset.addg){const g=b.dataset.addg;const ks=g==='*'?[...IND.filter(r=>r[1]!=='atlas').map(r=>r[0]),...ATL.map(a=>a[0])]:g==='atlas'?ATL.map(a=>a[0]):IND.filter(r=>r[1]===g).map(r=>r[0]);ks.forEach(k=>{if(!S.cmpInd.includes(k))S.cmpInd.push(k);});render();}
 else if(b.dataset.clri){S.cmpInd=[];render();}
 else if(b.dataset.ax){S[b.dataset.ax]=b.dataset.k;render();}
 else if(b.dataset.openall!=null){S.open=b.dataset.openall==='1'?Object.keys(GROUPS):[];$$('#side details').forEach(d=>d.open=b.dataset.openall==='1');save();}
 else if(b.id==='yrLatest'){S.year='';render();}
 else if(b.id==='showAll'){S.showAll=!S.showAll;render();}
 else if(b.dataset.qa&&S.q&&!S.q.done){S.q.done=b.dataset.qa;S.qs[1]++;if(b.dataset.qa===S.q.k)S.qs[0]++;render();}
 else if(b.id==='qnext'){S.q=null;render();}
 else if(b.dataset.iso&&S.meta&&S.meta.by[b.dataset.iso]&&S.tab!=='quiz'){const k=b.dataset.iso;if(S.sel.includes(k))S.sel=S.sel.filter(x=>x!==k);else if(S.sel.length<5)S.sel.push(k);render();}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.g){const g=d.dataset.g;S.open=S.open.filter(x=>x!==g);if(d.open)S.open.push(g);save();}},true);
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(e.target.dataset.ci){const k=e.target.dataset.ci;if(e.target.checked){if(!S.cmpInd.includes(k))S.cmpInd.push(k);}else S.cmpInd=S.cmpInd.filter(x=>x!==k);render();return;}if(e.target.dataset.si){S.ind=e.target.dataset.si;render();return;}if(id==='year'){const y=parseInt(v,10);S.year=y>=1960&&y<=2030?String(y):'';render();}else if(id==='y0'){S.y0=parseInt(v,10)||1960;render();}else if(id==='y1'){const y=parseInt(v,10);S.y1=y>=1960?y:'';render();}else if(id==='logx'){S.logx=e.target.checked;render();}else if(id==='region'){S.region=v;render();}});
render();

</script>

<style>
:root{--bg:#edf0f5;--paper:#fbfcfe;--ink:#18202e;--muted:#5a6476;--line:#d1d7e2;--soft:#e4e8f0;--acc:#1f3f8a;--acc-t:#1f3f8a;--acc-ink:#fff;--sea:#dfe8f3;--land:#ffffff;--ctx:#e7e7e7;--border:#7b8496;--sel:#f2b705;--focus:#c2571a;
--nato:#8fb6e6;--ue:#c99a00;--sch:#2b8a57;--eur:#7b2e8e;--eout:#b06fc2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--paper:#181e29;--ink:#e3e8f0;--muted:#9aa4b6;--line:#2c3443;--soft:#202838;--acc:#5f7fd6;--acc-t:#a9bdf5;--sea:#152132;--land:#2a3343;--ctx:#1d232e;--border:#6f7a8e;--nato:#3d6db3;--ue:#e0b42a;--sch:#4cc283;--eur:#c27ad6;--eout:#d9a6e6;--focus:#f0a36a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--paper:#181e29;--ink:#e3e8f0;--muted:#9aa4b6;--line:#2c3443;--soft:#202838;--acc:#5f7fd6;--acc-t:#a9bdf5;--sea:#152132;--land:#2a3343;--ctx:#1d232e;--border:#6f7a8e;--nato:#3d6db3;--ue:#e0b42a;--sch:#4cc283;--eur:#c27ad6;--eout:#d9a6e6;--focus:#f0a36a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.015em;line-height:1.15}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800}header p{margin:2px 0 0;color:var(--muted)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.9rem;border:0;background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 16px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;margin-top:18px;align-items:start}
.mapbox{background:var(--sea);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.ct{fill:var(--land);stroke:var(--border);stroke-width:.6;cursor:pointer;transition:fill .15s}
.ct:hover{fill:color-mix(in srgb,var(--sel) 35%,var(--land))}
.ct.on{fill:var(--sel)}
.cx{fill:var(--ctx);stroke:var(--border);stroke-width:.4;opacity:.8}
.dot{fill:var(--land);stroke:var(--ink);stroke-width:1.2;cursor:pointer}.dot.on{fill:var(--sel)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.85rem;padding:3px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%)}
aside.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;position:sticky;top:14px}
aside.panel select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.cn{display:flex;gap:14px;align-items:center;margin:16px 0 4px}
.flag{width:84px;height:56px;object-fit:contain;flex:none;border-radius:4px;background:var(--soft);display:grid;place-items:center;font-size:2.6rem;line-height:1;overflow:hidden}
.flag img{width:100%;height:100%;object-fit:cover}
.cn h2{margin:0;font-size:1.7rem}
.full{margin:0 0 10px;color:var(--muted);font-style:italic}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
dl.facts dt{color:var(--muted);font-size:.9rem}dl.facts dd{margin:0;font-weight:700}
dl.facts dd small{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chip{font-size:.82rem;border-radius:999px;padding:2px 10px;border:1.5px solid var(--line)}
.chip.y{border-color:transparent;color:#fff}
.src{font-size:.8rem;color:var(--muted);margin-top:14px}
.empty{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
/* warstwy */
.layers{display:grid;gap:8px;margin:0}
.layers label{display:grid;grid-template-columns:auto 34px 1fr auto;gap:10px;align-items:center;cursor:pointer;padding:6px 8px;border-radius:10px}
.layers label:hover{background:var(--soft)}
.layers input{width:18px;height:18px;accent-color:var(--acc)}
.sw{width:34px;height:22px;border-radius:5px;border:1.5px solid var(--border)}
.cnt{font-size:.85rem;color:var(--muted)}
.mode{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.mode button{font:inherit;font-size:.88rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px}
.mode button[aria-pressed=true]{border-color:var(--acc);color:var(--acc-t);font-weight:700;background:var(--soft)}
.mlist{margin:12px 0 0;font-size:.9rem}
.mlist h3{font-size:1rem;margin:12px 0 4px}
.mlist p{margin:0}
.yes{color:var(--sch);font-weight:700}.no{color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:1fr}aside.panel{position:static}.hr{align-items:flex-start}}
</style>

async function getJSON(u,ms=10000){const c=new AbortController();const tm=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal,headers:{Accept:'application/sparql-results+json, application/json'}});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(tm);}}
const sparql=(q,ms)=>getJSON('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q),ms);
// Zapytania dla wybranych państw. sel wiąże ?iso i ?c: jedno państwo albo VALUES z wieloma.
// q1 i q2 są szybkie także dla wszystkich państw naraz; q3 (piastujący urzędy) jest wolne, więc idzie tylko dla jednego państwa.
function liveQueries(sel,lg){
  const lang=lg==='pl'?'pl,en':'en';
  return [`SELECT ?iso ?capL ?hosL ?hosR ?hogL ?hogR ?govL ?flag ?off ?offEn ?art WHERE{${sel}
   OPTIONAL{?c wdt:P36 ?cap} OPTIONAL{?c p:P35 ?s1. ?s1 ps:P35 ?hos; wikibase:rank ?hosR. FILTER NOT EXISTS{?s1 pq:P582 ?e1}} OPTIONAL{?c p:P6 ?s2. ?s2 ps:P6 ?hog; wikibase:rank ?hogR. FILTER NOT EXISTS{?s2 pq:P582 ?e2}} OPTIONAL{?c wdt:P122 ?gov} OPTIONAL{?c wdt:P41 ?flag}
   OPTIONAL{?c wdt:P1448 ?off FILTER(lang(?off)="${lg}")} OPTIONAL{?c wdt:P1448 ?offEn FILTER(lang(?offEn)="en")}
   OPTIONAL{?art schema:about ?c; schema:isPartOf <https://${lg}.wikipedia.org/>}
   SERVICE wikibase:label{bd:serviceParam wikibase:language "${lang}". ?cap rdfs:label ?capL. ?hos rdfs:label ?hosL. ?hog rdfs:label ?hogL. ?gov rdfs:label ?govL.}}`,
  `SELECT ?iso ?pop ?pd WHERE{${sel} ?c p:P1082 ?st. ?st ps:P1082 ?pop. OPTIONAL{?st pq:P585 ?pd}}`,
  `SELECT ?iso ?kind ?hL ?start WHERE{${sel} {?c wdt:P1906 ?of. BIND("hos" AS ?kind)} UNION {?c wdt:P1313 ?of. BIND("hog" AS ?kind)}
   ?of p:P1308 ?st. ?st ps:P1308 ?h. FILTER NOT EXISTS{?st pq:P582 ?e} OPTIONAL{?st pq:P580 ?start}
   SERVICE wikibase:label{bd:serviceParam wikibase:language "${lang}". ?h rdfs:label ?hL.}} ORDER BY DESC(?start)`];
}
const isLabel=v=>v&&!/^Q\d+$/.test(v);
// Wyniki q1 i q2 -> {iso: dane}
function digest(r1,r2){
  const group=r=>{const m={};if(r)for(const x of r.results.bindings)(m[x.iso.value]=m[x.iso.value]||[]).push(x);return m;};
  const B1=group(r1),B2=group(r2),res={};
  for(const iso in B1){
    const b=B1[iso];
    const uniq=(k,rows=b)=>[...new Set(rows.map(x=>x[k]&&x[k].value).filter(isLabel))];
    // gdy któryś wpis o przywódcy ma rangę „preferowana”, to on jest aktualny
    const head=(k,r)=>{const pref=b.filter(x=>x[r]&&/PreferredRank$/.test(x[r].value));return uniq(k,pref.length?pref:b);};
    // najnowsza liczba ludności (wpisy z datą wygrywają z wpisami bez daty)
    const p=(B2[iso]||[]).reduce((best,x)=>!best||(x.pd&&(!best.pd||x.pd.value>best.pd.value))?x:best,null);
    res[iso]={cap:uniq('capL'),hos:head('hosL','hosR'),hog:head('hogL','hogR'),gov:uniq('govL'),flag:uniq('flag')[0],off:uniq('off')[0]||null,offEn:uniq('offEn')[0],art:uniq('art')[0],
      pop:p?+p.pop.value:null,pd:p&&p.pd?p.pd.value.slice(0,4):null};
  }
  return res;
}
// Dane z poprzedniej wizyty – pokazywane od razu, zanim przyjdą świeże.
const LIVE_KEY=lg=>'euLive_'+lg;
const saveLive=lg=>{const m={};for(const iso in BY){const v=S.cache[iso+'|'+lg];if(v)m[iso]=v;}try{localStorage.setItem(LIVE_KEY(lg),JSON.stringify({t:Date.now(),m}));}catch(e){}};
for(const lg of ['pl','en']){try{const d=JSON.parse(localStorage.getItem(LIVE_KEY(lg))||'null');if(d&&d.m)for(const iso in d.m)S.cache[iso+'|'+lg]=d.m[iso];}catch(e){}}
// Jedno zbiorcze pobranie (q1 + q2) dla wszystkich państw na mapie, osobno dla każdego języka.
const BATCH={},RETRIED={};
function fetchAll(lg){
  if(BATCH[lg])return BATCH[lg];
  const isos=Object.keys(BY);
  const [q1,q2]=liveQueries(`VALUES ?iso {${isos.map(i=>'"'+i+'"').join(' ')}} ?c wdt:P297 ?iso.`,lg);
  BATCH[lg]=Promise.all([sparql(q1,45000),sparql(q2,45000).catch(()=>null)]).then(([r1,r2])=>{
    const m=digest(r1,r2);
    for(const iso of isos){
      const key=iso+'|'+lg,old=S.cache[key],v=m[iso]||null;
      // przywódcy już sprawdzeni dokładniej (q3) w tej sesji zostają
      if(v&&old&&S.exact[key]){v.hos=old.hos;v.hog=old.hog;}
      S.cache[key]=v;S.fresh[key]=true;
    }
    saveLive(lg);S.online=true;
    if(L===lg&&S.sel&&S.tab==='info')infoPanel();
    return m;
  });
  // nieudane pobranie: jedna ponowna próba po chwili
  BATCH[lg].catch(()=>{BATCH[lg]=null;if(!RETRIED[lg]){RETRIED[lg]=true;setTimeout(()=>fetchAll(lg).catch(()=>{}),3000);}});
  return BATCH[lg];
}
async function live(iso){
  const lg=L,key=iso+'|'+lg;
  // czekamy na pobranie zbiorcze najwyżej 6 s – potem pytamy tylko o to państwo
  if(!S.fresh[key]){try{await Promise.race([fetchAll(lg),new Promise(r=>setTimeout(r,6000))]);}catch(e){}}
  if(S.fresh[key]){if(!S.cache[key])throw new Error('none');return S.cache[key];}
  // zapas, gdy pobranie zbiorcze się nie udało: zapytanie tylko o to państwo
  const [q1,q2]=liveQueries(`BIND("${iso}" AS ?iso) ?c wdt:P297 ?iso.`,lg);
  const [r1,r2]=await Promise.all([sparql(q1),sparql(q2).catch(()=>null)]);
  const out=digest(r1,r2)[iso];if(!out)throw new Error('none');
  S.cache[key]=out;S.fresh[key]=true;saveLive(lg);return out;
}
// W tle: dokładniejsze sprawdzenie przywódców (urząd -> osoba piastująca) dla klikniętego państwa.
const EXACT={};
function refineLeaders(iso){
  const lg=L,key=iso+'|'+lg;
  if(S.exact[key]||EXACT[key])return;
  const q3=liveQueries(`BIND("${iso}" AS ?iso) ?c wdt:P297 ?iso.`,lg)[2];
  EXACT[key]=sparql(q3,60000).then(r=>{
    const rows=r.results.bindings,D=S.cache[key];
    const holder=k=>{const x=rows.find(b=>b.kind.value===k&&b.hL&&isLabel(b.hL.value));return x?[x.hL.value]:null;};
    S.exact[key]=true;
    if(!D)return;
    const hos=holder('hos')||D.hos,hog=holder('hog')||D.hog;
    if(hos.join()===D.hos.join()&&hog.join()===D.hog.join())return;
    S.cache[key]={...D,hos,hog};saveLive(lg);
    if(S.sel===iso&&L===lg&&S.tab==='info')infoPanel();
  }).catch(()=>{}).finally(()=>{delete EXACT[key];});
}

function memPanel(){

  let h=`<div class="layers">${Object.keys(LAYERS).map(k=>`<label><input type="checkbox" data-lay="${k}" ${S.lay[k]?'checked':''}><span class="sw" style="${sw(k)}"></span><span>${esc(LAYERS[k][L])}</span><span class="cnt">${cnt(k)}</span></label>`).join('')}</div>
   <div class="mode" role="group"><button data-mode="over" aria-pressed="${S.mode==='over'}">${t('mode1')}</button><button data-mode="inter" aria-pressed="${S.mode==='inter'}">${t('mode2')}</button></div><div class="mlist">`;
  if(S.sel){const c=BY[S.sel];h+=`<h3>${esc(c[L])}</h3>`+Object.keys(LAYERS).map(k=>`<p>${SETS[k].has(S.sel)?`<span class="yes">✓</span>`:`<span class="no">✕</span>`} ${esc(LAYERS[k][L])}</p>`).join('');}else h+=`<p class="empty">${t('click')}</p>`;
  if(S.mode==='inter'&&on.length){const inter=MAIN.filter(c=>on.every(k=>SETS[k].has(c.iso))).map(c=>c[L]).sort((a,b)=>a.localeCompare(b,L));h+=`<h3>${t('inter')} (${inter.length})</h3><p>${inter.length?esc(inter.join(', ')):t('none')}</p>`;}
  else on.forEach(k=>{const m=MAIN.filter(c=>SETS[k].has(c.iso)).map(c=>c[L]).sort((a,b)=>a.localeCompare(b,L));h+=`<h3>${esc(LAYERS[k][L])} – ${t('cnt')(m.length)} ${t('onmap')}</h3><p>${esc(m.join(', '))}</p>${LAYERS[k].extra?`<p class="note">${esc(LAYERS[k].extra[L==='pl'?0:1])}</p>`:''}`;});
  h+=`<p class="src">${t('state')}: ${DATA_DATE[L]}</p></div>`;
  $('#panel').innerHTML=h;
}
function render(){header();paint();S.tab==='info'?infoPanel():memPanel();}
// ---------- zdarzenia ----------
const mb=$('#mapbox'),tip=$('#tip');
mb.addEventListener('mousemove',e=>{const el=e.target.closest('[data-iso]');if(!el){tip.hidden=true;return;}const r=mb.getBoundingClientRect();tip.hidden=false;tip.textContent=nameOf(el.dataset.iso);tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';});
mb.addEventListener('mouseleave',()=>tip.hidden=true);
mb.addEventListener('click',e=>{const el=e.target.closest('[data-iso]');if(!el)return;S.sel=S.sel===el.dataset.iso?null:el.dataset.iso;render();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){L=b.dataset.lang;try{localStorage.setItem('euLang',L);}catch(_){}fetchAll(L).catch(()=>{});render();}
  else if(b.dataset.tab){S.tab=b.dataset.tab;render();}
  else if(b.dataset.mode){S.mode=b.dataset.mode;render();}});
document.addEventListener('change',e=>{if(e.target.id==='csel'){S.sel=e.target.value||null;render();}else if(e.target.dataset.lay){S.lay[e.target.dataset.lay]=e.target.checked;render();}});
drawMap();render();
fetchAll(L).catch(()=>{});
// ---------- próba aktualizacji członkostwa z Wikidata (NATO i UE) ----------
(async()=>{try{for(const [k,q] of [['nato','Q7184'],['ue','Q458']]){const r=await sparql(`SELECT DISTINCT ?iso WHERE{?c p:P463 ?st. ?st ps:P463 wd:${q}. FILTER NOT EXISTS{?st pq:P582 ?e} ?c wdt:P297 ?iso.}`);
  const s=new Set(r.results.bindings.map(b=>b.iso.value).filter(i=>BY[i]));const old=SETS[k];const same=[...s].filter(i=>old.has(i)).length;
  if(s.size&&Math.abs(s.size-old.size)<=2&&same>=old.size-2){SETS[k]=s;}}
  if(S.tab==='mem')render();}catch(e){}})();

</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Układ Słoneczny i Wszechświat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f5;--paper:#fcfcfe;--ink:#161a26;--muted:#5a6072;--line:#d3d7e2;--soft:#e5e8f1;--acc:#2b4fa3;--acc-t:#2b4fa3;--acc-ink:#fff;--ok:#2e7d4f;--no:#b4432a;--focus:#c2571a;--space:#090d18;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--paper:#171b26;--ink:#e4e7f0;--muted:#9aa1b5;--line:#2b3142;--soft:#1f2432;--acc:#5a82d8;--acc-t:#9db8f0;--acc-ink:#0c1222;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;--space:#05070d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131b;--paper:#171b26;--ink:#e4e7f0;--muted:#9aa1b5;--line:#2b3142;--soft:#1f2432;--acc:#5a82d8;--acc-t:#9db8f0;--acc-ink:#0c1222;--ok:#5cc28a;--no:#f08a70;--focus:#f0a36a;--space:#05070d;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:-.015em;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800}header p{margin:2px 0 0;color:var(--muted)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.9rem;border:0;background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 15px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-size:.95rem;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px}
.note{font-size:.88rem;color:var(--muted)}
/* pasek z planetami */
.space{margin-top:18px;background:var(--space);border-radius:18px;padding:12px 12px 6px;color:#e9ecf5}
.space svg{display:block;width:100%;height:auto}
.space .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:720px){.space .scroll svg{min-width:680px}}
.space .bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:2px 6px 6px;font-size:.9rem}
.space label{display:flex;gap:7px;align-items:center;cursor:pointer}
.space input{accent-color:#f2b632;width:17px;height:17px}
.space .snote{margin:2px 6px 6px;font-size:.8rem;color:#a9b0c6}
.pl{cursor:pointer}.pl:focus{outline:none}.pl:focus-visible .hit{stroke:#f2b632;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;display:flex;gap:6px;align-items:center}
.chips button i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chips button[aria-pressed=true]{border-color:var(--acc);background:var(--soft);color:var(--acc-t)}
/* karta planety */
.pcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
.phead{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.phead svg{flex:none}
.phead h2{margin:0;font-size:2rem;font-weight:800}
.phead small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.75rem}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:0;margin:10px 0 0;border-top:1px solid var(--line)}
dl.facts dt,dl.facts dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0}
dl.facts dt{color:var(--muted);font-size:.9rem;padding-right:14px}
dl.facts dd{font-weight:700}
dl.facts dd small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.pcard h3{margin:0 0 6px;font-size:1.1rem}
.pcard p{margin:0 0 12px}
ul.fun{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.fun li{background:var(--soft);border-radius:12px;padding:10px 12px}
ul.fun li::before{content:"✨ "}
/* porównanie */
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th button{font:inherit;font-weight:700;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
th button[data-on]{color:var(--acc-t)}
td .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.calc{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin:10px 0}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
.calc input{width:120px}
/* wszechświat */
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.ladder li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:9px 12px}
.ladder li b{display:block}
.ladder .ic{font-size:1.6rem;text-align:center}
.ladder li:not(:last-child){position:relative}
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ucard h3{margin:0 0 8px;font-size:1.25rem;display:flex;gap:8px;align-items:center}
.ucard p{margin:0 0 10px}.ucard p:last-child{margin-bottom:0}
.ucard ul{margin:0 0 10px;padding-left:20px}.ucard li{margin:4px 0}
/* quiz */
.q{font-size:1.25rem;font-weight:700;margin:4px 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center}
.opts button:hover:not(:disabled){border-color:var(--acc)}
.opts button:disabled{cursor:default}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opts button.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.opts button small{display:block;font-weight:400;color:var(--muted)}
.fb{margin-top:14px;font-weight:700}
.score{color:var(--muted);font-size:.95rem}
@media (max-width:820px){.pcard,.ugrid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.hr{align-items:flex-start}}
</style>
</head>

 {id:'venus',n:['Wenus','Venus'],type:'rock',diam:12104,mass:0.815,dist:108.2,year:224.7,day:5832.5,tilt:177.4,temp:464,g:8.9,moons:0,col:['#f3dca2','#c4914a'],

 {id:'earth',n:['Ziemia','Earth'],type:'rock',diam:12756,mass:1,dist:149.6,year:365.25,day:23.93,tilt:23.4,temp:15,g:9.8,moons:1,col:['#7fb8f0','#1f4f99'],

 {id:'jupiter',n:['Jowisz','Jupiter'],type:'gas',diam:142984,mass:317.8,dist:778.5,year:4331,day:9.93,tilt:3.1,temp:-110,g:23.1,moons:95,col:['#f1d3ad','#a8774f'],

 {id:'saturn',n:['Saturn','Saturn'],type:'gas',diam:120536,mass:95.2,dist:1432.0,year:10747,day:10.66,tilt:26.7,temp:-140,g:9.0,moons:274,col:['#f6e2ad','#b8955a'],

// ---------- pasek z planetami (SVG) ----------
function grad(o){return `<radialGradient id="g-${o.id}" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="${o.col[0]}"/><stop offset="1" stop-color="${o.col[1]}"/></radialGradient>`;}
function bands(o,cx,cy,r){
  if(o.id!=='jupiter'&&o.id!=='saturn')return '';
  const ys=o.id==='jupiter'?[-.55,-.25,.1,.4]:[-.4,0,.35];
  return `<g clip-path="url(#c-${o.id})" opacity=".28">${ys.map((y,i)=>`<rect x="${cx-r}" y="${cy+y*r}" width="${2*r}" height="${r*(i%2?.12:.18)}" fill="#7a4a24"/>`).join('')}${o.id==='jupiter'?`<ellipse cx="${cx+r*.3}" cy="${cy+r*.28}" rx="${r*.17}" ry="${r*.1}" fill="#a2391d" opacity="1"/>`:''}</g>`;
}
function planetSVG(o,cx,cy,r,big){
  const ring=o.id==='saturn';
  const back=ring?`<ellipse cx="${cx}" cy="${cy}" rx="${r*2.15}" ry="${r*.48}" fill="none" stroke="#d9c58f" stroke-width="${Math.max(1,r*.22)}" opacity=".85"/>`:'';
  const front=ring?`<path d="M ${cx-r*2.15} ${cy} A ${r*2.15} ${r*.48} 0 0 0 ${cx+r*2.15} ${cy}" fill="none" stroke="#e8d7a6" stroke-width="${Math.max(1,r*.22)}"/>`:'';
  return `${back}<clipPath id="c-${o.id}${big?'b':''}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#g-${o.id})"/>${big?'':bands(o,cx,cy,r)}${front}`;
}
function strip(){
  const W=1000,H=250,cy=112,start=78,end=W-14;
  const unit=S.scale?44/142984:0;
  const rr=p=>S.scale?Math.max(.8,p.diam*unit):6+34*Math.sqrt(p.diam/142984);
  const ext=p=>p.id==='saturn'?rr(p)*2.15:rr(p);
  const sum=PLANETS.reduce((a,p)=>a+2*ext(p),0);
  let gap=(end-start-sum)/(PLANETS.length-1), k=1;
  if(gap<10){k=(end-start-10*(PLANETS.length-1))/sum;gap=10;}
  const sunR=S.scale?SUN.diam*unit*k:230;
  let x=start, g='';
  // gwiazdy w tle (zawsze te same)
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<70;i++)g+=`<circle cx="${(rnd()*W).toFixed(1)}" cy="${(rnd()*H).toFixed(1)}" r="${(rnd()*1.1+.2).toFixed(2)}" fill="#fff" opacity="${(rnd()*.6+.2).toFixed(2)}"/>`;
  const sunSel=S.sel==='sun';
  g+=`<g class="pl" data-p="sun" tabindex="0" role="button" aria-label="${esc(T(SUN.n))}"><circle cx="${start-14-sunR}" cy="${cy}" r="${sunR+18}" fill="#ffb238" opacity=".14"/><circle class="hit" cx="${start-14-sunR}" cy="${cy}" r="${sunR}" fill="url(#g-sun)" ${sunSel?'stroke="#fff" stroke-width="2.5" stroke-dasharray="6 5"':''}/></g>`;
  g+=`<text x="14" y="28" fill="#ffd27a" font-size="18" font-weight="${sunSel?800:700}">${esc(T(SUN.n))}</text>`;
  for(const p of PLANETS){
    const r=rr(p)*k,e=ext(p)*k,cx=x+e,sel=S.sel===p.id;
    g+=`<g class="pl" data-p="${p.id}" tabindex="0" role="button" aria-label="${esc(T(p.n))}"><circle class="hit" cx="${cx}" cy="${cy}" r="${Math.max(r+6,18)}" fill="transparent" ${sel?'stroke="#f2b632" stroke-width="2.5" stroke-dasharray="5 4"':''}/>${planetSVG(p,cx,cy,r)}
      <text x="${cx}" y="${H-14}" text-anchor="middle" fill="${sel?'#ffd27a':'#d7dcec'}" font-size="17" font-weight="${sel?800:600}">${esc(T(p.n))}</text></g>`;
    x+=2*e+gap;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr('Planety Układu Słonecznego','The planets of the Solar System'))}"><defs>${PLANETS.map(grad).join('')}${grad(SUN)}</defs>${g}</svg>`;
}

// ---------- formatowanie ----------
const lightTime=dist=>{const m=dist*1e6/C_KMS/60;return m<60?`${NF(m,1)} min`:`${Math.floor(m/60)} h ${Math.round(m%60)} min`;};
const temp=t=>`${t>0?'+':''}${NF(t)} °C`;
const moonsTxt=n=>L==='en'?(n===1?'1 moon':`${n} moons`):(n===1?'1 księżyc':(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?`${n} księżyce`:`${n} księżyców`);

function planetCard(){
  if(S.sel==='sun')return sunCard();
  const p=PLANETS.find(x=>x.id===S.sel);

  const row=(k,v,sub)=>`<dt>${k}</dt><dd>${v}${sub?`<small>${sub}</small>`:''}</dd>`;
  const order=PLANETS.indexOf(p)+1;
  return `<section class="card pcard"><div>
   <div class="phead">${big}<div><small>${esc(T(TYPE[p.type]))} · ${tr(`${order}. planeta od Słońca`,`planet no. ${order} from the Sun`)}</small><h2>${esc(T(p.n))}</h2></div></div>
   <dl class="facts">
    ${row(tr('Rok (obieg wokół Słońca)','Year (one orbit of the Sun)'),esc(T(p.yearS)))}
    ${row(tr('Doba (obrót wokół osi)','Day (one spin on its axis)'),esc(T(p.dayS)),p.dayN?esc(T(p.dayN)):'')}
    ${row(tr('Średnica','Diameter'),`${NF(p.diam)} km`,p.id==='earth'?'':`${NF(p.diam/EARTH_D,2)} × ${tr('średnica Ziemi','Earth’s diameter')}`)}
    ${row(tr('Masa','Mass'),`${NF(p.mass,3)} × ${tr('masa Ziemi','Earth’s mass')}`)}
    ${row(tr('Średnia odległość od Słońca','Average distance from the Sun'),`${NF(p.dist,1)} ${tr('mln km','million km')} (${NF(p.dist/AU,2)} AU)`,tr(`Światło ze Słońca leci tu ${lightTime(p.dist)}.`,`Sunlight takes ${lightTime(p.dist)} to get here.`))}
    ${row(tr('Nachylenie osi','Axial tilt'),`${NF(p.tilt,p.tilt<1?2:1)}°`)}
    ${row(tr('Średnia temperatura','Average temperature'),temp(p.temp),p.type==='rock'?'':tr('W górnych warstwach atmosfery – te planety nie mają powierzchni.','In the upper atmosphere – these planets have no solid surface.'))}
    ${row(tr('Grawitacja','Gravity'),`${NF(p.g,1)} m/s²`,tr(`${NF(p.g/9.8*100)}% ziemskiej`,`${NF(p.g/9.8*100)}% of Earth’s`))}
    ${row(tr('Księżyce','Moons'),p.moons?moonsTxt(p.moons):tr('brak','none'),p.mn?esc(T(p.mn)):'')}
   </dl></div>
   <div><h3>${tr('Budowa i skład','Structure and composition')}</h3><p>${esc(T(p.comp))}</p>
   <h3>${tr('Atmosfera','Atmosphere')}</h3><p>${esc(T(p.atm))}</p>
   <h3>${tr('Ciekawostki','Fun facts')}</h3><ul class="fun">${p.facts.map(f=>`<li>${esc(T(f))}</li>`).join('')}</ul></div></section>`;
}

  ['Los gwiazdy zależy od jej masy. Gwiazdy takie jak Słońce pod koniec życia puchną do czerwonego olbrzyma, a potem zostaje z nich biały karzeł. Bardzo masywne gwiazdy kończą wybuchem supernowej, po którym zostaje gwiazda neutronowa albo czarna dziura.','A star’s fate depends on its mass. Stars like the Sun swell into red giants near the end of their lives and then leave behind a white dwarf. Very massive stars end in a supernova explosion, leaving a neutron star or a black hole.'],
  ['Słońce to żółty karzeł w połowie życia: świeci od ok. 4,6 mld lat i będzie świecić jeszcze ok. 5 mld lat.','The Sun is a middle-aged yellow dwarf: it has been shining for about 4.6 billion years and will go on for about another 5 billion.']]},
 {i:'✨',t:['Gromady gwiazd','Star clusters'],p:[
  ['Gwiazdy często rodzą się w grupach. Gromady otwarte są młode i luźne – liczą od kilkudziesięciu do kilku tysięcy gwiazd. Najsłynniejsza to Plejady, które zimą widać gołym okiem.','Stars are often born in groups. Open clusters are young and loose, with anywhere from a few dozen to a few thousand stars. The most famous is the Pleiades, visible to the naked eye in winter.'],
  ['Gromady kuliste są bardzo stare i ciasno upakowane: setki tysięcy gwiazd ułożonych w kształt kuli. Krążą wokół środka galaktyki.','Globular clusters are very old and tightly packed: hundreds of thousands of stars in a ball shape. They orbit the centre of the galaxy.'],
  ['Gromada gwiazd to coś innego niż gwiazdozbiór. Gwiazdozbiór (np. Orion) to tylko układ gwiazd widziany z Ziemi – w rzeczywistości mogą one leżeć bardzo daleko od siebie.','A star cluster isn’t the same as a constellation. A constellation (such as Orion) is just a pattern of stars as seen from Earth – in reality they can be very far apart.']]},
 {i:'🪐',t:['Układy planetarne','Planetary systems'],p:[
  ['Układ planetarny to gwiazda i wszystko, co krąży wokół niej: planety, księżyce, planetoidy i komety.','A planetary system is a star and everything that orbits it: planets, moons, asteroids and comets.'],
  ['Układ Słoneczny powstał ok. 4,6 mld lat temu z wirującego obłoku gazu i pyłu. W jego środku powstało Słońce, a z pozostałego materiału – planety.','The Solar System formed about 4.6 billion years ago from a spinning cloud of gas and dust. The Sun formed at its centre and the planets formed from the leftover material.'],
  ['Planety krążące wokół innych gwiazd to egzoplanety. Pierwsze odkrył w 1992 roku polski astronom Aleksander Wolszczan (krążyły wokół pulsara). Dziś znamy ich ponad 6000 (stan na 2025 r.).','Planets orbiting other stars are called exoplanets. The first were discovered in 1992 by the Polish astronomer Aleksander Wolszczan (they orbit a pulsar). Today more than 6,000 are known (as of 2025).']]},
 {i:'🌍',t:['Planety','Planets'],p:[
  ['Według definicji z 2006 roku planeta krąży wokół Słońca, jest na tyle masywna, że ma kształt zbliżony do kuli, i „oczyściła” okolice swojej orbity z innych ciał.','According to the 2006 definition, a planet orbits the Sun, is massive enough to be roughly round, and has “cleared” its orbit of other objects.'],
  ['Planety skaliste (Merkury, Wenus, Ziemia, Mars) są małe i mają twardą powierzchnię. Gazowe olbrzymy (Jowisz, Saturn) to głównie wodór i hel. Lodowe olbrzymy (Uran, Neptun) zawierają dużo wody, amoniaku i metanu.','Rocky planets (Mercury, Venus, Earth, Mars) are small with solid surfaces. Gas giants (Jupiter, Saturn) are mostly hydrogen and helium. Ice giants (Uranus, Neptune) contain lots of water, ammonia and methane.'],
  ['Planety nie świecą własnym światłem – widzimy je, bo odbijają światło Słońca.','Planets don’t give off their own light – we see them because they reflect sunlight.']]},
 {i:'🥔',t:['Planety karłowate','Dwarf planets'],p:[
  ['Planeta karłowata spełnia dwa pierwsze warunki, ale nie „oczyściła” swojej orbity. Uznane planety karłowate to Ceres (w pasie planetoid), Pluton, Eris, Haumea i Makemake.','A dwarf planet meets the first two conditions but hasn’t “cleared” its orbit. The recognised dwarf planets are Ceres (in the asteroid belt), Pluto, Eris, Haumea and Makemake.'],
  ['Pluton był uznawany za dziewiątą planetę do 2006 roku. Jest mniejszy od naszego Księżyca, ma pięć księżyców, a na jego powierzchni jest lodowa równina w kształcie serca.','Pluto was counted as the ninth planet until 2006. It’s smaller than our Moon, has five moons, and has a heart-shaped icy plain on its surface.']]},
 {i:'🌙',t:['Księżyce','Moons'],p:[
  ['Księżyc to naturalny satelita – ciało krążące wokół planety lub innego ciała. W Układzie Słonecznym znamy ich ponad 400, a niektóre są większe od Merkurego (Ganimedes, Tytan).','A moon is a natural satellite – a body that orbits a planet or another object. More than 400 are known in the Solar System, and some are bigger than Mercury (Ganymede, Titan).'],
  ['Nasz Księżyc jest zawsze zwrócony do Ziemi tą samą stroną, bo obraca się wokół osi w tym samym czasie, w którym okrąża Ziemię (ok. 27,3 doby).','Our Moon always shows Earth the same face, because it spins once on its axis in the same time it takes to orbit Earth (about 27.3 days).'],
  ['Pod lodową skorupą Europy (księżyca Jowisza) i Enceladusa (księżyca Saturna) są oceany ciekłej wody – to jedne z najciekawszych miejsc do szukania życia.','Beneath the icy crusts of Europa (a moon of Jupiter) and Enceladus (a moon of Saturn) lie oceans of liquid water – some of the most exciting places to look for life.']]},
 {i:'🪨',t:['Planetoidy','Asteroids'],p:[
  ['Planetoidy (asteroidy) to małe, skaliste lub metaliczne ciała krążące wokół Słońca – od kilku metrów do kilkuset kilometrów średnicy.','Asteroids are small rocky or metallic bodies orbiting the Sun – from a few metres to a few hundred kilometres across.'],
  ['Większość krąży w pasie planetoid między Marsem a Jowiszem. Wbrew scenom z filmów są tam bardzo daleko od siebie – sondy przelatują przez pas bez problemu.','Most of them orbit in the asteroid belt between Mars and Jupiter. Unlike in the films, they’re very far apart – space probes fly through the belt with no trouble.']]},
 {i:'☄️',t:['Komety, pas Kuipera i obłok Oorta','Comets, the Kuiper Belt and the Oort Cloud'],p:[
  ['Komety to bryły lodu, pyłu i skał – „brudne śnieżki”. Gdy zbliżają się do Słońca, lód paruje i tworzy świecącą głowę (komę) oraz warkocz, który zawsze jest skierowany od Słońca.','Comets are lumps of ice, dust and rock – “dirty snowballs”. As they near the Sun, the ice turns to gas, forming a glowing head (coma) and a tail that always points away from the Sun.'],
  ['Pochodzą z dalekich obszarów: pasa Kuipera (za orbitą Neptuna, ok. 30–50 AU od Słońca), w którym krąży też Pluton, oraz z obłoku Oorta – ogromnej, kulistej „chmury” lodowych ciał, która może sięgać nawet ok. 100 000 AU.','They come from far-off regions: the Kuiper Belt (beyond Neptune, about 30–50 AU from the Sun), where Pluto also orbits, and the Oort Cloud – a vast spherical “cloud” of icy bodies that may stretch out to about 100,000 AU.'],
  ['Najsłynniejsza, kometa Halleya, wraca co ok. 76 lat. Następny raz zobaczymy ją w 2061 roku.','The most famous one, Halley’s Comet, comes back about every 76 years. It will next be visible in 2061.']]},
 {i:'🌠',t:['Meteoroid, meteor, meteoryt','Meteoroid, meteor, meteorite'],
  li:[['Meteoroid – mały okruch skały lub metalu w przestrzeni kosmicznej.','Meteoroid – a small piece of rock or metal in space.'],['Meteor – świetlny ślad, gdy meteoroid spala się w atmosferze („spadająca gwiazda”).','Meteor – the streak of light when a meteoroid burns up in the atmosphere (a “shooting star”).'],['Meteoryt – fragment, który przetrwał lot przez atmosferę i spadł na Ziemię.','Meteorite – a piece that survives the trip through the atmosphere and lands on Earth.']],
  p2:[['Co roku w sierpniu można oglądać Perseidy – rój meteorów, które powstają, gdy Ziemia przechodzi przez pył pozostawiony przez kometę Swift–Tuttle.','Every August you can watch the Perseids – a meteor shower that happens when Earth passes through dust left behind by Comet Swift–Tuttle.']]},
 {i:'📏',t:['Jak mierzymy odległości w kosmosie?','How do we measure distances in space?'],
  li:[['Jednostka astronomiczna (AU) – średnia odległość Ziemi od Słońca: ok. 149,6 mln km. Wygodna w Układzie Słonecznym.','Astronomical unit (AU) – the average distance from Earth to the Sun: about 149.6 million km. Handy within the Solar System.'],['Rok świetlny – droga, jaką światło pokonuje w ciągu roku: ok. 9,46 bln km.','Light year – the distance light travels in a year: about 9.46 trillion km.'],['Parsek – ok. 3,26 roku świetlnego; ulubiona jednostka astronomów.','Parsec – about 3.26 light years; astronomers’ favourite unit.']],
  p2:[['Patrząc daleko, patrzymy w przeszłość. Światło ze Słońca leci do nas ok. 8 minut, a z najbliższej gwiazdy, Proksymy Centauri (ok. 4,2 roku świetlnego), ponad 4 lata.','Looking far away means looking back in time. Light from the Sun takes about 8 minutes to reach us, and light from the nearest star, Proxima Centauri (about 4.2 light years away), takes more than 4 years.']]},
];
function viewUniverse(){
  const P=a=>(a||[]).map(x=>`<p>${esc(T(x))}</p>`).join('');
  return `<section class="card"><h2 style="margin:0 0 4px">${tr('Twój kosmiczny adres','Your cosmic address')}</h2><p class="note">${tr('Od najmniejszego do największego – każdy poziom mieści w sobie poprzedni.','From smallest to largest – each level contains the one before it.')}</p>
   <ol class="ladder">${LADDER.map(([i,t,d])=>`<li><span class="ic" aria-hidden="true">${i}</span><span><b>${esc(T(t))}</b>${esc(T(d))}</span></li>`).join('')}</ol></section>
   <div class="ugrid">${UCARDS.map(c=>`<section class="card ucard"><h3><span aria-hidden="true">${c.i}</span>${esc(T(c.t))}</h3>${P(c.p)}${c.li?`<ul>${c.li.map(x=>`<li>${esc(T(x))}</li>`).join('')}</ul>`:''}${P(c.p2)}</section>`).join('')}</div>`;
}

// ---------- quiz ----------
const QT=[
 {k:'year',max:1,q:['Która z tych planet ma najdłuższy rok?','Which of these planets has the longest year?'],v:p=>T(p.yearS)},
 {k:'year',max:0,q:['Która z tych planet najszybciej okrąża Słońce?','Which of these planets orbits the Sun fastest?'],v:p=>T(p.yearS)},
 {k:'day',max:0,q:['Która z tych planet obraca się najszybciej (ma najkrótszą dobę)?','Which of these planets spins fastest (has the shortest day)?'],v:p=>T(p.dayS)},
 {k:'diam',max:1,q:['Która z tych planet jest największa?','Which of these planets is the largest?'],v:p=>`${NF(p.diam)} km`},
 {k:'diam',max:0,q:['Która z tych planet jest najmniejsza?','Which of these planets is the smallest?'],v:p=>`${NF(p.diam)} km`},
 {k:'dist',max:1,q:['Która z tych planet jest najdalej od Słońca?','Which of these planets is furthest from the Sun?'],v:p=>`${NF(p.dist,1)} ${tr('mln km','million km')}`},
 {k:'dist',max:0,q:['Która z tych planet jest najbliżej Słońca?','Which of these planets is closest to the Sun?'],v:p=>`${NF(p.dist,1)} ${tr('mln km','million km')}`},
 {k:'moons',max:1,q:['Która z tych planet ma najwięcej księżyców?','Which of these planets has the most moons?'],v:p=>p.moons?moonsTxt(p.moons):tr('brak księżyców','no moons')},
 {k:'temp',max:1,q:['Na której z tych planet jest najwyższa średnia temperatura?','Which of these planets has the highest average temperature?'],v:p=>temp(p.temp)},
 {k:'fact'},{k:'fact'},{k:'fact'},
];
const pick=(a,n)=>{const c=[...a],o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return o;};
function newQ(){
  const t=QT[Math.floor(Math.random()*QT.length)];
  if(t.k==='fact'){const ans=pick(PLANETS,1)[0];const fi=Math.floor(Math.random()*ans.facts.length);
    const opts=pick([ans,...pick(PLANETS.filter(p=>p!==ans),3)],4);S.q={t,fi,ans:ans.id,opts:opts.map(p=>p.id),picked:null};return;}
  let opts;do{opts=pick(PLANETS,4);}while(t.k==='moons'&&opts.filter(p=>p.moons===Math.max(...opts.map(o=>o.moons))).length>1);
  const best=opts.reduce((a,b)=>t.max?(b[t.k]>a[t.k]?b:a):(b[t.k]<a[t.k]?b:a));
  S.q={t,ans:best.id,opts:opts.map(p=>p.id),picked:null};
}
function viewQuiz(){
  if(!S.q)newQ();
  const q=S.q,P=id=>PLANETS.find(p=>p.id===id),done=q.picked!==null;
  const question=q.t.k==='fact'?`${tr('Której planety dotyczy ta ciekawostka?','Which planet is this fact about?')}<br><span style="font-weight:400">„${esc(T(P(q.ans).facts[q.fi]))}”</span>`:esc(T(q.t.q));
  const opt=id=>{const p=P(id),cls=done?(id===q.ans?'ok':id===q.picked?'no':''):'';
    return `<button data-ans="${id}" class="${cls}" ${done?'disabled':''}><svg width="30" height="30" viewBox="-15 -15 30 30" aria-hidden="true"><defs>${grad(p)}</defs><circle r="13" fill="url(#g-${p.id})"/></svg><span>${esc(T(p.n))}${done&&q.t.v?`<small>${esc(q.t.v(p))}</small>`:''}</span></button>`;};
  const fb=done?(q.picked===q.ans?tr('✅ Dobrze!','✅ Correct!'):tr(`❌ Niestety. Poprawna odpowiedź: ${T(P(q.ans).n)}.`,`❌ Not quite. The right answer is ${T(P(q.ans).n)}.`)):'';
  return `<section class="card"><p class="score">${tr('Wynik','Score')}: ${S.ok} / ${S.all}</p><p class="q">${question}</p>
   <div class="opts">${q.opts.map(opt).join('')}</div>
   ${done?`<p class="fb" role="status">${esc(fb)}</p><button class="btn primary" id="nextQ">${tr('Następne pytanie →','Next question →')}</button>`:''}</section>`;
}

// ---------- całość ----------
function render(){
  document.documentElement.lang=L;document.title=T(UI.t1);
  $('#t1').textContent=T(UI.t1);$('#t2').textContent=T(UI.t2);
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
  $('#tabs').innerHTML=Object.entries(UI.tabs).map(([k,v])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(T(v))}</button>`).join('');
  $('#app').innerHTML={planets:viewPlanets,compare:viewCompare,universe:viewUniverse,quiz:viewQuiz}[S.tab]();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lang],[data-tab],[data-p],[data-sort],[data-ans],#nextQ');if(!b)return;
  if(b.dataset.lang){L=b.dataset.lang;try{localStorage.setItem('ukladLang',L);}catch(_){}}
  else if(b.dataset.tab)S.tab=b.dataset.tab;
  else if(b.dataset.p)S.sel=b.dataset.p;
  else if(b.dataset.sort){S.dir=S.sort===b.dataset.sort?-S.dir:1;S.sort=b.dataset.sort;}
  else if(b.dataset.ans){if(S.q.picked!==null)return;S.q.picked=b.dataset.ans;S.all++;if(b.dataset.ans===S.q.ans)S.ok++;}
  else if(b.id==='nextQ')newQ();
  render();
  if(b.id==='nextQ'||b.dataset.ans)$('#app .opts button, #nextQ')?.focus();
});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('svg [data-p]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.sel=g.dataset.p;render();$(`svg [data-p="${S.sel}"]`)?.focus();}});
document.addEventListener('change',e=>{if(e.target.id==='scaleChk'){S.scale=e.target.checked;render();}});
document.addEventListener('input',e=>{if(e.target.id==='kg'||e.target.id==='age'){S[e.target.id]=e.target.value;const id=e.target.id,pos=e.target.selectionStart;render();const el=$('#'+id);el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}});
render();
